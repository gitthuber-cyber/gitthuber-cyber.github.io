<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oyunlar 🎮</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        overflow: hidden;
        background: #070817;
    }

    /* ANA ARKA PLAN */
    .arka-plan {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background:
            radial-gradient(
                circle at 15% 20%,
                rgba(124, 60, 255, 0.35),
                transparent 30%
            ),
            radial-gradient(
                circle at 85% 75%,
                rgba(0, 140, 255, 0.25),
                transparent 32%
            ),
            radial-gradient(
                circle at 50% 100%,
                rgba(170, 40, 255, 0.18),
                transparent 35%
            ),
            #070817;
        z-index: -5;
    }

    /* NEON IŞIKLAR */
    .isik {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.45;
        animation: hareket 8s ease-in-out infinite alternate;
    }

    .isik1 {
        width: 280px;
        height: 280px;
        background: #713cff;
        top: -100px;
        left: -80px;
    }

    .isik2 {
        width: 240px;
        height: 240px;
        background: #168cff;
        right: -70px;
        bottom: -70px;
        animation-delay: 2s;
    }

    .isik3 {
        width: 180px;
        height: 180px;
        background: #b42cff;
        left: 45%;
        top: 65%;
        animation-delay: 4s;
    }

    @keyframes hareket {
        from {
            transform: translate(0, 0) scale(1);
        }

        to {
            transform: translate(40px, -30px) scale(1.15);
        }
    }

    /* OYUN ÇİZGİLERİ */
    .cizgiler {
        position: absolute;
        inset: 0;
        opacity: 0.16;
        background-image:
            linear-gradient(
                rgba(130, 90, 255, 0.35) 1px,
                transparent 1px
            ),
            linear-gradient(
                90deg,
                rgba(130, 90, 255, 0.35) 1px,
                transparent 1px
            );
        background-size: 55px 55px;
        transform: perspective(500px) rotateX(55deg) scale(1.5);
        transform-origin: bottom;
        top: 45%;
    }

    /* UÇAN OYUN ŞEKİLLERİ */
    .sekil {
        position: absolute;
        border: 2px solid rgba(150, 100, 255, 0.35);
        transform: rotate(45deg);
        animation: sekilHareket 10s linear infinite;
    }

    .sekil1 {
        width: 35px;
        height: 35px;
        top: 15%;
        left: 12%;
    }

    .sekil2 {
        width: 20px;
        height: 20px;
        top: 70%;
        left: 20%;
        animation-delay: 3s;
    }

    .sekil3 {
        width: 45px;
        height: 45px;
        top: 25%;
        right: 12%;
        animation-delay: 5s;
    }

    .sekil4 {
        width: 25px;
        height: 25px;
        bottom: 15%;
        right: 25%;
        animation-delay: 7s;
    }

    @keyframes sekilHareket {
        0% {
            transform: translateY(0) rotate(45deg);
            opacity: 0.2;
        }

        50% {
            transform: translateY(-35px) rotate(180deg);
            opacity: 0.6;
        }

        100% {
            transform: translateY(0) rotate(360deg);
            opacity: 0.2;
        }
    }

    /* ANA KUTU */
    .kutu {
        position: relative;
        width: 90%;
        max-width: 650px;
        padding: 35px 25px;
        background: rgba(15, 15, 35, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 25px;
        backdrop-filter: blur(18px);
        box-shadow:
            0 20px 60px rgba(0, 0, 0, 0.55),
            0 0 50px rgba(100, 50, 255, 0.12);
    }

    /* GERİ */
    .geri {
        display: inline-block;
        color: #bbb;
        text-decoration: none;
        margin-bottom: 22px;
        font-size: 15px;
        transition: 0.25s;
    }

    .geri:hover {
        color: white;
        transform: translateX(-4px);
    }

    /* BAŞLIK */
    h1 {
        font-size: 40px;
        margin-bottom: 10px;
        text-shadow:
            0 0 15px rgba(140, 80, 255, 0.8);
    }

    .aciklama {
        color: #aaa;
        margin-bottom: 30px;
        font-size: 16px;
    }

    /* OYUN KARTI */
    .oyun-kart {
        display: block;
        text-decoration: none;
        color: white;
        padding: 28px 22px;
        border-radius: 20px;

        background:
            linear-gradient(
                135deg,
                rgba(124, 60, 255, 0.24),
                rgba(20, 120, 255, 0.12)
            );

        border: 1px solid rgba(150, 100, 255, 0.45);

        box-shadow:
            inset 0 0 25px rgba(124, 60, 255, 0.08),
            0 10px 35px rgba(0, 0, 0, 0.25);

        transition: 0.3s;
    }

    .oyun-kart:hover {
        transform: translateY(-6px) scale(1.02);

        background:
            linear-gradient(
                135deg,
                rgba(124, 60, 255, 0.38),
                rgba(20, 120, 255, 0.2)
            );

        border-color: rgba(180, 140, 255, 0.7);

        box-shadow:
            0 0 30px rgba(124, 60, 255, 0.25),
            0 15px 40px rgba(0, 0, 0, 0.35);
    }

    /* OYUN İKONU */
    .oyun-emoji {
        font-size: 52px;
        margin-bottom: 12px;
        filter:
            drop-shadow(0 0 12px rgba(150, 100, 255, 0.7));
    }

    .oyun-kart h2 {
        font-size: 27px;
        margin-bottom: 9px;
    }

    .oyun-kart p {
        color: #bbb;
        font-size: 14px;
        line-height: 1.5;
    }

    /* ALT ETİKET */
    .etiket {
        display: inline-block;
        margin-top: 18px;
        padding: 7px 13px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.07);
        color: #aaa;
        font-size: 12px;
    }

    @media (max-width: 600px) {

        h1 {
            font-size: 31px;
        }

        .kutu {
            width: 92%;
            padding: 30px 18px;
        }

        .oyun-kart {
            padding: 24px 18px;
        }

        .oyun-emoji {
            font-size: 45px;
        }

        .cizgiler {
            background-size: 40px 40px;
        }
    }
</style>
</head>

<body>

<!-- ARKA PLAN -->
<div class="arka-plan">

    <div class="isik isik1"></div>
    <div class="isik isik2"></div>
    <div class="isik isik3"></div>

    <div class="cizgiler"></div>

    <div class="sekil sekil1"></div>
    <div class="sekil sekil2"></div>
    <div class="sekil sekil3"></div>
    <div class="sekil sekil4"></div>

</div>


<!-- İÇERİK -->
<div class="kutu">

    <a href="index.html" class="geri">
        ← Ana Sayfa
    </a>

    <h1>🎮 Oyunlar</h1>

    <p class="aciklama">
        Oynamak istediğin oyunu seç.
    </p>


    <!-- KAÇ! OYUNU -->
    <a href="hesap-makinesi.html" class="oyun-kart">

        <div class="oyun-emoji">
            🏃
        </div>

        <h2>Kaç!</h2>

        <p>
            Engellerden kaç, puanını yükselt
            ve mümkün olduğunca uzun süre hayatta kal!
        </p>

        <div class="etiket">
            🎮 Oyna
        </div>

    </a>

</div>

</body>
</html>
