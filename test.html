<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Easter Egg Test</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(124,60,255,.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(70,100,255,.12),
            transparent 35%
        ),
        #080c18;

    color: white;

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================
   TEST KUTUSU
========================================= */

.test-kutu {
    width: 90%;
    max-width: 500px;
    padding: 35px;
    text-align: center;

    background: rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.13);

    border-radius: 24px;

    backdrop-filter: blur(15px);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.4);
}

.test-kutu h1 {
    margin-bottom: 12px;
}

.test-kutu p {
    color: #aaa;
    margin-bottom: 25px;
}

#easterEggBtn {
    border: none;

    padding: 14px 25px;

    border-radius: 13px;

    background: #7c3cff;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

#easterEggBtn:hover {
    background: #955fff;
    transform: scale(1.03);
}


/* =========================================
   RARE SCREEN
========================================= */

#rareScreen {
    position: fixed;
    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #160000 0%,
            #050000 40%,
            #000 75%
        );

    z-index: 9999;

    overflow: hidden;
}

#rareScreen.aktif {
    display: flex;
}


/* =========================================
   KIRMIZI ORTAM
========================================= */

#rareScreen::before {
    content: "";

    position: absolute;

    width: 75vw;
    height: 75vw;

    max-width: 900px;
    max-height: 900px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(180,0,0,.22),
            rgba(80,0,0,.08) 45%,
            transparent 70%
        );

    animation:
        ortamTitreme
        1.8s
        infinite
        alternate;

    pointer-events: none;
}

@keyframes ortamTitreme {

    from {
        opacity: .25;
        transform: scale(.88);
    }

    to {
        opacity: .8;
        transform: scale(1.12);
    }
}


/* =========================================
   KARAKTER
========================================= */

.rare-karakter {
    position: absolute;
    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    transform:
        scale(.55)
        translateY(35px);

    opacity: 0;

    animation:
        karakterGelir
        1.3s
        ease
        forwards;
}


/* =========================================
   KAFA
========================================= */

.rare-kafa {
    position: relative;

    width: min(82vw, 620px);
    height: min(82vw, 620px);

    max-height: 85vh;

    border-radius:
        43%
        43%
        48%
        48%;

    background:
        radial-gradient(
            ellipse at 50% 20%,
            #3b3b3b 0%,
            #191919 38%,
            #080808 70%,
            #000 100%
        );

    box-shadow:

        0 0 30px
        rgba(170,0,0,.25),

        0 0 80px
        rgba(120,0,0,.2),

        inset 0 -90px 110px
        rgba(0,0,0,.95);
}


/* =========================================
   ŞEYTANİ KAŞLAR
========================================= */

.rare-kafa::before {
    content: "";

    position: absolute;

    top: 22%;

    left: 8%;

    width: 84%;

    height: 15%;

    background:
        linear-gradient(
            165deg,
            transparent 0%,
            transparent 18%,
            #020202 19%,
            #000 55%,
            transparent 56%
        );

    filter:
        drop-shadow(
            0 6px 5px
            #000
        );

    opacity: 1;
}


/* =========================================
   ALT YÜZ GÖLGESİ
========================================= */

.rare-kafa::after {
    content: "";

    position: absolute;

    left: 12%;
    bottom: 8%;

    width: 76%;
    height: 30%;

    background:
        radial-gradient(
            ellipse,
            rgba(0,0,0,.85),
            transparent 70%
        );

    pointer-events: none;
}


/* =========================================
   GÖZLER
========================================= */

.rare-goz {
    position: absolute;

    top: 32%;

    width: 22%;
    height: 7%;

    background:
        radial-gradient(
            ellipse at center,

            #ffffff 0%,

            #ff6666 28%,

            #d00000 52%,

            #300000 100%
        );

    border-radius:
        50%
        50%
        35%
        35%;

    box-shadow:

        0 0 10px
        rgba(255,0,0,1),

        0 0 28px
        rgba(220,0,0,.85),

        0 0 55px
        rgba(130,0,0,.6);

    overflow: hidden;
}


/* =========================================
   GÖZ BEBEĞİ
========================================= */

.rare-goz::after {
    content: "";

    position: absolute;

    left: 45%;

    top: -15%;

    width: 10%;

    height: 130%;

    background: #030000;

    border-radius: 50%;

    box-shadow:
        0 0 9px #000;
}


/* =========================================
   SOL GÖZ
========================================= */

.rare-goz.sol {
    left: 14%;

    transform:
        rotate(21deg)
        skewX(-17deg);
}


/* =========================================
   SAĞ GÖZ
========================================= */

.rare-goz.sag {
    right: 14%;

    transform:
        rotate(-21deg)
        skewX(17deg);
}


/* =========================================
   GÖZ ÜSTÜ KESKİN GÖLGELER
========================================= */

.rare-goz.sol::before,
.rare-goz.sag::before {
    content: "";

    position: absolute;

    width: 135%;
    height: 70%;

    top: -48%;

    background: #020202;

    border-radius: 50%;
}

.rare-goz.sol::before {
    left: -10%;

    transform:
        rotate(-15deg);
}

.rare-goz.sag::before {
    right: -10%;

    transform:
        rotate(15deg);
}


/* =========================================
   AĞIZ
========================================= */

.rare-agiz {
    position: absolute;

    left: 10%;

    bottom: 15%;

    width: 80%;
    height: 22%;

    background:
        radial-gradient(
            ellipse at center,
            #420000,
            #100000 60%,
            #030000 100%
        );

    border:
        4px solid
        #650000;

    border-radius:
        10%
        10%
        50%
        50%;

    transform:
        scaleX(.04)
        scaleY(.12);

    transform-origin:
        center;

    animation:
        gulus
        1.8s
        cubic-bezier(.22,.7,.25,1)
        forwards;

    animation-delay:
        .55s;

    box-shadow:

        0 0 25px
        rgba(180,0,0,.5),

        inset 0 -18px 25px
        rgba(0,0,0,.95);
}


/* =========================================
   ÜST DİŞLER
========================================= */

.rare-agiz::before {
    content:
        "▼ ▼ ▼ ▼ ▼ ▼ ▼ ▼";

    position: absolute;

    left: 4%;
    top: 5%;

    width: 92%;

    color: #eee;

    font-size:
        clamp(
            15px,
            3vw,
            28px
        );

    letter-spacing:
        clamp(
            2px,
            1vw,
            8px
        );

    text-align: center;

    white-space: nowrap;

    text-shadow:
        0 0 6px #fff;
}


/* =========================================
   ALT DİŞLER
========================================= */

.rare-agiz::after {
    content:
        "▲ ▲ ▲ ▲ ▲ ▲ ▲ ▲";

    position: absolute;

    left: 4%;
    bottom: 1%;

    width: 92%;

    color: #bbb;

    font-size:
        clamp(
            12px,
            2.5vw,
            23px
        );

    letter-spacing:
        clamp(
            2px,
            1vw,
            7px
        );

    text-align: center;

    white-space: nowrap;
}


/* =========================================
   AKICI GÜLÜŞ
========================================= */

@keyframes gulus {

    0% {
        transform:
            scaleX(.04)
            scaleY(.12);

        border-radius: 50%;
    }

    30% {
        transform:
            scaleX(.32)
            scaleY(.28);

        border-radius: 32%;
    }

    55% {
        transform:
            scaleX(.60)
            scaleY(.55);

        border-radius: 20%;
    }

    75% {
        transform:
            scaleX(.83)
            scaleY(.78);

        border-radius:
            13%
            13%
            42%
            42%;
    }

    90% {
        transform:
            scaleX(.94)
            scaleY(.92);
    }

    100% {
        transform:
            scaleX(1)
            scaleY(1);

        border-radius:
            10%
            10%
            50%
            50%;
    }
}


/* =========================================
   KARAKTER GELİŞİ
========================================= */

@keyframes karakterGelir {

    0% {
        opacity: 0;

        transform:
            scale(.55)
            translateY(40px);
    }

    45% {
        opacity: 1;

        transform:
            scale(.92)
            translateY(0);
    }

    70% {
        transform:
            scale(1.03)
            translateY(0);
    }

    100% {
        opacity: 1;

        transform:
            scale(1)
            translateY(0);
    }
}


/* =========================================
   YAZI
========================================= */

#rareYazi {
    position: absolute;

    left: 50%;
    bottom: 6%;

    transform:
        translateX(-50%);

    width: 92%;

    text-align: center;

    color: white;

    font-size:
        clamp(
            18px,
            4vw,
            34px
        );

    font-weight: bold;

    text-shadow:
        0 0 8px #000,
        0 0 15px #000;

    z-index: 5;

    opacity: 0;
}

#rareYazi.goster {
    animation:
        yaziGelir
        .4s
        ease
        forwards;
}

@keyframes yaziGelir {

    from {
        opacity: 0;

        transform:
            translateX(-50%)
            translateY(10px);
    }

    to {
        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0);
    }
}


/* =========================================
   GLITCH
========================================= */

#rareScreen.glitch::after {
    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 20;

    background:
        repeating-linear-gradient(
            to bottom,

            rgba(255,0,0,.045) 0px,

            rgba(255,0,0,.045) 2px,

            transparent 2px,

            transparent 5px
        );

    animation:
        scan
        .12s
        infinite;
}

@keyframes scan {

    0% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(3px);
    }

    100% {
        transform:
            translateY(-2px);
    }
}


/* =========================================
   MOBİL
========================================= */

@media (max-width: 600px) {

    .rare-kafa {
        width: 95vw;
        height: 95vw;
    }

    .test-kutu {
        padding: 28px 20px;
    }
}

</style>
</head>

<body>


<div class="test-kutu">

    <h1>😈 Easter Egg Test</h1>

    <p>
        Sadece geliştirici test alanı.
    </p>

    <button id="easterEggBtn">
        👁️ Easter Egg'i Göster
    </button>

</div>


<div id="rareScreen">

    <div class="rare-karakter">

        <div class="rare-kafa">

            <div class="rare-goz sol"></div>

            <div class="rare-goz sag"></div>

            <div class="rare-agiz"></div>

        </div>

    </div>

    <div id="rareYazi"></div>

</div>


<script>

const easterEggBtn =
    document.getElementById(
        "easterEggBtn"
    );

const rareScreen =
    document.getElementById(
        "rareScreen"
    );

const rareYazi =
    document.getElementById(
        "rareYazi"
    );

let rareAktif = false;

let rareTimerlar = [];


function rareTimerOlustur(
    callback,
    sure
) {

    const timer =
        setTimeout(
            () => {

                const index =
                    rareTimerlar.indexOf(
                        timer
                    );

                if (index !== -1) {

                    rareTimerlar.splice(
                        index,
                        1
                    );
                }

                callback();

            },
            sure
        );

    rareTimerlar.push(timer);

    return timer;
}


function rareTimerlariniTemizle() {

    rareTimerlar.forEach(
        timer => {

            clearTimeout(
                timer
            );

        }
    );

    rareTimerlar = [];
}


function rareScreenBaslat() {

    if (rareAktif) {
        return;
    }

    rareAktif = true;

    rareTimerlariniTemizle();

    rareScreen.classList.add(
        "aktif"
    );

    rareScreen.classList.add(
        "glitch"
    );

    rareYazi.classList.remove(
        "goster"
    );

    rareYazi.textContent = "";


    rareTimerOlustur(
        () => {

            rareScreen.classList.remove(
                "glitch"
            );

        },
        450
    );


    const kelimeler = [
        "bu",
        "normal",
        "bir",
        "oyun",
        "değil..."
    ];

    let mevcut = [];

    let kelimeIndex = 0;


    function sonrakiKelime() {

        if (!rareAktif) {
            return;
        }


        if (
            kelimeIndex >=
            kelimeler.length
        ) {

            rareTimerOlustur(
                () => {

                    rareScreenBitir();

                },
                2000
            );

            return;
        }


        mevcut.push(
            kelimeler[
                kelimeIndex
            ]
        );


        rareYazi.textContent =
            mevcut.join(" ");


        rareYazi.classList.remove(
            "goster"
        );

        void rareYazi.offsetWidth;

        rareYazi.classList.add(
            "goster"
        );


        kelimeIndex++;


        if (
            kelimeIndex <
            kelimeler.length
        ) {

            rareTimerOlustur(
                sonrakiKelime,
                500
            );

        } else {

            rareTimerOlustur(
                sonrakiKelime,
                0
            );

        }
    }


    rareTimerOlustur(
        () => {

            sonrakiKelime();

        },
        2000
    );
}


function rareScreenBitir() {

    rareTimerlariniTemizle();

    rareScreen.classList.remove(
        "aktif"
    );

    rareScreen.classList.remove(
        "glitch"
    );

    rareYazi.classList.remove(
        "goster"
    );

    rareYazi.textContent = "";

    rareAktif = false;
}


easterEggBtn.addEventListener(
    "click",
    () => {

        rareScreenBaslat();

    }
);

</script>

</body>
</html>
