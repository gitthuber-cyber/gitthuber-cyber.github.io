<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Easter Egg Test</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(124,60,255,.18), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(70,100,255,.12), transparent 35%),
        #080c18;
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.test-kutu {
    width: 90%;
    max-width: 500px;
    padding: 35px;
    text-align: center;

    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 24px;

    backdrop-filter: blur(15px);
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
}

.test-kutu h1 {
    margin-bottom: 12px;
}

.test-kutu p {
    color: #aaa;
    margin-bottom: 25px;
}

#easterEggBtn {
    border: none;
    padding: 14px 25px;
    border-radius: 13px;

    background: #7c3cff;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

#easterEggBtn:hover {
    background: #955fff;
    transform: scale(1.03);
}


/* =========================================
   RARE SCREEN
========================================= */

#rareScreen {
    position: fixed;
    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background: #000;

    z-index: 9999;

    overflow: hidden;
}

#rareScreen.aktif {
    display: flex;
}

.rare-karakter {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    transform: scale(.65);
    opacity: 0;

    animation: karakterGelir 1.1s ease forwards;
}

.rare-kafa {
    position: relative;

    width: min(82vw, 620px);
    height: min(82vw, 620px);
    max-height: 85vh;

    border-radius: 48% 48% 44% 44%;

    background:
        radial-gradient(
            circle at 50% 35%,
            #303030,
            #111 55%,
            #020202 100%
        );

    box-shadow:
        0 0 50px rgba(255,255,255,.04),
        inset 0 -50px 80px rgba(0,0,0,.8);
}

.rare-goz {
    position: absolute;

    top: 32%;

    width: 15%;
    height: 7%;

    background: #eee;

    border-radius: 50%;

    box-shadow:
        0 0 25px rgba(255,255,255,.35);
}

.rare-goz.sol {
    left: 19%;
    transform: rotate(12deg);
}

.rare-goz.sag {
    right: 19%;
    transform: rotate(-12deg);
}

.rare-goz::after {
    content: "";

    position: absolute;

    width: 35%;
    height: 100%;

    background: #050505;

    border-radius: 50%;

    left: 33%;
}

.rare-agiz {
    position: absolute;

    left: 16%;
    bottom: 19%;

    width: 68%;
    height: 13%;

    border-bottom: 10px solid #eee;

    border-radius: 0 0 50% 50%;

    transform: scaleX(.1);

    transform-origin: center;

    animation: gulus 1.5s ease forwards;

    animation-delay: .5s;
}

.rare-agiz::before,
.rare-agiz::after {
    content: "";

    position: absolute;

    width: 10%;
    height: 70%;

    background: #eee;

    top: -10%;
}

.rare-agiz::before {
    left: 0;
    transform: rotate(30deg);
}

.rare-agiz::after {
    right: 0;
    transform: rotate(-30deg);
}

@keyframes karakterGelir {

    0% {
        opacity: 0;
        transform: scale(.65);
    }

    60% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes gulus {

    0% {
        transform: scaleX(.05);
    }

    35% {
        transform: scaleX(.25);
    }

    70% {
        transform: scaleX(.65);
    }

    100% {
        transform: scaleX(1);
    }
}


/* =========================================
   YAZI
========================================= */

#rareYazi {
    position: absolute;

    left: 50%;
    bottom: 7%;

    transform: translateX(-50%);

    width: 90%;

    text-align: center;

    color: white;

    font-size: clamp(18px, 4vw, 34px);

    font-weight: bold;

    letter-spacing: .5px;

    text-shadow: 0 0 12px black;

    z-index: 5;

    opacity: 0;
}

#rareYazi.goster {
    animation: yaziGelir .4s ease forwards;
}

@keyframes yaziGelir {

    from {
        opacity: 0;

        transform:
            translateX(-50%)
            translateY(10px);
    }

    to {
        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0);
    }
}


/* =========================================
   GLITCH
========================================= */

#rareScreen.glitch::before,
#rareScreen.glitch::after {
    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 20;
}

#rareScreen.glitch::before {

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.03) 0px,
            rgba(255,255,255,.03) 2px,
            transparent 2px,
            transparent 5px
        );

    animation: scan .12s infinite;
}

@keyframes scan {

    0% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(3px);
    }

    100% {
        transform: translateY(-2px);
    }
}
</style>
</head>

<body>


<div class="test-kutu">

    <h1>🛠️ Easter Egg Test</h1>

    <p>
        Bu sayfa sadece geliştirici testi içindir.
    </p>

    <button id="easterEggBtn">
        👁️ Easter Egg'i Göster
    </button>

</div>


<!-- =========================================
     RARE SCREEN
========================================= -->

<div id="rareScreen">

    <div class="rare-karakter">

        <div class="rare-kafa">

            <div class="rare-goz sol"></div>

            <div class="rare-goz sag"></div>

            <div class="rare-agiz"></div>

        </div>

    </div>

    <div id="rareYazi"></div>

</div>


<script>

const easterEggBtn =
    document.getElementById("easterEggBtn");

const rareScreen =
    document.getElementById("rareScreen");

const rareYazi =
    document.getElementById("rareYazi");


let rareAktif = false;

let rareTimerlar = [];


/* =========================================
   TIMER
========================================= */

function rareTimerOlustur(callback, sure) {

    const timer = setTimeout(() => {

        const index =
            rareTimerlar.indexOf(timer);

        if (index !== -1) {

            rareTimerlar.splice(
                index,
                1
            );

        }

        callback();

    }, sure);

    rareTimerlar.push(timer);

    return timer;
}


function rareTimerlariniTemizle() {

    rareTimerlar.forEach(timer => {

        clearTimeout(timer);

    });

    rareTimerlar = [];

}


/* =========================================
   EASTER EGG
========================================= */

function rareScreenBaslat() {

    if (rareAktif) {
        return;
    }

    rareAktif = true;

    rareTimerlariniTemizle();

    rareScreen.classList.add(
        "aktif"
    );

    rareScreen.classList.add(
        "glitch"
    );

    rareYazi.classList.remove(
        "goster"
    );

    rareYazi.textContent = "";


    /* İlk glitch */

    rareTimerOlustur(() => {

        rareScreen.classList.remove(
            "glitch"
        );

    }, 450);


    /*
       2 saniye sonra cümle başlar.

       2.00 → bu
       2.50 → bu normal
       3.00 → bu normal bir
       3.50 → bu normal bir oyun
       4.00 → bu normal bir oyun değil...

       Son kelimeden sonra
       2 saniye bekler.

       Yaklaşık 6 saniyede biter.
    */

    const kelimeler = [
        "bu",
        "normal",
        "bir",
        "oyun",
        "değil..."
    ];

    let mevcut = [];

    let kelimeIndex = 0;


    function sonrakiKelime() {

        if (!rareAktif) {
            return;
        }

        if (
            kelimeIndex >=
            kelimeler.length
        ) {

            rareTimerOlustur(() => {

                rareScreenBitir();

            }, 2000);

            return;
        }


        mevcut.push(
            kelimeler[
                kelimeIndex
            ]
        );


        rareYazi.textContent =
            mevcut.join(" ");


        rareYazi.classList.remove(
            "goster"
        );

        void rareYazi.offsetWidth;

        rareYazi.classList.add(
            "goster"
        );


        kelimeIndex++;


        if (
            kelimeIndex <
            kelimeler.length
        ) {

            rareTimerOlustur(
                sonrakiKelime,
                500
            );

        }

        else {

            rareTimerOlustur(
                sonrakiKelime,
                0
            );

        }

    }


    /* İlk kelime 2 saniye sonra */

    rareTimerOlustur(() => {

        sonrakiKelime();

    }, 2000);

}


/* =========================================
   EASTER EGG BİTİR
========================================= */

function rareScreenBitir() {

    rareTimerlariniTemizle();

    rareScreen.classList.remove(
        "aktif"
    );

    rareScreen.classList.remove(
        "glitch"
    );

    rareYazi.classList.remove(
        "goster"
    );

    rareYazi.textContent = "";

    rareAktif = false;

}


/* =========================================
   BUTON
========================================= */

easterEggBtn.addEventListener(
    "click",
    () => {

        rareScreenBaslat();

    }
);

</script>

</body>
</html>
