<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Oyunlar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .arka-plan {
            position: fixed;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(108, 44, 255, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(80, 120, 255, 0.12),
                    transparent 35%
                ),
                #0b1020;
        }

        .geri {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-size: 32px;
            z-index: 10;
        }

        .kutu {
            position: relative;
            z-index: 2;
            width: 300px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .kutu h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .buton {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            background: #7c3cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .buton:hover {
            background: #955fff;
            transform: scale(1.03);
        }

        .ekran {
            display: none;
            position: relative;
            z-index: 2;
            width: 300px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .kapat {
            position: absolute;
            top: 8px;
            right: 12px;
            border: none;
            background: none;
            color: white;
            font-size: 25px;
            cursor: pointer;
        }

        .ekran h1 {
            font-size: 22px;
            margin-bottom: 15px;
        }

        /* HESAP MAKİNESİ */

        #hesapEkrani {
            width: 100%;
            height: 50px;
            margin-bottom: 15px;
            padding: 10px;
            background: #0b1020;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 22px;
            text-align: right;
        }

        .tuslar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .tuslar button {
            height: 50px;
            border: none;
            border-radius: 8px;
            background: #7c3cff;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .tuslar button:hover {
            background: #955fff;
        }

        /* OYUN */

        #oyun {
            position: relative;
            height: 300px;
            margin-top: 10px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #skor {
            font-size: 18px;
            margin-bottom: 10px;
        }

        #oyuncu {
            position: absolute;
            bottom: 20px;
            left: 40px;
            font-size: 38px;
        }

        #engel {
            position: absolute;
            bottom: 20px;
            right: -50px;
            font-size: 35px;
        }

        .zipla {
            margin-top: 15px;
        }

        .oyun-bilgi {
            margin-top: 10px;
            font-size: 14px;
            color: #bbb;
        }

        .oyun-bitti {
            display: none;
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="arka-plan"></div>

    <a href="index.html" class="geri">←</a>

    <!-- ANA MENÜ -->

    <div class="kutu" id="menu">

        <h1>🎮 Ne yapmak istersin?</h1>

        <button class="buton" onclick="hesapAc()">
            🧮 Hesap Makinesi
        </button>

        <button class="buton" onclick="oyunAc()">
            🏃 Kaç! Oyunu
        </button>

    </div>

    <!-- HESAP MAKİNESİ -->

    <div class="ekran" id="hesap">

        <button class="kapat" onclick="kapat()">×</button>

        <h1>🧮 Hesap Makinesi</h1>

        <input type="text" id="hesapEkrani" readonly>

        <div class="tuslar">

            <button onclick="temizle()">C</button>
            <button onclick="sayiYaz('/')">÷</button>
            <button onclick="sayiYaz('*')">×</button>
            <button onclick="sayiYaz('-')">−</button>

            <button onclick="sayiYaz('7')">7</button>
            <button onclick="sayiYaz('8')">8</button>
            <button onclick="sayiYaz('9')">9</button>
            <button onclick="sayiYaz('+')">+</button>

            <button onclick="sayiYaz('4')">4</button>
            <button onclick="sayiYaz('5')">5</button>
            <button onclick="sayiYaz('6')">6</button>
            <button onclick="hesapla()">=</button>

            <button onclick="sayiYaz('1')">1</button>
            <button onclick="sayiYaz('2')">2</button>
            <button onclick="sayiYaz('3')">3</button>
            <button onclick="sayiYaz('0')">0</button>

        </div>

    </div>

    <!-- OYUN -->

    <div class="ekran" id="oyunEkrani">

        <button class="kapat" onclick="kapat()">×</button>

        <h1>🏃 KAÇ!</h1>

        <div id="skor">🔥 Skor: 0</div>

        <div id="oyun">

            <div id="oyuncu">🏃</div>

            <div id="engel">🪨</div>

        </div>

        <button class="buton zipla" onclick="zipla()">
            👆 Zıpla!
        </button>

        <div class="oyun-bilgi">
            Kayaya çarpmadan dayan!
        </div>

        <div class="oyun-bitti" id="oyunBitti">
            💀 Oyun Bitti!
            <br>
            <button class="buton" onclick="oyunuBaslat()">
                🔄 Tekrar Oyna
            </button>
        </div>

    </div>

    <script>

        /* MENÜ */

        function hesapAc() {
            document.getElementById("menu").style.display = "none";
            document.getElementById("hesap").style.display = "block";
        }

        function oyunAc() {
            document.getElementById("menu").style.display = "none";
            document.getElementById("oyunEkrani").style.display = "block";

            oyunuBaslat();
        }

        function kapat() {
            document.getElementById("hesap").style.display = "none";
            document.getElementById("oyunEkrani").style.display = "none";
            document.getElementById("menu").style.display = "block";
        }


        /* HESAP MAKİNESİ */

        function sayiYaz(sayi) {
            document.getElementById("hesapEkrani").value += sayi;
        }

        function temizle() {
            document.getElementById("hesapEkrani").value = "";
        }

        function hesapla() {
            let ekran = document.getElementById("hesapEkrani");

            if (ekran.value !== "") {
                ekran.value = eval(ekran.value);
            }
        }


        /* OYUN */

        let skor = 0;
        let oyunDevam = false;
        let oyunZamani;
        let oyuncuYuksekte = false;

        function oyunuBaslat() {

            skor = 0;
            oyunDevam = true;
            oyuncuYuksekte = false;

            document.getElementById("skor").textContent = "🔥 Skor: 0";
            document.getElementById("oyunBitti").style.display = "none";

            let engel = document.getElementById("engel");

            engel.style.right = "-50px";

            clearInterval(oyunZamani);

            oyunZamani = setInterval(() => {

                if (!oyunDevam) return;

                skor++;

                document.getElementById("skor").textContent =
                    "🔥 Skor: " + skor;

                let konum = parseInt(
                    getComputedStyle(engel).right
                );

                engel.style.right = (konum + 5) + "px";

                if (konum > 330) {
                    engel.style.right = "-50px";
                }

                kontrolEt();

            }, 100);

        }

        function zipla() {

            if (!oyunDevam || oyuncuYuksekte) return;

            oyuncuYuksekte = true;

            let oyuncu = document.getElementById("oyuncu");

            oyuncu.style.bottom = "120px";

            setTimeout(() => {
                oyuncu.style.bottom = "20px";
                oyuncuYuksekte = false;
            }, 500);
        }

        function kontrolEt() {

            let oyuncu = document.getElementById("oyuncu");
            let engel = document.getElementById("engel");

            let oyuncuRect = oyuncu.getBoundingClientRect();
            let engelRect = engel.getBoundingClientRect();

            if (
                oyuncuRect.right > engelRect.left &&
                oyuncuRect.left < engelRect.right &&
                oyuncuRect.bottom > engelRect.top &&
                oyuncuRect.top < engelRect.bottom
            ) {

                oyunDevam = false;

                clearInterval(oyunZamani);

                document.getElementById("oyunBitti").style.display = "block";
            }
        }

    </script>

</body>
</html>
