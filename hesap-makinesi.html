<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#03040c">
<title>Kaç! - Ali tarafından yapılmıştır</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#03040c;
    color:#fff;
}

body{
    position:relative;
}

/* ANA ARKA PLAN */
.arka-plan{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 18%,rgba(0,170,255,.14),transparent 30%),
        radial-gradient(circle at 20% 80%,rgba(150,0,255,.13),transparent 32%),
        radial-gradient(circle at 85% 65%,rgba(0,255,210,.09),transparent 28%),
        linear-gradient(180deg,#02030a 0%,#050713 52%,#02030a 100%);
    z-index:0;
}

/* NEON IŞIKLAR */
.isik{
    position:absolute;
    width:280px;
    height:280px;
    border-radius:50%;
    filter:blur(70px);
    opacity:.35;
    animation:isikHareket 8s ease-in-out infinite alternate;
}

.isik1{
    background:#7b00ff;
    left:-120px;
    top:10%;
}

.isik2{
    background:#00d9ff;
    right:-130px;
    top:25%;
    animation-delay:2s;
}

.isik3{
    background:#00ffb3;
    left:35%;
    bottom:-180px;
    animation-delay:4s;
}

@keyframes isikHareket{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(50px,-35px) scale(1.18);
    }
}

/* PARÇACIKLAR */
.parcacik{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#8cecff;
    box-shadow:0 0 8px #48e8ff;
    opacity:.55;
    animation:yukari 7s linear infinite;
}

.parcacik:nth-child(1){left:8%;bottom:-10px;animation-delay:0s;}
.parcacik:nth-child(2){left:17%;bottom:-20px;animation-delay:1.3s;}
.parcacik:nth-child(3){left:29%;bottom:-15px;animation-delay:3s;}
.parcacik:nth-child(4){left:42%;bottom:-20px;animation-delay:2s;}
.parcacik:nth-child(5){left:56%;bottom:-15px;animation-delay:4s;}
.parcacik:nth-child(6){left:69%;bottom:-10px;animation-delay:1s;}
.parcacik:nth-child(7){left:82%;bottom:-20px;animation-delay:2.8s;}
.parcacik:nth-child(8){left:94%;bottom:-10px;animation-delay:4.5s;}

@keyframes yukari{
    from{
        transform:translateY(0);
        opacity:0;
    }
    15%{
        opacity:.65;
    }
    to{
        transform:translateY(-110vh);
        opacity:0;
    }
}

/* ŞEHİR */
.sehir{
    position:absolute;
    left:0;
    right:0;
    bottom:50px;
    height:150px;
    display:flex;
    align-items:flex-end;
    gap:4px;
    opacity:.28;
}

.bina{
    flex:1;
    min-width:12px;
    background:linear-gradient(180deg,#12192b,#050711);
    border-top:1px solid rgba(80,210,255,.22);
    box-shadow:0 0 12px rgba(0,170,255,.06);
}

.bina:nth-child(1){height:52%;}
.bina:nth-child(2){height:78%;}
.bina:nth-child(3){height:44%;}
.bina:nth-child(4){height:92%;}
.bina:nth-child(5){height:64%;}
.bina:nth-child(6){height:48%;}
.bina:nth-child(7){height:82%;}
.bina:nth-child(8){height:57%;}
.bina:nth-child(9){height:95%;}
.bina:nth-child(10){height:63%;}
.bina:nth-child(11){height:76%;}
.bina:nth-child(12){height:49%;}
.bina:nth-child(13){height:88%;}
.bina:nth-child(14){height:60%;}
.bina:nth-child(15){height:73%;}

/* NEON IZGARA */
.cizgiler{
    position:absolute;
    left:-10%;
    right:-10%;
    bottom:40px;
    height:170px;
    transform:perspective(250px) rotateX(60deg);
    transform-origin:bottom;
    background:
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 44px,
            rgba(0,220,255,.18) 45px,
            transparent 46px
        ),
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 30px,
            rgba(170,0,255,.15) 31px,
            transparent 32px
        );
    box-shadow:0 -10px 25px rgba(0,180,255,.08);
}

.zemin{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:55px;
    background:
        linear-gradient(180deg,rgba(10,20,40,.9),#02030a);
    border-top:1px solid rgba(0,220,255,.35);
    box-shadow:0 -4px 20px rgba(0,180,255,.12);
}

/* ANA OYUN */
#oyunAlani{
    position:relative;
    z-index:10;
    width:100%;
    height:100%;
}

/* ÜST BİLGİ */
.oyun-ust{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:50;
    width:min(92%,560px);
    text-align:center;
}

.oyun-ust h1{
    font-size:34px;
    letter-spacing:2px;
    text-shadow:
        0 0 8px #fff,
        0 0 20px #9d00ff,
        0 0 35px rgba(0,220,255,.5);
}

.yapimci{
    margin-top:6px;
    font-size:13px;
    color:rgba(255,255,255,.55);
    letter-spacing:.7px;
    text-shadow:0 0 10px rgba(150,80,255,.4);
}

.istatistik{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-top:10px;
    font-size:15px;
}

.istatistik div{
    padding:7px 12px;
    border:1px solid rgba(100,220,255,.18);
    background:rgba(4,8,20,.55);
    border-radius:10px;
    backdrop-filter:blur(8px);
    box-shadow:0 0 14px rgba(0,200,255,.07);
}

/* KARAKTER */
#oyuncu{
    position:absolute;
    width:54px;
    height:76px;
    left:15%;
    bottom:47px;
    z-index:20;
    transform-origin:center bottom;
}

.kafa{
    position:absolute;
    width:34px;
    height:34px;
    left:10px;
    top:0;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%,#fff,#d9e4ff 24%,#a6b9d7 60%,#64738e 100%);
    border:2px solid rgba(255,255,255,.5);
    box-shadow:
        0 0 8px rgba(160,210,255,.35),
        inset -5px -6px 8px rgba(0,0,0,.18);
}

.sac{
    position:absolute;
    left:6px;
    top:-2px;
    width:38px;
    height:18px;
    border-radius:18px 18px 7px 7px;
    background:linear-gradient(180deg,#15172b,#05060d);
    box-shadow:0 0 8px rgba(120,0,255,.4);
    transform:rotate(-5deg);
}

.goz{
    position:absolute;
    top:13px;
    width:5px;
    height:7px;
    border-radius:50%;
    background:#111827;
}

.goz1{left:18px;}
.goz2{left:29px;}

.agiz{
    position:absolute;
    width:9px;
    height:4px;
    left:17px;
    top:24px;
    border-bottom:2px solid #313b51;
    border-radius:50%;
}

.govde{
    position:absolute;
    width:34px;
    height:31px;
    left:10px;
    top:34px;
    border-radius:10px 10px 7px 7px;
    background:
        linear-gradient(135deg,#5b00d9,#1a65ff 52%,#00d9ff);
    border:1px solid rgba(255,255,255,.25);
    box-shadow:
        0 0 12px rgba(80,0,255,.5),
        inset 0 -8px 12px rgba(0,0,0,.2);
}

.kol{
    position:absolute;
    width:9px;
    height:29px;
    top:37px;
    border-radius:7px;
    background:linear-gradient(180deg,#687aa0,#33415d);
}

.kol1{
    left:3px;
    transform:rotate(15deg);
}

.kol2{
    right:3px;
    transform:rotate(-15deg);
}

.bacak{
    position:absolute;
    width:10px;
    height:23px;
    top:61px;
    border-radius:6px;
    background:linear-gradient(180deg,#566986,#202a3d);
}

.bacak1{
    left:14px;
}

.bacak2{
    right:14px;
}

.ayak{
    position:absolute;
    width:18px;
    height:7px;
    border-radius:8px;
    background:#111827;
    bottom:0;
    box-shadow:0 0 5px rgba(0,0,0,.6);
}

.ayak1{left:7px;}
.ayak2{right:7px;}

.golge{
    position:absolute;
    width:62px;
    height:10px;
    left:-4px;
    bottom:-5px;
    border-radius:50%;
    background:rgba(0,0,0,.45);
    filter:blur(3px);
    z-index:-1;
}

#oyuncu.ziplama .bacak1{
    transform:rotate(20deg);
}

#oyuncu.ziplama .bacak2{
    transform:rotate(-20deg);
}

#oyuncu.ziplama .kol1{
    transform:rotate(35deg);
}

#oyuncu.ziplama .kol2{
    transform:rotate(-35deg);
}

/* KALKAN */
#oyuncu.kalkan::before{
    content:"";
    position:absolute;
    inset:-14px;
    border-radius:50%;
    border:3px solid #48e8ff;
    background:
        radial-gradient(
            circle,
            rgba(72,232,255,.14),
            rgba(72,232,255,.03) 60%,
            transparent 70%
        );
    box-shadow:
        0 0 12px #48e8ff,
        0 0 30px rgba(72,232,255,.65),
        0 0 55px rgba(0,180,255,.35),
        inset 0 0 20px rgba(72,232,255,.3);
    animation:kalkanDon 1s linear infinite;
    pointer-events:none;
}

#oyuncu.kalkan::after{
    content:"";
    position:absolute;
    inset:-20px;
    border-radius:50%;
    border:1px solid rgba(150,245,255,.5);
    box-shadow:0 0 18px rgba(0,220,255,.4);
    animation:kalkanNefes 1.2s ease-in-out infinite alternate;
    pointer-events:none;
}

@keyframes kalkanDon{
    from{
        transform:rotate(0deg) scale(1);
    }
    to{
        transform:rotate(360deg) scale(1.05);
    }
}

@keyframes kalkanNefes{
    from{
        opacity:.35;
        transform:scale(.94);
    }
    to{
        opacity:.9;
        transform:scale(1.05);
    }
}

/* ENGELLER */
.engel{
    position:absolute;
    bottom:47px;
    right:-100px;
    z-index:18;
    background:
        radial-gradient(circle at 27% 20%,rgba(255,255,255,.18),transparent 17%),
        radial-gradient(circle at 72% 72%,rgba(0,0,0,.38),transparent 38%),
        linear-gradient(145deg,#b8bec9 0%,#858b98 42%,#565c68 72%,#363b46 100%);
    border:2px solid rgba(225,230,238,.18);
    box-shadow:
        0 8px 0 rgba(0,0,0,.27),
        0 0 18px rgba(180,190,210,.13),
        inset -9px -11px 15px rgba(0,0,0,.25),
        inset 7px 6px 12px rgba(255,255,255,.08);
    overflow:visible;
}

.engel::before{
    content:"";
    position:absolute;
    width:15px;
    height:7px;
    left:25%;
    top:19%;
    border-radius:50%;
    background:rgba(255,255,255,.16);
    transform:rotate(-24deg);
}

.engel::after{
    content:"";
    position:absolute;
    width:17px;
    height:9px;
    left:50%;
    top:53%;
    border-left:2px solid rgba(30,34,42,.45);
    border-bottom:2px solid rgba(30,34,42,.45);
    transform:rotate(-22deg);
}

.engel.kucuk{
    width:36px;
    height:45px;
    clip-path:polygon(
        16% 92%,5% 65%,12% 29%,32% 8%,62% 3%,91% 25%,96% 61%,78% 91%,48% 100%
    );
}

.engel.buyuk{
    width:53px;
    height:78px;
    clip-path:polygon(
        10% 94%,2% 64%,10% 27%,29% 7%,58% 2%,86% 16%,98% 48%,90% 82%,68% 97%,35% 100%
    );
}

.engel.yuvarlak{
    width:45px;
    height:42px;
    clip-path:polygon(
        12% 74%,4% 43%,22% 13%,52% 4%,83% 18%,98% 46%,87% 78%,59% 95%,27% 91%
    );
}

@keyframes kayaYokOl{
    0%{
        transform:scale(1) rotate(0);
        opacity:1;
    }
    100%{
        transform:scale(.1) rotate(240deg);
        opacity:0;
    }
}

.engel.yok{
    animation:kayaYokOl .28s ease-out forwards;
}

/* ALT BUTONLAR */
.alt-panel{
    position:absolute;
    z-index:60;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    width:min(94%,620px);
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
}

.oyun-buton{
    border:1px solid rgba(110,220,255,.35);
    background:rgba(4,8,20,.72);
    color:white;
    border-radius:15px;
    min-width:74px;
    min-height:52px;
    padding:9px 14px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    backdrop-filter:blur(10px);
    box-shadow:
        0 0 16px rgba(0,190,255,.08),
        inset 0 0 12px rgba(0,0,0,.2);
}

.oyun-buton:active{
    transform:scale(.95);
}

#ziplamaButonu{
    border-color:rgba(155,0,255,.5);
    box-shadow:0 0 18px rgba(145,0,255,.14);
}

#guc{
    width:62px;
    min-width:62px;
    height:62px;
    border-radius:50%;
    font-size:24px;
    opacity:.35;
    transition:.2s;
}

#guc.hazir{
    opacity:1;
    border-color:#48e8ff;
    box-shadow:
        0 0 10px #48e8ff,
        0 0 25px rgba(0,220,255,.5);
    animation:gucParla 1s ease-in-out infinite alternate;
}

#guc.kullanim{
    opacity:.4;
}

@keyframes gucParla{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.08);
    }
}

.baslat{
    position:absolute;
    z-index:100;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(1,3,10,.48);
    backdrop-filter:blur(5px);
}

.baslat.kapali{
    display:none;
}

.baslat-kutu{
    width:min(88%,380px);
    padding:28px 24px;
    text-align:center;
    border:1px solid rgba(120,220,255,.25);
    border-radius:24px;
    background:rgba(4,8,20,.82);
    box-shadow:
        0 0 35px rgba(0,150,255,.12),
        inset 0 0 30px rgba(100,0,255,.05);
}

.baslat-kutu h2{
    font-size:28px;
    margin-bottom:12px;
    text-shadow:0 0 15px #8d00ff;
}

.baslat-kutu p{
    color:rgba(255,255,255,.72);
    font-size:14px;
    line-height:1.6;
    margin-bottom:20px;
}

#baslatButonu{
    border:0;
    color:white;
    font-size:17px;
    font-weight:bold;
    padding:14px 30px;
    border-radius:15px;
    background:linear-gradient(135deg,#6a00ff,#008dff);
    box-shadow:
        0 0 15px rgba(100,0,255,.4),
        0 0 30px rgba(0,130,255,.18);
    cursor:pointer;
}

/* OYUN BİTTİ */
.game-over{
    position:absolute;
    z-index:90;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(1,2,8,.58);
    backdrop-filter:blur(4px);
}

.game-over.aktif{
    display:flex;
}

.game-over-kutu{
    width:min(88%,380px);
    padding:28px;
    text-align:center;
    border-radius:23px;
    border:1px solid rgba(255,80,180,.25);
    background:rgba(8,6,18,.88);
    box-shadow:0 0 35px rgba(160,0,100,.16);
}

.game-over-kutu h2{
    font-size:30px;
    margin-bottom:10px;
}

.game-over-kutu p{
    color:rgba(255,255,255,.75);
    margin-bottom:20px;
}

#tekrarButonu{
    border:0;
    color:#fff;
    background:linear-gradient(135deg,#ff0077,#7d00ff);
    padding:13px 25px;
    border-radius:13px;
    font-weight:bold;
    font-size:16px;
}

/* TELEFON */
@media(max-width:600px){
    .oyun-ust{
        top:12px;
    }

    .oyun-ust h1{
        font-size:29px;
    }

    .yapimci{
        font-size:12px;
    }

    .istatistik{
        margin-top:7px;
        gap:8px;
        font-size:13px;
    }

    .istatistik div{
        padding:6px 9px;
    }

    #oyuncu{
        left:12%;
    }

    .alt-panel{
        bottom:12px;
    }

    .oyun-buton{
        min-height:50px;
    }
}
</style>
</head>

<body>

<div class="arka-plan">

    <div class="isik isik1"></div>
    <div class="isik isik2"></div>
    <div class="isik isik3"></div>

    <div class="parcacik"></div>
    <div class="parcacik"></div>
    <div class="parcacik"></div>
    <div class="parcacik"></div>
    <div class="parcacik"></div>
    <div class="parcacik"></div>
    <div class="parcacik"></div>
    <div class="parcacik"></div>

    <div class="sehir">
        <div class="bina"></div>
        <div class="bina"></div>
        <div class="bina"></div>
        <div class="bina"></div>
        <div class="bina"></div>
        <div class="bina"></div>
        <div class="bina"></div>
        <div class="bina"></div>
        <div class="bina"></div>
        <div class="bina"></div>
        <div class="bina"></div>
        <div class="bina"></div>
        <div class="bina"></div>
        <div class="bina"></div>
        <div class="bina"></div>
    </div>

    <div class="cizgiler"></div>
    <div class="zemin"></div>
</div>

<div id="oyunAlani">

    <div class="oyun-ust">
        <h1>🏃 Kaç!</h1>

        <div class="yapimci">
            Ali tarafından yapılmıştır
        </div>

        <div class="istatistik">
            <div>Skor: <span id="skor">0</span></div>
            <div>Rekor: <span id="rekor">0</span></div>
        </div>
    </div>

    <!-- KARAKTER -->
    <div id="oyuncu">

        <div class="kafa">
            <div class="sac"></div>
            <div class="goz goz1"></div>
            <div class="goz goz2"></div>
            <div class="agiz"></div>
        </div>

        <div class="govde"></div>

        <div class="kol kol1"></div>
        <div class="kol kol2"></div>

        <div class="bacak bacak1"></div>
        <div class="bacak bacak2"></div>

        <div class="ayak ayak1"></div>
        <div class="ayak ayak2"></div>

        <div class="golge"></div>
    </div>

    <div class="alt-panel">

        <button class="oyun-buton" id="solButon">
            ◀
        </button>

        <button class="oyun-buton" id="ziplamaButonu">
            🦘 Zıpla
        </button>

        <button class="oyun-buton" id="sagButon">
            ▶
        </button>

        <button class="oyun-buton" id="guc">
            ⚡
        </button>

    </div>

    <!-- BAŞLANGIÇ -->
    <div class="baslat" id="baslangic">

        <div class="baslat-kutu">

            <h2>🏃 Kaç!</h2>

            <p>
                Kayalara çarpmadan kaç.<br>
                Zıpla, hızlan ve güç kalkanını kullan!
            </p>

            <button id="baslatButonu">
                Oyuna Başla
            </button>

        </div>

    </div>

    <!-- OYUN BİTTİ -->
    <div class="game-over" id="gameOver">

        <div class="game-over-kutu">

            <h2>💥 Oyun Bitti!</h2>

            <p>
                Skorun: <strong id="sonSkor">0</strong>
            </p>

            <button id="tekrarButonu">
                Tekrar Oyna
            </button>

        </div>

    </div>

</div>

<script>
const oyunAlani=document.getElementById("oyunAlani");
const oyuncu=document.getElementById("oyuncu");

const skorYazi=document.getElementById("skor");
const rekorYazi=document.getElementById("rekor");
const sonSkor=document.getElementById("sonSkor");

const baslangic=document.getElementById("baslangic");
const baslatButonu=document.getElementById("baslatButonu");

const gameOver=document.getElementById("gameOver");
const tekrarButonu=document.getElementById("tekrarButonu");

const ziplamaButonu=document.getElementById("ziplamaButonu");
const guc=document.getElementById("guc");

const solButon=document.getElementById("solButon");
const sagButon=document.getElementById("sagButon");

let oyunAktif=false;

let oyuncuY=0;
let oyuncuHizY=0;

let yerde=true;
let ziplamaKuyrugu=false;

let engeller=[];
let sonEngelZamani=0;

let skor=0;
let tamSkor=0;

let sonZaman=0;

let kalkanAktif=false;
let gucKalkanTimer=null;

let yatayYon=0;

const gravityUp=0.72;
const gravityDown=0.92;

const jumpPower=16.2;
const maxDusmeHizi=18;

let rekor=Number(localStorage.getItem("kacRekor")||0);

rekorYazi.textContent=rekor;


/* =========================
   ZIPLAMA
========================= */

function ziplama(){

    if(!oyunAktif) return;

    if(yerde){

        oyuncuHizY=jumpPower;
        yerde=false;
        ziplamaKuyrugu=false;

    }else{

        ziplamaKuyrugu=true;

        setTimeout(()=>{
            ziplamaKuyrugu=false;
        },120);
    }
}


/* =========================
   KALKAN
========================= */

function kalkanBaslat(){

    if(!oyunAktif) return;

    if(!guc.classList.contains("hazir")) return;

    kalkanAktif=true;

    oyuncu.classList.add("kalkan");

    guc.classList.remove("hazir");
    guc.classList.add("kullanim");

    clearTimeout(gucKalkanTimer);

    gucKalkanTimer=setTimeout(()=>{

        kalkanAktif=false;

        oyuncu.classList.remove("kalkan");

        guc.classList.remove("kullanim");

    },5000);
}


/* =========================
   OYUNU BAŞLAT
========================= */

function oyunuBaslat(){

    engeller.forEach(e=>{
        if(e.element){
            e.element.remove();
        }
    });

    engeller=[];

    skor=0;
    tamSkor=0;

    oyuncuY=0;
    oyuncuHizY=0;

    yerde=true;

    sonEngelZamani=0;

    kalkanAktif=false;

    clearTimeout(gucKalkanTimer);

    oyuncu.classList.remove("kalkan");
    guc.classList.remove("hazir");
    guc.classList.remove("kullanim");

    oyuncu.style.bottom="47px";
    oyuncu.style.transform="translateX(0)";

    skorYazi.textContent="0";

    oyunAktif=true;

    baslangic.classList.add("kapali");
    gameOver.classList.remove("aktif");

    sonZaman=performance.now();

    setTimeout(()=>{
        if(oyunAktif){
            engelOlustur();
        }
    },900);

    requestAnimationFrame(oyunDongusu);
}


/* =========================
   OYUN BİTİŞ
========================= */

function oyunuBitir(){

    if(!oyunAktif) return;

    oyunAktif=false;

    sonSkor.textContent=skor;

    if(skor>rekor){

        rekor=skor;

        localStorage.setItem("kacRekor",rekor);

        rekorYazi.textContent=rekor;
    }

    if(kalkanAktif){

        kalkanAktif=false;

        clearTimeout(gucKalkanTimer);

        oyuncu.classList.remove("kalkan");
    }

    gameOver.classList.add("aktif");
}


/* =========================
   ENGEL OLUŞTUR
========================= */

function engelOlustur(){

    if(!oyunAktif) return;

    const son=engeller[engeller.length-1];

    if(
        son &&
        son.element &&
        son.right < oyunAlani.offsetWidth-230
    ){
        return;
    }

    const element=document.createElement("div");

    const tipler=[
        "kucuk",
        "buyuk",
        "yuvarlak"
    ];

    const tip=
        tipler[
            Math.floor(Math.random()*tipler.length)
        ];

    element.className="engel "+tip;

    element.style.right="-100px";

    oyunAlani.appendChild(element);

    engeller.push({
        element:element,
        right:-100
    });
}


/* =========================
   FİZİK
========================= */

function fizikGuncelle(dt){

    if(!oyunAktif) return;

    if(oyuncuHizY>0){

        oyuncuHizY-=gravityUp*dt;

    }else{

        oyuncuHizY-=gravityDown*dt;
    }

    if(oyuncuHizY < -maxDusmeHizi){
        oyuncuHizY=-maxDusmeHizi;
    }

    oyuncuY+=oyuncuHizY*dt;

    if(oyuncuY<=0){

        oyuncuY=0;
        oyuncuHizY=0;

        if(!yerde){

            yerde=true;

            if(ziplamaKuyrugu){

                ziplamaKuyrugu=false;

                oyuncuHizY=jumpPower;
                yerde=false;
            }
        }
    }

    oyuncu.style.bottom=(47+oyuncuY)+"px";

    if(!yerde){

        oyuncu.classList.add("ziplama");

    }else{

        oyuncu.classList.remove("ziplama");
    }
}


/* =========================
   ENGELLERİ HAREKET ETTİR
========================= */

function engellerGuncelle(dt){

    const hiz=Math.min(
        8.2 + tamSkor/750,
        13
    );

    for(let i=engeller.length-1;i>=0;i--){

        const kaya=engeller[i];

        kaya.right += hiz*dt;

        kaya.element.style.right=kaya.right+"px";

        if(
            kaya.right >
            oyunAlani.offsetWidth+120
        ){

            kaya.element.remove();

            engeller.splice(i,1);

            continue;
        }

        if(carpismaVar(kaya)){

            if(kalkanAktif){

                kaya.element.classList.add("yok");

                setTimeout(()=>{
                    if(kaya.element){
                        kaya.element.remove();
                    }
                },280);

                engeller.splice(i,1);

                /* Kalkan tek kayayı yok eder */
                continue;

            }else{

                oyunuBitir();

                return;
            }
        }
    }
}


/* =========================
   ÇARPIŞMA
========================= */

function carpismaVar(kaya){

    const kayaRect=
        kaya.element.getBoundingClientRect();

    const oyuncuRect=
        oyuncu.getBoundingClientRect();

    const kayaHit={
        left:kayaRect.left+6,
        right:kayaRect.right-6,
        top:kayaRect.top+5,
        bottom:kayaRect.bottom-2
    };

    const karakterHit={
        left:oyuncuRect.left+9,
        right:oyuncuRect.right-9,
        top:oyuncuRect.top+6,
        bottom:oyuncuRect.bottom-3
    };

    return(
        karakterHit.left < kayaHit.right &&
        karakterHit.right > kayaHit.left &&
        karakterHit.top < kayaHit.bottom &&
        karakterHit.bottom > kayaHit.top
    );
}


/* =========================
   SKOR
========================= */

function skorGuncelle(dt){

    tamSkor += dt*0.7;

    skor=Math.floor(tamSkor/10);

    skorYazi.textContent=skor;

    /*
       Her 100 puanda kalkan hazır olur.
    */
    if(
        skor>0 &&
        skor%100===0 &&
        !kalkanAktif
    ){

        guc.classList.add("hazir");
    }
}


/* =========================
   ENGEL ZAMANI
========================= */

function engelZamani(){

    const aralik=Math.max(
        900,
        1350-tamSkor*1.05
    );

    const simdi=performance.now();

    if(simdi-sonEngelZamani>=aralik){

        engelOlustur();

        sonEngelZamani=simdi;
    }
}


/* =========================
   ANA OYUN DÖNGÜSÜ
========================= */

function oyunDongusu(zaman){

    if(!oyunAktif) return;

    const dt=Math.min(
        (zaman-sonZaman)/16.67,
        2
    );

    sonZaman=zaman;

    fizikGuncelle(dt);

    engellerGuncelle(dt);

    skorGuncelle(dt);

    engelZamani();

    requestAnimationFrame(oyunDongusu);
}


/* =========================
   KLAVYE
========================= */

document.addEventListener("keydown",(e)=>{

    if(
        e.code==="Space" ||
        e.code==="ArrowUp" ||
        e.key==="w" ||
        e.key==="W"
    ){

        e.preventDefault();

        ziplama();
    }

    if(
        e.key==="Shift" ||
        e.key==="e" ||
        e.key==="E"
    ){

        e.preventDefault();

        kalkanBaslat();
    }

    if(e.code==="ArrowLeft"){
        yatayYon=-1;
    }

    if(e.code==="ArrowRight"){
        yatayYon=1;
    }
});

document.addEventListener("keyup",(e)=>{

    if(e.code==="ArrowLeft" && yatayYon===-1){
        yatayYon=0;
    }

    if(e.code==="ArrowRight" && yatayYon===1){
        yatayYon=0;
    }
});


/* =========================
   BUTONLAR
========================= */

ziplamaButonu.addEventListener(
    "click",
    ziplama
);

guc.addEventListener(
    "click",
    kalkanBaslat
);


/* MOBİL ZIPLAMA */
ziplamaButonu.addEventListener(
    "touchstart",
    (e)=>{
        e.preventDefault();
        ziplama();
    },
    {passive:false}
);


/* MOBİL KALKAN */
guc.addEventListener(
    "touchstart",
    (e)=>{
        e.preventDefault();
        kalkanBaslat();
    },
    {passive:false}
);


/* SOL */
function solaBas(){

    yatayYon=-1;

    setTimeout(()=>{
        if(yatayYon===-1){
            yatayYon=0;
        }
    },150);
}


/* SAĞ */
function sagaBas(){

    yatayYon=1;

    setTimeout(()=>{
        if(yatayYon===1){
            yatayYon=0;
        }
    },150);
}

solButon.addEventListener(
    "touchstart",
    (e)=>{
        e.preventDefault();
        solaBas();
    },
    {passive:false}
);

sagButon.addEventListener(
    "touchstart",
    (e)=>{
        e.preventDefault();
        sagaBas();
    },
    {passive:false}
);

solButon.addEventListener(
    "click",
    solaBas
);

sagButon.addEventListener(
    "click",
    sagaBas
);


/* =========================
   BAŞLAT / TEKRAR
========================= */

baslatButonu.addEventListener(
    "click",
    oyunuBaslat
);

tekrarButonu.addEventListener(
    "click",
    oyunuBaslat
);


/* =========================
   İLK DURUM
========================= */

oyuncu.style.bottom="47px";

</script>
