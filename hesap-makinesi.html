<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Oyunlar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .arka-plan {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(108, 44, 255, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(80, 120, 255, 0.12),
                    transparent 35%
                ),
                #0b1020;
        }

        .geri {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-size: 32px;
            z-index: 20;
        }

        .kutu,
        .ekran {
            position: relative;
            z-index: 2;
            width: 310px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .kutu {
            text-align: center;
        }

        .kutu h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .buton {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            background: #7c3cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .buton:hover {
            background: #955fff;
            transform: scale(1.03);
        }

        .ekran {
            display: none;
            text-align: center;
        }

        .kapat {
            position: absolute;
            top: 8px;
            right: 12px;
            border: none;
            background: none;
            color: white;
            font-size: 25px;
            cursor: pointer;
        }

        .ekran h1 {
            font-size: 22px;
            margin-bottom: 15px;
        }

        /* HESAP MAKİNESİ */

        #hesapEkrani {
            width: 100%;
            height: 50px;
            margin-bottom: 15px;
            padding: 10px;
            background: #0b1020;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 22px;
            text-align: right;
        }

        .tuslar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .tuslar button {
            height: 50px;
            border: none;
            border-radius: 8px;
            background: #7c3cff;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .tuslar button:hover {
            background: #955fff;
        }

        /* OYUN */

        #oyunEkrani {
            width: 340px;
        }

        #skor {
            font-size: 18px;
            margin-bottom: 10px;
        }

        #oyun {
            position: relative;
            width: 100%;
            height: 280px;
            overflow: hidden;
            background:
                linear-gradient(
                    rgba(124, 60, 255, 0.08),
                    rgba(11, 16, 32, 0.4)
                );
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 15px;
        }

        /* ZEMİN */

        #zemin {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25px;
            background: rgba(124, 60, 255, 0.35);
            border-top: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* KARAKTER */

        #oyuncu {
            position: absolute;
            left: 45px;
            bottom: 25px;
            width: 30px;
            height: 45px;
            transition: transform 0.05s;
        }

        .kafa {
            position: absolute;
            top: 0;
            left: 7px;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
        }

        .govde {
            position: absolute;
            top: 15px;
            left: 11px;
            width: 8px;
            height: 20px;
            background: #9b6cff;
            border-radius: 5px;
        }

        .bacak {
            position: absolute;
            top: 32px;
            width: 7px;
            height: 15px;
            background: white;
            border-radius: 5px;
        }

        .bacak1 {
            left: 7px;
        }

        .bacak2 {
            right: 7px;
        }

        .kol {
            position: absolute;
            top: 17px;
            width: 6px;
            height: 17px;
            background: white;
            border-radius: 5px;
        }

        .kol1 {
            left: 3px;
            transform: rotate(25deg);
        }

        .kol2 {
            right: 3px;
            transform: rotate(-25deg);
        }

        /* ENGEL */

        #engel {
            position: absolute;
            right: -45px;
            bottom: 25px;
            width: 35px;
            height: 35px;
            background: #8b52ff;
            border-radius: 8px 8px 3px 3px;
            transform: rotate(45deg);
            box-shadow: 0 0 15px rgba(124, 60, 255, 0.5);
        }

        #engel::before {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            background: #b38cff;
            left: 8px;
            top: 8px;
            border-radius: 4px;
        }

        /* SKOR VE BİLGİ */

        .oyun-bilgi {
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
        }

        .oyun-bitti {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(11, 16, 32, 0.9);
            z-index: 5;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border-radius: 15px;
        }

        .oyun-bitti h2 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .son-skor {
            color: #bbb;
            margin-bottom: 10px;
        }

        .zipla {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="arka-plan"></div>

    <a href="index.html" class="geri">←</a>

    <!-- ANA MENÜ -->

    <div class="kutu" id="menu">

        <h1>🎮 Ne yapmak istersin?</h1>

        <button class="buton" onclick="hesapAc()">
            🧮 Hesap Makinesi
        </button>

        <button class="buton" onclick="oyunAc()">
            🏃 Kaç!
        </button>

    </div>


    <!-- HESAP MAKİNESİ -->

    <div class="ekran" id="hesap">

        <button class="kapat" onclick="kapat()">×</button>

        <h1>🧮 Hesap Makinesi</h1>

        <input type="text" id="hesapEkrani" readonly>

        <div class="tuslar">

            <button onclick="temizle()">C</button>
            <button onclick="sayiYaz('/')">÷</button>
            <button onclick="sayiYaz('*')">×</button>
            <button onclick="sayiYaz('-')">−</button>

            <button onclick="sayiYaz('7')">7</button>
            <button onclick="sayiYaz('8')">8</button>
            <button onclick="sayiYaz('9')">9</button>
            <button onclick="sayiYaz('+')">+</button>

            <button onclick="sayiYaz('4')">4</button>
            <button onclick="sayiYaz('5')">5</button>
            <button onclick="sayiYaz('6')">6</button>
            <button onclick="hesapla()">=</button>

            <button onclick="sayiYaz('1')">1</button>
            <button onclick="sayiYaz('2')">2</button>
            <button onclick="sayiYaz('3')">3</button>
            <button onclick="sayiYaz('0')">0</button>

        </div>

    </div>


    <!-- OYUN -->

    <div class="ekran" id="oyunEkrani">

        <button class="kapat" onclick="kapat()">×</button>

        <h1>🏃 KAÇ!</h1>

        <div id="skor">
            🔥 Skor: 0
        </div>

        <div id="oyun">

            <div id="oyuncu">

                <div class="kafa"></div>
                <div class="govde"></div>

                <div class="kol kol1"></div>
                <div class="kol kol2"></div>

                <div class="bacak bacak1"></div>
                <div class="bacak bacak2"></div>

            </div>

            <div id="engel"></div>

            <div id="zemin"></div>

            <div class="oyun-bitti" id="oyunBitti">

                <h2>💀 Oyun Bitti!</h2>

                <div class="son-skor" id="sonSkor">
                    Skor: 0
                </div>

                <button class="buton" onclick="oyunuBaslat()">
                    🔄 Tekrar Oyna
                </button>

            </div>

        </div>

        <button class="buton zipla" onclick="zipla()">
            🦘 ZIPLA
        </button>

        <div class="oyun-bilgi">
            Ekrana veya ZIPLA butonuna dokun!
        </div>

    </div>


    <script>

        /* MENÜ */

        function hesapAc() {

            document.getElementById("menu").style.display = "none";
            document.getElementById("hesap").style.display = "block";

        }


        function oyunAc() {

            document.getElementById("menu").style.display = "none";
            document.getElementById("oyunEkrani").style.display = "block";

            oyunuBaslat();

        }


        function kapat() {

            document.getElementById("hesap").style.display = "none";
            document.getElementById("oyunEkrani").style.display = "none";
            document.getElementById("menu").style.display = "block";

            oyunDevam = false;

        }


        /* HESAP MAKİNESİ */

        function sayiYaz(sayi) {

            document.getElementById("hesapEkrani").value += sayi;

        }


        function temizle() {

            document.getElementById("hesapEkrani").value = "";

        }


        function hesapla() {

            let ekran =
                document.getElementById("hesapEkrani");

            if (ekran.value !== "") {

                ekran.value = eval(ekran.value);

            }

        }


        /* OYUN */

        let skor = 0;
        let oyunDevam = false;

        let oyuncuY = 0;
        let oyuncuHizi = 0;

        let engelX = 0;
        let oyunHizi = 6;

        let sonZaman = 0;
        let animasyon;


        function oyunuBaslat() {

            skor = 0;

            oyunDevam = true;

            oyuncuY = 0;
            oyuncuHizi = 0;

            oyunHizi = 6;

            engelX = 340;

            document.getElementById("skor").textContent =
                "🔥 Skor: 0";

            document.getElementById("oyunBitti").style.display =
                "none";

            sonZaman = performance.now();

            cancelAnimationFrame(animasyon);

            animasyon =
                requestAnimationFrame(oyunDongusu);

        }


        function oyunDongusu(zaman) {

            if (!oyunDevam) return;

            let delta =
                Math.min((zaman - sonZaman) / 16.67, 2);

            sonZaman = zaman;


            /* YERÇEKİMİ */

            oyuncuHizi += 0.8 * delta;

            oyuncuY -= oyuncuHizi * delta;


            if (oyuncuY < 0) {

                oyuncuY = 0;
                oyuncuHizi = 0;

            }


            /* ENGEL */

            engelX -= oyunHizi * delta;


            if (engelX < -50) {

                engelX = 340;

            }


            /* SKOR */

            skor += 0.12 * delta;

            document.getElementById("skor").textContent =
                "🔥 Skor: " + Math.floor(skor);


            /* ZAMANLA HIZLAN */

            oyunHizi += 0.002 * delta;


            /* EKRANA UYGULA */

            let oyuncu =
                document.getElementById("oyuncu");

            let engel =
                document.getElementById("engel");


            oyuncu.style.bottom =
                (25 + oyuncuY) + "px";


            engel.style.right =
                (340 - engelX) + "px";


            /* ÇARPIŞMA */

            kontrolEt();


            animasyon =
                requestAnimationFrame(oyunDongusu);

        }


        function zipla() {

            if (!oyunDevam) return;

            if (oyuncuY === 0) {

                oyuncuHizi = -14;

            }

        }


        function kontrolEt() {

            let oyuncu =
                document.getElementById("oyuncu");

            let engel =
                document.getElementById("engel");


            let oyuncuRect =
                oyuncu.getBoundingClientRect();

            let engelRect =
                engel.getBoundingClientRect();


            let bosluk = 7;


            if (
                oyuncuRect.right - bosluk >
                engelRect.left + bosluk &&

                oyuncuRect.left + bosluk <
                engelRect.right - bosluk &&

                oyuncuRect.bottom - bosluk >
                engelRect.top + bosluk &&

                oyuncuRect.top + bosluk <
                engelRect.bottom - bosluk
            ) {

                oyunBitir();

            }

        }


        function oyunBitir() {

            oyunDevam = false;

            cancelAnimationFrame(animasyon);

            document.getElementById("sonSkor").textContent =
                "Skor: " + Math.floor(skor);

            document.getElementById("oyunBitti").style.display =
                "flex";

        }


        /* EKRANA DOKUNARAK ZIPLAMA */

        document.getElementById("oyun").addEventListener(
            "touchstart",
            function() {

                zipla();

            },
            { passive: true }
        );


        /* BİLGİSAYARDA SPACE */

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.code === "Space") {

                    event.preventDefault();

                    zipla();

                }

            }
        );

    </script>

</body>
</html>
