<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Oyunlar</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .arka-plan {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(108, 44, 255, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(80, 120, 255, 0.12),
                    transparent 35%
                ),
                #0b1020;
        }

        .geri {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-size: 32px;
            z-index: 20;
        }

        .kutu,
        .ekran {
            position: relative;
            z-index: 2;
            width: 310px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .kutu {
            text-align: center;
        }

        .kutu h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .buton {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            background: #7c3cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .buton:hover {
            background: #955fff;
            transform: scale(1.03);
        }

        .ekran {
            display: none;
            text-align: center;
        }

        .kapat {
            position: absolute;
            top: 8px;
            right: 12px;
            border: none;
            background: none;
            color: white;
            font-size: 25px;
            cursor: pointer;
        }

        .ekran h1 {
            font-size: 22px;
            margin-bottom: 15px;
        }

        /* =========================
           HESAP MAKİNESİ
        ========================= */

        #hesapEkrani {
            width: 100%;
            height: 50px;
            margin-bottom: 15px;
            padding: 10px;
            background: #0b1020;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 22px;
            text-align: right;
        }

        .tuslar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .tuslar button {
            height: 50px;
            border: none;
            border-radius: 8px;
            background: #7c3cff;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .tuslar button:hover {
            background: #955fff;
        }

        /* =========================
           OYUN
        ========================= */

        #oyunEkrani {
            width: 340px;
        }

        #skor {
            font-size: 18px;
            margin-bottom: 5px;
        }

        #kalkanDurumu {
            height: 22px;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 5px;
        }

        #oyun {
            position: relative;
            width: 100%;
            height: 280px;
            overflow: hidden;
            background:
                linear-gradient(
                    rgba(124, 60, 255, 0.08),
                    rgba(11, 16, 32, 0.4)
                );
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 15px;
        }

        #zemin {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25px;
            background: rgba(124, 60, 255, 0.35);
            border-top: 2px solid rgba(255, 255
