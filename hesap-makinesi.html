<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080512">
<title>Hesap Makinesi & Kaç!</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 20% 10%,rgba(124,58,237,.16),transparent 28%),
        radial-gradient(circle at 80% 80%,rgba(0,210,255,.08),transparent 30%),
        #080512;
    color:white;
    overflow-x:hidden;
}

.sayfa{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:25px 15px 40px;
}

.baslik{
    text-align:center;
    margin-bottom:20px;
}

.baslik h1{
    margin:0;
    font-size:32px;
    text-shadow:
        0 0 8px rgba(177,94,255,.7),
        0 0 25px rgba(120,50,255,.4);
}

.baslik p{
    color:#aaa;
    margin:8px 0 0;
}

/* =========================
   HESAP MAKİNESİ
========================= */

.hesap-kutu{
    width:100%;
    max-width:380px;
    margin:0 auto 25px;
    padding:18px;
    border-radius:24px;
    background:rgba(20,12,35,.82);
    border:1px solid rgba(180,110,255,.25);
    box-shadow:
        0 15px 50px rgba(0,0,0,.45),
        inset 0 0 25px rgba(150,70,255,.05);
    backdrop-filter:blur(12px);
}

.ekran{
    width:100%;
    min-height:75px;
    margin-bottom:14px;
    padding:15px;
    border-radius:16px;
    background:#09070e;
    border:1px solid rgba(180,100,255,.2);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    font-size:31px;
    overflow:hidden;
    box-shadow:inset 0 0 20px rgba(0,0,0,.55);
}

.tuslar{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.tuslar button{
    height:62px;
    border:0;
    border-radius:15px;
    background:linear-gradient(145deg,#241538,#140c20);
    color:#fff;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:
        0 5px 0 #0a0610,
        inset 0 1px rgba(255,255,255,.06);
    transition:.12s;
}

.tuslar button:active{
    transform:translateY(4px);
    box-shadow:
        0 1px 0 #0a0610,
        inset 0 1px rgba(255,255,255,.06);
}

.tuslar .operator{
    color:#d48cff;
}

.tuslar .esittir{
    background:linear-gradient(135deg,#7c3aed,#4c1d95);
}

.tuslar .temizle{
    color:#ff6688;
}

/* =========================
   OYUN
========================= */

.oyun-kutu{
    width:100%;
    padding:15px;
    border-radius:25px;
    background:rgba(14,9,24,.85);
    border:1px solid rgba(130,80,255,.25);
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.oyun-ust{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.oyun-ust h2{
    margin:0;
    font-size:22px;
}

.istatistik{
    display:flex;
    gap:10px;
    color:#bbb;
    font-size:14px;
}

.istatistik span{
    color:#fff;
    font-weight:bold;
}

.oyun-alani{
    position:relative;
    width:100%;
    height:350px;
    overflow:hidden;
    border-radius:20px;
    background:
        radial-gradient(circle at 70% 20%,rgba(107,33,168,.2),transparent 25%),
        linear-gradient(180deg,#10091c 0%,#0a0810 70%,#08070c 100%);
    border:1px solid rgba(155,90,255,.22);
    box-shadow:inset 0 0 40px rgba(0,0,0,.7);
}

/* uzak ışıklar */

.oyun-alani::before{
    content:"";
    position:absolute;
    left:10%;
    top:12%;
    width:150px;
    height:150px;
    background:radial-gradient(circle,rgba(137,67,255,.18),transparent 70%);
    filter:blur(15px);
}

.oyun-alani::after{
    content:"";
    position:absolute;
    right:5%;
    top:20%;
    width:180px;
    height:180px;
    background:radial-gradient(circle,rgba(0,210,255,.08),transparent 70%);
    filter:blur(18px);
}

/* zemin */

.zemin{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:46px;
    z-index:1;
    background:
        linear-gradient(
            180deg,
            #19131f 0,
            #0e0b13 55%,
            #09070d 100%
        );
    border-top:2px solid rgba(185,110,255,.22);
    box-shadow:
        0 -5px 20px rgba(120,50,255,.08),
        inset 0 8px 15px rgba(0,0,0,.25);
}

.zemin::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 44px,
            rgba(150,80,255,.08) 45px 46px
        );
    transform:perspective(100px) rotateX(40deg);
    transform-origin:bottom;
}

/* =========================
   KARAKTER
========================= */

#oyuncu{
    position:absolute;
    left:65px;
    bottom:45px;
    width:52px;
    height:78px;
    z-index:5;
    transform:translateY(0);
}

.oyuncu-golge{
    position:absolute;
    left:2px;
    bottom:-5px;
    width:48px;
    height:9px;
    border-radius:50%;
    background:rgba(0,0,0,.5);
    filter:blur(3px);
    z-index:-1;
    transform:scaleX(1);
    transition:.1s;
}

.oyuncu-kafa{
    position:absolute;
    width:35px;
    height:35px;
    left:8px;
    top:0;
    border-radius:50%;
    background:linear-gradient(145deg,#ffd4bd,#eaa58c);
    border:2px solid rgba(255,255,255,.1);
    z-index:4;
}

.oyuncu-sac{
    position:absolute;
    left:4px;
    top:-2px;
    width:31px;
    height:18px;
    border-radius:18px 18px 8px 8px;
    background:linear-gradient(145deg,#17121d,#050409);
    transform:rotate(-5deg);
}

.oyuncu-sac::after{
    content:"";
    position:absolute;
    left:0;
    top:9px;
    width:10px;
    height:13px;
    border-radius:0 0 10px 8px;
    background:#0a0810;
}

.oyuncu-goz{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#16101d;
    top:15px;
}

.oyuncu-goz.sol{
    left:9px;
}

.oyuncu-goz.sag{
    right:9px;
}

.oyuncu-agiz{
    position:absolute;
    left:13px;
    top:23px;
    width:9px;
    height:4px;
    border-bottom:2px solid #8e4d57;
    border-radius:50%;
}

.oyuncu-govde{
    position:absolute;
    left:10px;
    top:33px;
    width:32px;
    height:31px;
    border-radius:9px 9px 7px 7px;
    background:linear-gradient(145deg,#824cff,#4c20a3);
    box-shadow:
        inset 0 4px 7px rgba(255,255,255,.1),
        0 3px 10px rgba(95,40,255,.2);
}

.oyuncu-govde::after{
    content:"";
    position:absolute;
    left:11px;
    top:6px;
    width:10px;
    height:15px;
    border-radius:5px;
    background:rgba(255,255,255,.1);
}

.oyuncu-kol{
    position:absolute;
    width:10px;
    height:29px;
    top:35px;
    border-radius:8px;
    background:linear-gradient(180deg,#a765ff,#5425a5);
    transform-origin:top center;
    z-index:2;
}

.oyuncu-kol.sol{
    left:3px;
    transform:rotate(15deg);
}

.oyuncu-kol.sag{
    right:3px;
    transform:rotate(-15deg);
}

.oyuncu-el{
    position:absolute;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#f0b39c;
    bottom:-5px;
    left:0;
}

.oyuncu-bacak{
    position:absolute;
    top:60px;
    width:11px;
    height:22px;
    border-radius:7px;
    background:linear-gradient(180deg,#30203e,#17101f);
    transform-origin:top center;
    z-index:1;
}

.oyuncu-bacak.sol{
    left:14px;
}

.oyuncu-bacak.sag{
    right:14px;
}

.oyuncu-ayak{
    position:absolute;
    width:18px;
    height:8px;
    bottom:-3px;
    border-radius:7px 7px 3px 3px;
    background:#09070d;
}

.oyuncu-ayak.sol{
    left:-5px;
}

.oyuncu-ayak.sag{
    right:-5px;
}

/* koşu */

#oyuncu.kosuyor .oyuncu-bacak.sol{
    transform:rotate(25deg);
}

#oyuncu.kosuyor .oyuncu-bacak.sag{
    transform:rotate(-25deg);
}

/* zıplama */

#oyuncu.havada.yukseliyor .oyuncu-bacak.sol{
    transform:rotate(30deg);
}

#oyuncu.havada.yukseliyor .oyuncu-bacak.sag{
    transform:rotate(-30deg);
}

#oyuncu.havada.yukseliyor .oyuncu-kol.sol{
    transform:rotate(-35deg);
}

#oyuncu.havada.yukseliyor .oyuncu-kol.sag{
    transform:rotate(35deg);
}

#oyuncu.havada.alcaliyor .oyuncu-bacak.sol{
    transform:rotate(-18deg);
}

#oyuncu.havada.alcaliyor .oyuncu-bacak.sag{
    transform:rotate(18deg);
}

#oyuncu.havada.alcaliyor .oyuncu-kol.sol{
    transform:rotate(28deg);
}

#oyuncu.havada.alcaliyor .oyuncu-kol.sag{
    transform:rotate(-28deg);
}

/* iniş */

#oyuncu.inis{
    animation:inisAnim .12s ease-out;
}

@keyframes inisAnim{
    0%{transform:scaleY(.88) scaleX(1.08);}
    100%{transform:scaleY(1) scaleX(1);}
}

/* =========================
   KALKAN
========================= */

#oyuncu.kalkan::before{
    content:"";
    position:absolute;
    inset:-13px;
    border-radius:50%;
    border:3px solid #48e8ff;
    background:radial-gradient(
        circle,
        rgba(72,232,255,.13),
        rgba(72,232,255,.03) 60%,
        transparent 70%
    );
    box-shadow:
        0 0 12px #48e8ff,
        0 0 30px rgba(72,232,255,.65),
        inset 0 0 20px rgba(72,232,255,.3);
    animation:shieldDon 1s linear infinite;
    pointer-events:none;
}

@keyframes shieldDon{
    0%{
        transform:rotate(0deg) scale(.98);
        opacity:.8;
    }
    50%{
        transform:rotate(180deg) scale(1.04);
        opacity:1;
    }
    100%{
        transform:rotate(360deg) scale(.98);
        opacity:.8;
    }
}

#guc{
    position:absolute;
    left:50%;
    bottom:12px;
    transform:translateX(-50%);
    font-size:24px;
    opacity:.55;
    transition:.2s;
}

#guc.hazir{
    opacity:1;
    animation:gucParla .8s infinite alternate;
}

@keyframes gucParla{
    from{filter:drop-shadow(0 0 3px #48e8ff);}
    to{filter:drop-shadow(0 0 13px #48e8ff);}
}

/* =========================
   KAYALAR
========================= */

.engel{
    position:absolute;
    bottom:45px;
    right:-95px;
    z-index:3;

    background:
        radial-gradient(
            circle at 27% 20%,
            rgba(255,255,255,.18),
            transparent 17%
        ),
        radial-gradient(
            circle at 72% 72%,
            rgba(0,0,0,.38),
            transparent 38%
        ),
        linear-gradient(
            145deg,
            #b8bec9 0%,
            #858b98 42%,
            #565c68 72%,
            #363b46 100%
        );

    border:2px solid rgba(225,230,238,.18);

    box-shadow:
        0 8px 0 rgba(0,0,0,.27),
        0 0 18px rgba(180,190,210,.13),
        inset -9px -11px 15px rgba(0,0,0,.25),
        inset 7px 6px 12px rgba(255,255,255,.08);

    overflow:visible;
}

/* kaya üzerindeki ışık yüzeyi */

.engel::before{
    content:"";
    position:absolute;
    left:18%;
    top:13%;
    width:28%;
    height:42%;
    background:rgba(255,255,255,.12);
    clip-path:polygon(
        0 0,
        100% 18%,
        65% 100%,
        20% 72%
    );
    filter:blur(.5px);
}

/* kaya çatlakları */

.engel::after{
    content:"";
    position:absolute;
    right:14%;
    bottom:19%;
    width:34%;
    height:3px;
    background:rgba(25,27,33,.42);
    transform:rotate(-24deg);
    border-radius:3px;
    box-shadow:
        -13px 8px 0 rgba(25,27,33,.27),
        -20px 1px 0 rgba(25,27,33,.16);
}

.engel.kucuk{
    width:36px;
    height:45px;
    clip-path:polygon(
        16% 92%,
        5% 65%,
        12% 29%,
        32% 8%,
        62% 3%,
        91% 25%,
        96% 61%,
        78% 91%,
        48% 100%
    );
}

.engel.buyuk{
    width:53px;
    height:78px;
    clip-path:polygon(
        10% 94%,
        2% 64%,
        10% 27%,
        29% 7%,
        58% 2%,
        86% 16%,
        98% 48%,
        90% 82%,
        68% 97%,
        35% 100%
    );
}

.engel.yuvarlak{
    width:45px;
    height:42px;
    clip-path:polygon(
        12% 74%,
        4% 43%,
        22% 13%,
        52% 4%,
        83% 18%,
        98% 46%,
        87% 78%,
        59% 95%,
        27% 91%
    );
}

/* büyük kayaya farklı yüzey */

.engel.buyuk{
    background:
        radial-gradient(
            circle at 28% 18%,
            rgba(255,255,255,.2),
            transparent 15%
        ),
        radial-gradient(
            circle at 70% 68%,
            rgba(0,0,0,.42),
            transparent 37%
        ),
        linear-gradient(
            145deg,
            #c1c5ce 0%,
            #898f9a 38%,
            #5c626e 70%,
            #343944 100%
        );
}

/* küçük kaya */

.engel.kucuk{
    background:
        radial-gradient(
            circle at 25% 18%,
            rgba(255,255,255,.16),
            transparent 18%
        ),
        linear-gradient(
            145deg,
            #aeb5c0,
            #707784 55%,
            #444a55
        );
}

/* yuvarlak kaya */

.engel.yuvarlak{
    background:
        radial-gradient(
            circle at 32% 24%,
            rgba(255,255,255,.2),
            transparent 17%
        ),
        radial-gradient(
            circle at 72% 72%,
            rgba(0,0,0,.35),
            transparent 45%
        ),
        linear-gradient(
            145deg,
            #adb4c0,
            #777e8b 55%,
            #4b515c
        );
}

/* =========================
   BUTONLAR
========================= */

.oyun-butonlari{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:12px;
    flex-wrap:wrap;
}

.oyun-butonlari button{
    border:0;
    border-radius:13px;
    padding:12px 20px;
    color:white;
    background:linear-gradient(135deg,#7134db,#42168e);
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(75,30,150,.25);
}

.oyun-butonlari button:active{
    transform:translateY(2px);
}

#baslatButon{
    background:linear-gradient(135deg,#8b5cf6,#5b21b6);
}

#yenidenButon{
    display:none;
    background:linear-gradient(135deg,#ff477e,#9b1747);
}

/* =========================
   OYUN BİTTİ
========================= */

.oyun-mesaj{
    position:absolute;
    inset:0;
    z-index:20;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(5,3,10,.72);
    backdrop-filter:blur(5px);
    text-align:center;
}

.oyun-mesaj.aktif{
    display:flex;
}

.oyun-mesaj h3{
    margin:0 0 8px;
    font-size:32px;
    color:#ff6b92;
    text-shadow:0 0 15px rgba(255,70,120,.5);
}

.oyun-mesaj p{
    margin:4px;
    color:#bbb;
}

.oyun-mesaj strong{
    color:#fff;
}

/* =========================
   MOBİL
========================= */

@media(max-width:600px){

    .sayfa{
        padding:18px 10px 30px;
    }

    .baslik h1{
        font-size:27px;
    }

    .oyun-alani{
        height:320px;
    }

    .oyun-ust{
        align-items:flex-start;
        flex-direction:column;
    }

    .istatistik{
        width:100%;
        justify-content:space-between;
    }

    .tuslar{
        gap:8px;
    }

    .tuslar button{
        height:57px;
        font-size:19px;
    }

    #oyuncu{
        left:50px;
    }
}
</style>
</head>

<body>

<div class="sayfa">

    <div class="baslik">
        <h1>🧮 Hesap Makinesi</h1>
        <p>Hesapla, sonra biraz da kaç! 🏃</p>
    </div>

    <!-- =========================
         HESAP MAKİNESİ
    ========================== -->

    <div class="hesap-kutu">

        <div class="ekran" id="ekran">0</div>

        <div class="tuslar">

            <button class="temizle" onclick="temizle()">C</button>
            <button onclick="sil()">⌫</button>
            <button class="operator" onclick="yuzde()">%</button>
            <button class="operator" onclick="operatorEkle('/')">÷</button>

            <button onclick="sayiEkle('7')">7</button>
            <button onclick="sayiEkle('8')">8</button>
            <button onclick="sayiEkle('9')">9</button>
            <button class="operator" onclick="operatorEkle('*')">×</button>

            <button onclick="sayiEkle('4')">4</button>
            <button onclick="sayiEkle('5')">5</button>
            <button onclick="sayiEkle('6')">6</button>
            <button class="operator" onclick="operatorEkle('-')">−</button>

            <button onclick="sayiEkle('1')">1</button>
            <button onclick="sayiEkle('2')">2</button>
            <button onclick="sayiEkle('3')">3</button>
            <button class="operator" onclick="operatorEkle('+')">+</button>

            <button onclick="sayiEkle('0')">0</button>
            <button onclick="virgul()">.</button>
            <button class="esittir" onclick="hesapla()">=</button>
            <button onclick="sayiEkle('00')">00</button>

        </div>
    </div>

    <!-- =========================
         OYUN
    ========================== -->

    <div class="oyun-kutu">

        <div class="oyun-ust">
            <h2>🏃 Kaç!</h2>

            <div class="istatistik">
                <div>Skor: <span id="skor">0</span></div>
                <div>Rekor: <span id="rekor">0</span></div>
            </div>
        </div>

        <div class="oyun-alani" id="oyunAlani">

            <div id="oyuncu">

                <div class="oyuncu-golge"></div>

                <div class="oyuncu-kafa">
                    <div class="oyuncu-sac"></div>
                    <div class="oyuncu-goz sol"></div>
                    <div class="oyuncu-goz sag"></div>
                    <div class="oyuncu-agiz"></div>
                </div>

                <div class="oyuncu-govde"></div>

                <div class="oyuncu-kol sol">
                    <div class="oyuncu-el"></div>
                </div>

                <div class="oyuncu-kol sag">
                    <div class="oyuncu-el"></div>
                </div>

                <div class="oyuncu-bacak sol">
                    <div class="oyuncu-ayak sol"></div>
                </div>

                <div class="oyuncu-bacak sag">
                    <div class="oyuncu-ayak sag"></div>
                </div>

            </div>

            <div class="engel kucuk"></div>

            <div class="zemin"></div>

            <div id="guc">⚡</div>

            <div class="oyun-mesaj" id="oyunMesaj">
                <h3>💥 Oyun Bitti!</h3>
                <p>Skorun: <strong id="sonSkor">0</strong></p>
                <p>Tekrar dene!</p>
            </div>

        </div>

        <div class="oyun-butonlari">
            <button id="baslatButon" onclick="oyunuBaslat()">▶ Oyunu Başlat</button>
            <button id="yenidenButon" onclick="oyunuBaslat()">↻ Yeniden Oyna</button>
        </div>

    </div>

</div>

<script>
/* =====================================================
   HESAP MAKİNESİ
===================================================== */

const ekran=document.getElementById("ekran");

let mevcut="";
let onceki="";
let secilenOperator="";

function ekranGuncelle(){
    ekran.textContent=mevcut || onceki || "0";
}

function sayiEkle(sayi){

    if(secilenOperator && onceki){
        mevcut="";
    }

    if(sayi==="00" && mevcut==="0") return;

    if(mevcut==="0" && sayi!=="0"){
        mevcut="";
    }

    mevcut+=sayi;
    ekranGuncelle();
}

function virgul(){

    if(!mevcut.includes(".")){
        mevcut=mevcut || "0";
        mevcut+=".";
    }

    ekranGuncelle();
}

function operatorEkle(op){

    if(!mevcut && !onceki) return;

    if(mevcut && onceki && secilenOperator){
        hesapla();
    }

    if(mevcut){
        onceki=mevcut;
        mevcut="";
    }

    secilenOperator=op;
    ekran.textContent=onceki+op;
}

function hesapla(){

    if(!onceki || !mevcut || !secilenOperator) return;

    const a=parseFloat(onceki);
    const b=parseFloat(mevcut);

    let sonuc=0;

    if(secilenOperator==="+"){
        sonuc=a+b;
    }else if(secilenOperator==="-"){
        sonuc=a-b;
    }else if(secilenOperator==="*"){
        sonuc=a*b;
    }else if(secilenOperator==="/"){
        if(b===0){
            ekran.textContent="Hata";
            mevcut="";
            onceki="";
            secilenOperator="";
            return;
        }

        sonuc=a/b;
    }

    sonuc=Math.round((sonuc+Number.EPSILON)*100000000)/100000000;

    mevcut=String(sonuc);
    onceki="";
    secilenOperator="";

    ekranGuncelle();
}

function temizle(){

    mevcut="";
    onceki="";
    secilenOperator="";
    ekranGuncelle();
}

function sil(){

    if(mevcut){
        mevcut=mevcut.slice(0,-1);
    }

    ekranGuncelle();
}

function yuzde(){

    if(!mevcut) return;

    mevcut=String(parseFloat(mevcut)/100);
    ekranGuncelle();
}

document.addEventListener("keydown",function(e){

    if(e.key>="0" && e.key<="9"){
        sayiEkle(e.key);
    }

    if(e.key==="."){
        virgul();
    }

    if(["+","-","*","/"].includes(e.key)){
        operatorEkle(e.key);
    }

    if(e.key==="Enter" || e.key==="="){
        hesapla();
    }

    if(e.key==="Backspace"){
        sil();
    }

    if(e.key==="Escape"){
        temizle();
    }
});


/* =====================================================
   OYUN
===================================================== */

const oyunAlani=document.getElementById("oyunAlani");
const oyuncu=document.getElementById("oyuncu");
const skorYazi=document.getElementById("skor");
const rekorYazi=document.getElementById("rekor");
const baslatButon=document.getElementById("baslatButon");
const yenidenButon=document.getElementById("yenidenButon");
const oyunMesaj=document.getElementById("oyunMesaj");
const sonSkorYazi=document.getElementById("sonSkor");
const guc=document.getElementById("guc");

let oyunAktif=false;

let oyuncuY=0;
let oyuncuHizY=0;

let yerde=true;

let sonYerTemasi=0;

let skor=0;
let tamSkor=0;

let engeller=[];

let oyunDongusu=null;
let sonZaman=0;

let engelSayaci=0;

let kalkanAktif=false;
let gucKalkanTimer=null;

let ziplamaKuyrugu=false;


/* daha uzun ve kontrollü zıplama */

const gravityUp=0.72;
const gravityDown=0.92;

const jumpPower=16.2;

const maxDusmeHizi=18;


/* rekor */

let rekor=Number(localStorage.getItem("kacRekor") || 0);

rekorYazi.textContent=rekor;


/* =====================================================
   OYUNCU POZİSYONU
===================================================== */

function oyuncuPozisyonunuUygula(){

    oyuncu.style.transform=
        "translateY("+(-oyuncuY)+"px)";

    if(!yerde){

        oyuncu.classList.add("havada");

        oyuncu.classList.remove("yukseliyor");
        oyuncu.classList.remove("alcaliyor");

        if(oyuncuHizY>0){
            oyuncu.classList.add("yukseliyor");
        }else{
            oyuncu.classList.add("alcaliyor");
        }

    }else{

        oyuncu.classList.remove("havada");
        oyuncu.classList.remove("yukseliyor");
        oyuncu.classList.remove("alcaliyor");
    }
}


/* =====================================================
   ZIPLAMA
===================================================== */

function zipla(){

    if(!oyunAktif) return;

    if(yerde){

        oyuncuHizY=jumpPower;
        yerde=false;
        ziplamaKuyrugu=false;

        oyuncuPozisyonunuUygula();

    }else{

        /* havadayken basıldıysa kısa tampon */

        ziplamaKuyrugu=true;

        setTimeout(()=>{
            ziplamaKuyrugu=false;
        },120);
    }
}


/* mobil / bilgisayar */

oyunAlani.addEventListener("pointerdown",function(e){

    if(e.target.closest(".oyun-mesaj")) return;

    zipla();
});


document.addEventListener("keydown",function(e){

    if(
        e.code==="Space" ||
        e.code==="ArrowUp" ||
        e.key==="w" ||
        e.key==="W"
    ){

        e.preventDefault();

        if(!oyunAktif){
            oyunuBaslat();
            return;
        }

        zipla();
    }
});


/* =====================================================
   FİZİK
===================================================== */

function fizikGuncelle(dt){

    /*
       Yukarı çıkarken daha düşük gravity:
       daha uzun ve rahat zıplama.

       Aşağı inerken biraz daha yüksek gravity:
       havada sonsuza kadar kalmama.
    */

    if(oyuncuHizY>0){
        oyuncuHizY-=gravityUp*dt;
    }else{
        oyuncuHizY-=gravityDown*dt;
    }

    if(oyuncuHizY < -maxDusmeHizi){
        oyuncuHizY=-maxDusmeHizi;
    }

    oyuncuY+=oyuncuHizY*dt;

    if(oyuncuY<=0){

        oyuncuY=0;
        oyuncuHizY=0;

        if(!yerde){

            yerde=true;

            sonYerTemasi=performance.now();

            oyuncu.classList.remove("havada");
            oyuncu.classList.remove("yukseliyor");
            oyuncu.classList.remove("alcaliyor");

            oyuncu.classList.remove("inis");

            void oyuncu.offsetWidth;

            oyuncu.classList.add("inis");

            setTimeout(()=>{
                oyuncu.classList.remove("inis");
            },120);

            if(ziplamaKuyrugu){

                ziplamaKuyrugu=false;

                setTimeout(()=>{
                    if(oyunAktif){
                        zipla();
                    }
                },20);
            }
        }
    }

    oyuncuPozisyonunuUygula();
}


/* =====================================================
   KAYA OLUŞTUR
===================================================== */

function engelOlustur(){

    /*
       Aynı anda fazla kaya yığılmasını engelle.
    */

    const son=engeller[engeller.length-1];

    if(
        son &&
        son.element &&
        son.right < oyunAlani.offsetWidth-230
    ){
        return;
    }

    const engel=document.createElement("div");

    const r=Math.random();

    let tip;

    /*
       Büyük kayalar daha seyrek.
    */

    if(r<0.27){

        tip="yuvarlak";

    }else if(r<0.55){

        tip="buyuk";

    }else{

        tip="kucuk";
    }

    engel.className="engel "+tip;

    engel.style.right="-100px";

    oyunAlani.appendChild(engel);

    engeller.push({
        element:engel,
        right:-100
    });
}


/* =====================================================
   ENGEL HAREKETİ
===================================================== */

function engelleriGuncelle(dt){

    /*
       Oyun ilerledikçe hız artıyor.
       Ancak maksimum hız kontrollü tutuluyor.
    */

    const hiz=Math.min(
        8.2 + tamSkor/750,
        13
    );

    for(let i=engeller.length-1;i>=0;i--){

        const veri=engeller[i];

        veri.right += hiz*dt;

        veri.element.style.right=veri.right+"px";

        /*
           Ekrandan tamamen çıkan kayayı temizle.
        */

        const genislik=veri.element.offsetWidth;

        if(veri.right > oyunAlani.offsetWidth+genislik+30){

            veri.element.remove();
            engeller.splice(i,1);

            continue;
        }

        /*
           Çarpışma kontrolü
        */

        const oyuncuRect=oyuncu.getBoundingClientRect();
        const kayaRect=veri.element.getBoundingClientRect();

        /*
           Kaya hitbox'ını biraz küçültüyoruz.
           Böylece görsel kenara değmek otomatik ölüm olmuyor.
        */

        const kaya={
            left:kayaRect.left+6,
            right:kayaRect.right-6,
            top:kayaRect.top+5,
            bottom:kayaRect.bottom-2
        };

        const karakter={
            left:oyuncuRect.left+9,
            right:oyuncuRect.right-9,
            top:oyuncuRect.top+6,
            bottom:oyuncuRect.bottom-3
        };

        const carpisti=
            karakter.left < kaya.right &&
            karakter.right > kaya.left &&
            karakter.top < kaya.bottom &&
            karakter.bottom > kaya.top;

        if(carpisti){

            if(kalkanAktif){

                veri.element.remove();
                engeller.splice(i,1);

                kalkanAktif=false;

                oyuncu.classList.remove("kalkan");

                guc.classList.remove("hazir");

            }else{

                oyunBitir();

                return;
            }
        }
    }
}


/* =====================================================
   KARAKTER ANİMASYONU
===================================================== */

function karakterAnimasyonu(zaman){

    if(!oyunAktif) return;

    if(!yerde) return;

    const hizAnimasyonu=
        0.0155+
        Math.min(tamSkor/60000,.008);

    const kosu=Math.sin(zaman*hizAnimasyonu);

    const solBacak=
        oyuncu.querySelector(".oyuncu-bacak.sol");

    const sagBacak=
        oyuncu.querySelector(".oyuncu-bacak.sag");

    const solKol=
        oyuncu.querySelector(".oyuncu-kol.sol");

    const sagKol=
        oyuncu.querySelector(".oyuncu-kol.sag");

    solBacak.style.transform=
        "rotate("+(kosu*25)+"deg)";

    sagBacak.style.transform=
        "rotate("+(-kosu*25)+"deg)";

    solKol.style.transform=
        "rotate("+(-kosu*15)+"deg)";

    sagKol.style.transform=
        "rotate("+(kosu*15)+"deg)";

    oyuncu.classList.add("kosuyor");
}


/* =====================================================
   SKOR
===================================================== */

function skorGuncelle(dt){

    tamSkor+=dt;

    skor=Math.floor(tamSkor/5);

    skorYazi.textContent=skor;

    /*
       Her 100 skor civarında kalkan şansı.
    */

    if(skor>0 && skor%100===0){

        if(!kalkanAktif){

            guc.classList.add("hazir");
        }
    }
}


/* =====================================================
   KALKAN
===================================================== */

function kalkanBaslat(){

    if(!oyunAktif) return;

    kalkanAktif=true;

    oyuncu.classList.add("kalkan");

    guc.classList.remove("hazir");

    clearTimeout(gucKalkanTimer);

    gucKalkanTimer=setTimeout(()=>{

        kalkanAktif=false;

        oyuncu.classList.remove("kalkan");

    },5000);
}


/*
   ⚡ ikonuna dokununca kalkan
*/

guc.addEventListener("click",function(e){

    e.stopPropagation();

    if(guc.classList.contains("hazir")){
        kalkanBaslat();
    }
});


/* =====================================================
   OYUN DÖNGÜSÜ
===================================================== */

function oyunDongusuCalistir(zaman){

    if(!oyunAktif) return;

    if(!sonZaman){
        sonZaman=zaman;
    }

    let dt=(zaman-sonZaman)/16.6667;

    /*
       Sekme/lag olduğunda karakterin uçmasını önle.
    */

    dt=Math.min(dt,2);

    sonZaman=zaman;

    fizikGuncelle(dt);

    engelleriGuncelle(dt);

    skorGuncelle(dt);

    karakterAnimasyonu(zaman);

    /*
       Spawn sistemi:
       İlk başta daha seyrek,
       oyun ilerledikçe biraz daha sık.
       Ama minimum 900ms.
    */

    const aralik=Math.max(
        900,
        1350-tamSkor*1.05
    );

    engelSayaci+=dt*16.6667;

    if(engelSayaci>=aralik){

        engelSayaci=0;

        engelOlustur();
    }

    oyunDongusu=requestAnimationFrame(oyunDongusuCalistir);
}


/* =====================================================
   OYUN BAŞLAT
===================================================== */

function oyunuBaslat(){

    if(oyunAktif) return;

    /*
       Eski engelleri temizle.
    */

    engeller.forEach(veri=>{

        if(veri.element){
            veri.element.remove();
        }

    });

    engeller=[];

    skor=0;
    tamSkor=0;

    oyuncuY=0;
    oyuncuHizY=0;

    yerde=true;

    engelSayaci=0;

    sonZaman=0;

    kalkanAktif=false;

    clearTimeout(gucKalkanTimer);

    oyuncu.classList.remove("kalkan");
    oyuncu.classList.remove("havada");
    oyuncu.classList.remove("yukseliyor");
    oyuncu.classList.remove("alcaliyor");

    guc.classList.remove("hazir");

    skorYazi.textContent="0";

    oyunMesaj.classList.remove("aktif");

    baslatButon.style.display="none";
    yenidenButon.style.display="none";

    oyunAktif=true;

    /*
       İlk kayanın biraz geç gelmesi:
       oyuncuya hazırlanma süresi.
    */

    setTimeout(()=>{

        if(oyunAktif){
            engelOlustur();
        }

    },900);

    oyunDongusu=requestAnimationFrame(oyunDongusuCalistir);
}


/* =====================================================
   OYUN BİTİR
===================================================== */

function oyunBitir(){

    if(!oyunAktif) return;

    oyunAktif=false;

    cancelAnimationFrame(oyunDongusu);

    oyuncu.classList.remove("kosuyor");
    oyuncu.classList.remove("havada");
    oyuncu.classList.remove("yukseliyor");
    oyuncu.classList.remove("alcaliyor");
    oyuncu.classList.remove("kalkan");

    kalkanAktif=false;

    clearTimeout(gucKalkanTimer);

    if(skor>rekor){

        rekor=skor;

        localStorage.setItem(
            "kacRekor",
            String(rekor)
        );
    }

    rekorYazi.textContent=rekor;

    sonSkorYazi.textContent=skor;

    oyunMesaj.classList.add("aktif");

    yenidenButon.style.display="inline-block";
}


/* =====================================================
   BAŞLANGIÇ
===================================================== */

ekranGuncelle();

</script>
