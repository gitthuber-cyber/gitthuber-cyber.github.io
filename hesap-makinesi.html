<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#03040c">

<title>Kaç! - Ali tarafından yapılmıştır</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    background:#03040c;
}

/* =========================
   ANA OYUN ALANI
========================= */

.sayfa{
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.oyun-kutu{
    width:min(950px,100%);
    position:relative;
    z-index:10;
}

/* =========================
   ÜST KISIM
========================= */

.oyun-ust{
    text-align:center;
    margin-bottom:15px;
}

.oyun-ust h1{
    margin:0;
    font-size:38px;
    color:#fff;
    text-shadow:
        0 0 8px #9c5cff,
        0 0 25px rgba(140,70,255,.8),
        0 0 50px rgba(80,20,255,.35);
}

.yapimci{
    margin-top:6px;
    font-size:13px;
    color:rgba(255,255,255,.55);
    letter-spacing:.7px;
    text-shadow:0 0 10px rgba(150,80,255,.4);
}

.istatistik{
    margin-top:12px;
    display:flex;
    justify-content:center;
    gap:25px;
    font-size:15px;
    color:#aaa;
}

.istatistik span{
    color:#fff;
    font-weight:bold;
    text-shadow:0 0 8px rgba(255,255,255,.35);
}

/* =========================
   NEON OYUN SAHNESİ
========================= */

.oyun-alani{
    position:relative;
    width:100%;
    height:400px;
    overflow:hidden;
    border-radius:25px;

    background:
        radial-gradient(
            circle at 20% 25%,
            rgba(103,55,255,.20),
            transparent 28%
        ),
        radial-gradient(
            circle at 82% 30%,
            rgba(0,220,255,.12),
            transparent 25%
        ),
        linear-gradient(
            180deg,
            #080719 0%,
            #050511 60%,
            #03040c 100%
        );

    border:1px solid rgba(140,80,255,.35);

    box-shadow:
        0 0 30px rgba(90,30,255,.12),
        0 0 80px rgba(30,120,255,.05),
        inset 0 0 60px rgba(0,0,0,.75);
}

/* =========================
   NEON IŞIKLAR
========================= */

.isik{
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    filter:blur(50px);
    opacity:.18;
    pointer-events:none;
}

.isik1{
    left:-80px;
    top:-90px;
    background:#743cff;
    animation:isikHareket1 6s ease-in-out infinite alternate;
}

.isik2{
    right:-90px;
    top:40px;
    background:#00d9ff;
    animation:isikHareket2 7s ease-in-out infinite alternate;
}

.isik3{
    left:40%;
    bottom:-130px;
    background:#bd38ff;
    animation:isikHareket3 8s ease-in-out infinite alternate;
}

@keyframes isikHareket1{
    from{transform:translate(0,0);}
    to{transform:translate(80px,40px);}
}

@keyframes isikHareket2{
    from{transform:translate(0,0);}
    to{transform:translate(-70px,45px);}
}

@keyframes isikHareket3{
    from{transform:translate(0,0);}
    to{transform:translate(40px,-40px);}
}

/* =========================
   YILDIZ / PARÇACIKLAR
========================= */

.parcacik{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#fff;
    opacity:.5;
    box-shadow:0 0 7px #fff;
    animation:parcacikAnim linear infinite;
}

.parcacik:nth-child(1){
    left:8%;
    top:18%;
    animation-duration:5s;
}

.parcacik:nth-child(2){
    left:18%;
    top:48%;
    animation-duration:7s;
}

.parcacik:nth-child(3){
    left:31%;
    top:12%;
    animation-duration:6s;
}

.parcacik:nth-child(4){
    left:47%;
    top:31%;
    animation-duration:8s;
}

.parcacik:nth-child(5){
    left:63%;
    top:16%;
    animation-duration:5.5s;
}

.parcacik:nth-child(6){
    left:76%;
    top:43%;
    animation-duration:7.5s;
}

.parcacik:nth-child(7){
    left:88%;
    top:20%;
    animation-duration:6.5s;
}

.parcacik:nth-child(8){
    left:54%;
    top:57%;
    animation-duration:8.5s;
}

@keyframes parcacikAnim{
    0%,100%{
        opacity:.15;
        transform:translateY(0);
    }

    50%{
        opacity:.8;
        transform:translateY(-18px);
    }
}

/* =========================
   NEON GRID
========================= */

.cizgiler{
    position:absolute;
    left:-10%;
    right:-10%;
    bottom:0;
    height:130px;
    z-index:1;
    opacity:.35;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 48px,
            rgba(80,120,255,.32) 49px 50px
        ),
        repeating-linear-gradient(
            0deg,
            transparent 0 28px,
            rgba(130,60,255,.28) 29px 30px
        );

    transform:
        perspective(180px)
        rotateX(55deg);

    transform-origin:bottom;
}

/* =========================
   ŞEHİR SİLUETLERİ
========================= */

.sehir{
    position:absolute;
    left:0;
    right:0;
    bottom:45px;
    height:120px;
    z-index:1;
    display:flex;
    align-items:flex-end;
    gap:8px;
    opacity:.35;
}

.bina{
    position:relative;
    flex:1;
    min-width:20px;
    background:
        linear-gradient(
            90deg,
            #080813,
            #111329,
            #070711
        );
    border-top:1px solid rgba(100,100,255,.25);
}

.bina::after{
    content:"";
    position:absolute;
    inset:10px 7px;
    background:
        repeating-linear-gradient(
            0deg,
            transparent 0 14px,
            rgba(90,150,255,.35) 15px 17px
        ),
        repeating-linear-gradient(
            90deg,
            transparent 0 9px,
            rgba(255,120,255,.2) 10px 12px
        );
    opacity:.5;
}

.bina:nth-child(1){height:55px;}
.bina:nth-child(2){height:90px;}
.bina:nth-child(3){height:68px;}
.bina:nth-child(4){height:105px;}
.bina:nth-child(5){height:75px;}
.bina:nth-child(6){height:115px;}
.bina:nth-child(7){height:65px;}
.bina:nth-child(8){height:95px;}
.bina:nth-child(9){height:58px;}
.bina:nth-child(10){height:82px;}

/* =========================
   ZEMİN
========================= */

.zemin{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:47px;
    z-index:3;

    background:
        linear-gradient(
            180deg,
            #161022,
            #08070d
        );

    border-top:2px solid rgba(125,70,255,.5);

    box-shadow:
        0 -5px 20px rgba(90,40,255,.16),
        inset 0 8px 15px rgba(0,0,0,.3);
}

.zemin::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 55px,
            rgba(80,100,255,.1) 56px 58px
        );
}

/* =========================
   KARAKTER
========================= */

#oyuncu{
    position:absolute;
    left:75px;
    bottom:47px;
    width:52px;
    height:80px;
    z-index:8;
}

.oyuncu-golge{
    position:absolute;
    left:0;
    bottom:-5px;
    width:52px;
    height:9px;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    filter:blur(3px);
    z-index:-1;
}

.oyuncu-kafa{
    position:absolute;
    left:8px;
    top:0;
    width:35px;
    height:35px;
    border-radius:50%;
    background:linear-gradient(145deg,#ffd8c4,#e69e85);
    border:2px solid rgba(255,255,255,.1);
    z-index:5;
}

.oyuncu-sac{
    position:absolute;
    left:2px;
    top:-2px;
    width:32px;
    height:18px;
    border-radius:18px 18px 7px 7px;
    background:linear-gradient(145deg,#19131f,#050409);
}

.oyuncu-sac::after{
    content:"";
    position:absolute;
    left:0;
    top:9px;
    width:9px;
    height:13px;
    border-radius:0 0 8px 7px;
    background:#09070d;
}

.oyuncu-goz{
    position:absolute;
    top:15px;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#151019;
}

.oyuncu-goz.sol{
    left:9px;
}

.oyuncu-goz.sag{
    right:9px;
}

.oyuncu-agiz{
    position:absolute;
    left:13px;
    top:23px;
    width:9px;
    height:4px;
    border-bottom:2px solid #8b4d57;
    border-radius:50%;
}

.oyuncu-govde{
    position:absolute;
    left:10px;
    top:33px;
    width:32px;
    height:31px;
    border-radius:9px;
    background:linear-gradient(145deg,#814cff,#4b20a0);
    box-shadow:
        0 0 12px rgba(110,50,255,.25),
        inset 0 4px 8px rgba(255,255,255,.1);
}

.oyuncu-govde::after{
    content:"";
    position:absolute;
    left:11px;
    top:6px;
    width:10px;
    height:15px;
    border-radius:5px;
    background:rgba(255,255,255,.1);
}

.oyuncu-kol{
    position:absolute;
    top:35px;
    width:10px;
    height:29px;
    border-radius:8px;
    background:linear-gradient(180deg,#a666ff,#5425a5);
    transform-origin:top center;
    z-index:2;
}

.oyuncu-kol.sol{
    left:3px;
    transform:rotate(15deg);
}

.oyuncu-kol.sag{
    right:3px;
    transform:rotate(-15deg);
}

.oyuncu-el{
    position:absolute;
    left:0;
    bottom:-5px;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#efb29a;
}

.oyuncu-bacak{
    position:absolute;
    top:60px;
    width:11px;
    height:22px;
    border-radius:7px;
    background:linear-gradient(180deg,#30203e,#17101f);
    transform-origin:top center;
}

.oyuncu-bacak.sol{
    left:14px;
}

.oyuncu-bacak.sag{
    right:14px;
}

.oyuncu-ayak{
    position:absolute;
    bottom:-3px;
    width:18px;
    height:8px;
    border-radius:7px 7px 3px 3px;
    background:#08070c;
}

.oyuncu-ayak.sol{
    left:-5px;
}

.oyuncu-ayak.sag{
    right:-5px;
}

/* koşu */

#oyuncu.kosuyor .oyuncu-bacak.sol{
    transform:rotate(25deg);
}

#oyuncu.kosuyor .oyuncu-bacak.sag{
    transform:rotate(-25deg);
}

#oyuncu.kosuyor .oyuncu-kol.sol{
    transform:rotate(-15deg);
}

#oyuncu.kosuyor .oyuncu-kol.sag{
    transform:rotate(15deg);
}

/* havada */

#oyuncu.havada.yukseliyor .oyuncu-bacak.sol{
    transform:rotate(30deg);
}

#oyuncu.havada.yukseliyor .oyuncu-bacak.sag{
    transform:rotate(-30deg);
}

#oyuncu.havada.yukseliyor .oyuncu-kol.sol{
    transform:rotate(-35deg);
}

#oyuncu.havada.yukseliyor .oyuncu-kol.sag{
    transform:rotate(35deg);
}

#oyuncu.havada.alcaliyor .oyuncu-bacak.sol{
    transform:rotate(-18deg);
}

#oyuncu.havada.alcaliyor .oyuncu-bacak.sag{
    transform:rotate(18deg);
}

#oyuncu.havada.alcaliyor .oyuncu-kol.sol{
    transform:rotate(28deg);
}

#oyuncu.havada.alcaliyor .oyuncu-kol.sag{
    transform:rotate(-28deg);
}

/* iniş */

#oyuncu.inis{
    animation:inis .12s ease-out;
}

@keyframes inis{
    0%{
        transform:scaleY(.88) scaleX(1.08);
    }

    100%{
        transform:scaleY(1) scaleX(1);
    }
}

/* =========================
   KALKAN
========================= */

#oyuncu.kalkan::before{
    content:"";
    position:absolute;
    inset:-14px;
    border-radius:50%;
    border:3px solid #48e8ff;

    background:
        radial-gradient(
            circle,
            rgba(72,232,255,.14),
            rgba(72,232,255,.03) 60%,
            transparent 70%
        );

    box-shadow:
        0 0 12px #48e8ff,
        0 0 30px rgba(72,232,255,.65),
        inset 0 0 20px rgba(72,232,255,.3);

    animation:kalkanDon 1s linear infinite;
    pointer-events:none;
}

@keyframes kalkanDon{
    0%{
        transform:rotate(0deg) scale(.98);
    }

    50%{
        transform:rotate(180deg) scale(1.04);
    }

    100%{
        transform:rotate(360deg) scale(.98);
    }
}

/* =========================
   KAYALAR
========================= */

.engel{
    position:absolute;
    bottom:47px;
    right:-100px;
    z-index:6;

    background:
        radial-gradient(
            circle at 27% 20%,
            rgba(255,255,255,.18),
            transparent 17%
        ),
        radial-gradient(
            circle at 72% 72%,
            rgba(0,0,0,.38),
            transparent 38%
        ),
        linear-gradient(
            145deg,
            #b8bec9 0%,
            #858b98 42%,
            #565c68 72%,
            #363b46 100%
        );

    border:2px solid rgba(225,230,238,.18);

    box-shadow:
        0 8px 0 rgba(0,0,0,.27),
        0 0 18px rgba(180,190,210,.13),
        inset -9px -11px 15px rgba(0,0,0,.25),
        inset 7px 6px 12px rgba(255,255,255,.08);

    overflow:visible;
}

.engel::before{
    content:"";
    position:absolute;
    left:18%;
    top:13%;
    width:28%;
    height:42%;

    background:rgba(255,255,255,.12);

    clip-path:polygon(
        0 0,
        100% 18%,
        65% 100%,
        20% 72%
    );
}

.engel::after{
    content:"";
    position:absolute;
    right:14%;
    bottom:19%;
    width:34%;
    height:3px;

    background:rgba(25,27,33,.42);

    transform:rotate(-24deg);

    border-radius:3px;

    box-shadow:
        -13px 8px 0 rgba(25,27,33,.27),
        -20px 1px 0 rgba(25,27,33,.16);
}

.engel.kucuk{
    width:36px;
    height:45px;

    clip-path:polygon(
        16% 92%,
        5% 65%,
        12% 29%,
        32% 8%,
        62% 3%,
        91% 25%,
        96% 61%,
        78% 91%,
        48% 100%
    );
}

.engel.buyuk{
    width:53px;
    height:78px;

    clip-path:polygon(
        10% 94%,
        2% 64%,
        10% 27%,
        29% 7%,
        58% 2%,
        86% 16%,
        98% 48%,
        90% 82%,
        68% 97%,
        35% 100%
    );
}

.engel.yuvarlak{
    width:45px;
    height:42px;

    clip-path:polygon(
        12% 74%,
        4% 43%,
        22% 13%,
        52% 4%,
        83% 18%,
        98% 46%,
        87% 78%,
        59% 95%,
        27% 91%
    );
}

/* =========================
   GÜÇ
========================= */

#guc{
    position:absolute;
    left:50%;
    bottom:70px;
    z-index:12;

    font-size:25px;

    opacity:.35;

    transform:translateX(-50%);

    transition:.2s;

    cursor:pointer;

    user-select:none;
}

#guc.hazir{
    opacity:1;

    animation:
        gucParla .8s infinite alternate,
        gucYuksel 1.4s ease-in-out infinite;
}

@keyframes gucParla{
    from{
        filter:drop-shadow(0 0 3px #48e8ff);
    }

    to{
        filter:drop-shadow(0 0 15px #48e8ff);
    }
}

@keyframes gucYuksel{
    0%,100%{
        transform:translate(-50%,0);
    }

    50%{
        transform:translate(-50%,-7px);
    }
}

/* =========================
   OYUN MESAJI
========================= */

.oyun-mesaj{
    position:absolute;
    inset:0;
    z-index:30;

    display:none;

    align-items:center;
    justify-content:center;
    flex-direction:column;

    text-align:center;

    background:rgba(3,2,10,.76);
    backdrop-filter:blur(7px);
}

.oyun-mesaj.aktif{
    display:flex;
}

.oyun-mesaj h2{
    margin:0 0 8px;

    font-size:34px;

    color:#ff668e;

    text-shadow:
        0 0 10px rgba(255,60,120,.7),
        0 0 30px rgba(255,30,100,.35);
}

.oyun-mesaj p{
    margin:5px;
    color:#bbb;
}

.oyun-mesaj strong{
    color:#fff;
}

/* =========================
   BUTONLAR
========================= */

.butonlar{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:15px;
}

.butonlar button{
    border:0;
    padding:13px 25px;

    border-radius:14px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #813dff,
            #48169c
        );

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 7px 20px rgba(75,25,160,.3);

    transition:.15s;
}

.butonlar button:active{
    transform:translateY(3px);
}

#yenidenButon{
    display:none;

    background:
        linear-gradient(
            135deg,
            #ff477e,
            #99163f
        );
}

/* =========================
   MOBİL
========================= */

@media(max-width:650px){

    .sayfa{
        padding:12px;
    }

    .oyun-ust h1{
        font-size:30px;
    }

    .oyun-alani{
        height:360px;
    }

    #oyuncu{
        left:55px;
    }

    .istatistik{
        gap:18px;
        font-size:14px;
    }
}

@media(max-height:700px){

    .sayfa{
        padding-top:8px;
        padding-bottom:8px;
    }

    .oyun-alani{
        height:330px;
    }
}
</style>
</head>

<body>

<div class="sayfa">

    <div class="oyun-kutu">

        <!-- ÜST KISIM -->

        <div class="oyun-ust">

            <h1>🏃 Kaç!</h1>

            <div class="yapimci">
                Ali tarafından yapılmıştır
            </div>

            <div class="istatistik">

                <div>
                    Skor:
                    <span id="skor">0</span>
                </div>

                <div>
                    Rekor:
                    <span id="rekor">0</span>
                </div>

            </div>

        </div>


        <!-- OYUN -->

        <div class="oyun-alani" id="oyunAlani">

            <!-- ışıklar -->

            <div class="isik isik1"></div>
            <div class="isik isik2"></div>
            <div class="isik isik3"></div>

            <!-- parçacıklar -->

            <div class="parcacik"></div>
            <div class="parcacik"></div>
            <div class="parcacik"></div>
            <div class="parcacik"></div>
            <div class="parcacik"></div>
            <div class="parcacik"></div>
            <div class="parcacik"></div>
            <div class="parcacik"></div>

            <!-- şehir -->

            <div class="sehir">

                <div class="bina"></div>
                <div class="bina"></div>
                <div class="bina"></div>
                <div class="bina"></div>
                <div class="bina"></div>
                <div class="bina"></div>
                <div class="bina"></div>
                <div class="bina"></div>
                <div class="bina"></div>
                <div class="bina"></div>

            </div>

            <!-- grid -->

            <div class="cizgiler"></div>


            <!-- KARAKTER -->

            <div id="oyuncu">

                <div class="oyuncu-golge"></div>

                <div class="oyuncu-kafa">

                    <div class="oyuncu-sac"></div>

                    <div class="oyuncu-goz sol"></div>
                    <div class="oyuncu-goz sag"></div>

                    <div class="oyuncu-agiz"></div>

                </div>

                <div class="oyuncu-govde"></div>

                <div class="oyuncu-kol sol">
                    <div class="oyuncu-el"></div>
                </div>

                <div class="oyuncu-kol sag">
                    <div class="oyuncu-el"></div>
                </div>

                <div class="oyuncu-bacak sol">
                    <div class="oyuncu-ayak sol"></div>
                </div>

                <div class="oyuncu-bacak sag">
                    <div class="oyuncu-ayak sag"></div>
                </div>

            </div>


            <!-- ZEMİN -->

            <div class="zemin"></div>


            <!-- KALKAN -->

            <div id="guc">⚡</div>


            <!-- OYUN BİTİŞ -->

            <div class="oyun-mesaj" id="oyunMesaj">

                <h2>💥 Oyun Bitti!</h2>

                <p>
                    Skorun:
                    <strong id="sonSkor">0</strong>
                </p>

                <p>
                    Tekrar dene!
                </p>

            </div>

        </div>


        <!-- BUTONLAR -->

        <div class="butonlar">

            <button id="baslatButon" onclick="oyunuBaslat()">
                ▶ Oyunu Başlat
            </button>

            <button id="yenidenButon" onclick="oyunuBaslat()">
                ↻ Yeniden Oyna
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   OYUN DEĞİŞKENLERİ
===================================================== */

const oyunAlani =
    document.getElementById("oyunAlani");

const oyuncu =
    document.getElementById("oyuncu");

const skorYazi =
    document.getElementById("skor");

const rekorYazi =
    document.getElementById("rekor");

const baslatButon =
    document.getElementById("baslatButon");

const yenidenButon =
    document.getElementById("yenidenButon");

const oyunMesaj =
    document.getElementById("oyunMesaj");

const sonSkorYazi =
    document.getElementById("sonSkor");

const guc =
    document.getElementById("guc");


let oyunAktif=false;

let oyuncuY=0;
let oyuncuHizY=0;

let yerde=true;

let skor=0;
let tamSkor=0;

let engeller=[];

let oyunDongusu=null;

let sonZaman=0;

let engelSayaci=0;

let kalkanAktif=false;

let gucKalkanTimer=null;

let ziplamaKuyrugu=false;


/* =====================================================
   FİZİK
===================================================== */

const gravityUp=0.72;

const gravityDown=0.92;

const jumpPower=16.2;

const maxDusmeHizi=18;


/* =====================================================
   REKOR
===================================================== */

let rekor=
    Number(
        localStorage.getItem("kacRekor") || 0
    );

rekorYazi.textContent=rekor;


/* =====================================================
   KARAKTER POZİSYONU
===================================================== */

function oyuncuPozisyonunuUygula(){

    oyuncu.style.transform=
        "translateY("+(-oyuncuY)+"px)";

    if(!yerde){

        oyuncu.classList.add("havada");

        oyuncu.classList.remove("yukseliyor");
        oyuncu.classList.remove("alcaliyor");

        if(oyuncuHizY>0){

            oyuncu.classList.add("yukseliyor");

        }else{

            oyuncu.classList.add("alcaliyor");
        }

    }else{

        oyuncu.classList.remove("havada");
        oyuncu.classList.remove("yukseliyor");
        oyuncu.classList.remove("alcaliyor");
    }
}


/* =====================================================
   ZIPLA
===================================================== */

function zipla(){

    if(!oyunAktif) return;

    if(yerde){

        oyuncuHizY=jumpPower;

        yerde=false;

        ziplamaKuyrugu=false;

        oyuncuPozisyonunuUygula();

    }else{

        ziplamaKuyrugu=true;

        setTimeout(()=>{

            ziplamaKuyrugu=false;

        },120);
    }
}


/* =====================================================
   DOKUNMA
===================================================== */

oyunAlani.addEventListener(
    "pointerdown",
    function(e){

        if(
            e.target.closest(".oyun-mesaj")
        ){
            return;
        }

        zipla();
    }
);


/* =====================================================
   KLAVYE
===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.code==="Space" ||
            e.code==="ArrowUp" ||
            e.key==="w" ||
            e.key==="W"
        ){

            e.preventDefault();

            if(!oyunAktif){

                oyunuBaslat();

                return;
            }

            zipla();
        }
    }
);


/* =====================================================
   FİZİK GÜNCELLE
===================================================== */

function fizikGuncelle(dt){

    if(oyuncuHizY>0){

        oyuncuHizY-=gravityUp*dt;

    }else{

        oyuncuHizY-=gravityDown*dt;
    }


    if(
        oyuncuHizY < -maxDusmeHizi
    ){

        oyuncuHizY=-maxDusmeHizi;
    }


    oyuncuY+=oyuncuHizY*dt;


    if(oyuncuY<=0){

        oyuncuY=0;

        oyuncuHizY=0;


        if(!yerde){

            yerde=true;


            oyuncu.classList.remove("havada");

            oyuncu.classList.remove("yukseliyor");

            oyuncu.classList.remove("alcaliyor");


            oyuncu.classList.remove("inis");

            void oyuncu.offsetWidth;

            oyuncu.classList.add("inis");


            setTimeout(()=>{

                oyuncu.classList.remove("inis");

            },120);


            if(ziplamaKuyrugu){

                ziplamaKuyrugu=false;

                setTimeout(()=>{

                    if(oyunAktif){

                        zipla();
                    }

                },20);
            }
        }
    }


    oyuncuPozisyonunuUygula();
}


/* =====================================================
   KAYA OLUŞTUR
===================================================== */

function engelOlustur(){

    const son=
        engeller[engeller.length-1];


    if(
        son &&
        son.element &&
        son.right <
        oyunAlani.offsetWidth-230
    ){

        return;
    }


    const engel=
        document.createElement("div");


    const r=Math.random();

    let tip;


    if(r<0.27){

        tip="yuvarlak";

    }else if(r<0.55){

        tip="buyuk";

    }else{

        tip="kucuk";
    }


    engel.className=
        "engel "+tip;


    engel.style.right="-100px";


    oyunAlani.appendChild(engel);


    engeller.push({

        element:engel,

        right:-100

    });
}


/* =====================================================
   ENGELLER
===================================================== */

function engelleriGuncelle(dt){

    const hiz=
        Math.min(
            8.2 + tamSkor/750,
            13
        );


    for(
        let i=engeller.length-1;
        i>=0;
        i--
    ){

        const veri=
            engeller[i];


        veri.right+=hiz*dt;


        veri.element.style.right=
            veri.right+"px";


        const genislik=
            veri.element.offsetWidth;


        if(
            veri.right >
            oyunAlani.offsetWidth+
            genislik+
            30
        ){

            veri.element.remove();

            engeller.splice(i,1);

            continue;
        }


        const oyuncuRect=
            oyuncu.getBoundingClientRect();


        const kayaRect=
            veri.element.getBoundingClientRect();


        const kaya={

            left:kayaRect.left+6,

            right:kayaRect.right-6,

            top:kayaRect.top+5,

            bottom:kayaRect.bottom-2
        };


        const karakter={

            left:oyuncuRect.left+9,

            right:oyuncuRect.right-9,

            top:oyuncuRect.top+6,

            bottom:oyuncuRect.bottom-3
        };


        const carpisti=

            karakter.left <
            kaya.right &&

            karakter.right >
            kaya.left &&

            karakter.top <
            kaya.bottom &&

            karakter.bottom >
            kaya.top;


        if(carpisti){

            if(kalkanAktif){

                veri.element.remove();

                engeller.splice(i,1);

                kalkanAktif=false;

                oyuncu.classList.remove("kalkan");

            }else{

                oyunBitir();

                return;
            }
        }
    }
}


/* =====================================================
   KARAKTER KOŞU ANİMASYONU
===================================================== */

function karakterAnimasyonu(zaman){

    if(!oyunAktif) return;

    if(!yerde) return;


    oyuncu.classList.add("kosuyor");


    const hizAnimasyonu=
        0.0155+
        Math.min(tamSkor/60000,.008);


    const kosu=
        Math.sin(
            zaman*hizAnimasyonu
        );


    const solBacak=
        oyuncu.querySelector(
            ".oyuncu-bacak.sol"
        );

    const sagBacak=
        oyuncu.querySelector(
            ".oyuncu-bacak.sag"
        );

    const solKol=
        oyuncu.querySelector(
            ".oyuncu-kol.sol"
        );

    const sagKol=
        oyuncu.querySelector(
            ".oyuncu-kol.sag"
        );


    solBacak.style.transform=
        "rotate("+
        (kosu*25)+
        "deg)";


    sagBacak.style.transform=
        "rotate("+
        (-kosu*25)+
        "deg)";


    solKol.style.transform=
        "rotate("+
        (-kosu*15)+
        "deg)";


    sagKol.style.transform=
        "rotate("+
        (kosu*15)+
        "deg)";
}


/* =====================================================
   SKOR
===================================================== */

function skorGuncelle(dt){

    tamSkor+=dt;

    skor=
        Math.floor(
            tamSkor/5
        );


    skorYazi.textContent=
        skor;


    if(
        skor>0 &&
        skor%100===0 &&
        !kalkanAktif
    ){

        guc.classList.add("hazir");
    }
}


/* =====================================================
   KALKAN
===================================================== */

function kalkanBaslat(){

    if(!oyunAktif) return;


    kalkanAktif=true;


    oyuncu.classList.add("kalkan");


    guc.classList.remove("hazir");


    clearTimeout(
        gucKalkanTimer
    );


    gucKalkanTimer=
        setTimeout(()=>{

            kalkanAktif=false;

            oyuncu.classList.remove(
                "kalkan"
            );

        },5000);
}


guc.addEventListener(
    "click",
    function(e){

        e.stopPropagation();


        if(
            guc.classList.contains("hazir")
        ){

            kalkanBaslat();
        }
    }
);


/* =====================================================
   ANA OYUN DÖNGÜSÜ
===================================================== */

function oyunDongusuCalistir(zaman){

    if(!oyunAktif) return;


    if(!sonZaman){

        sonZaman=zaman;
    }


    let dt=
        (zaman-sonZaman)/
        16.6667;


    dt=Math.min(dt,2);


    sonZaman=zaman;


    fizikGuncelle(dt);

    engelleriGuncelle(dt);

    skorGuncelle(dt);

    karakterAnimasyonu(zaman);


    const aralik=
        Math.max(
            900,
            1350-tamSkor*1.05
        );


    engelSayaci+=
        dt*16.6667;


    if(
        engelSayaci>=aralik
    ){

        engelSayaci=0;

        engelOlustur();
    }


    oyunDongusu=
        requestAnimationFrame(
            oyunDongusuCalistir
        );
}


/* =====================================================
   OYUNU BAŞLAT
===================================================== */

function oyunuBaslat(){

    if(oyunAktif) return;


    engeller.forEach(
        veri=>{

            if(veri.element){

                veri.element.remove();
            }
        }
    );


    engeller=[];


    skor=0;

    tamSkor=0;


    oyuncuY=0;

    oyuncuHizY=0;


    yerde=true;


    engelSayaci=0;

    sonZaman=0;


    kalkanAktif=false;


    clearTimeout(
        gucKalkanTimer
    );


    oyuncu.classList.remove(
        "kalkan"
    );


    oyuncu.classList.remove(
        "havada"
    );


    oyuncu.classList.remove(
        "yukseliyor"
    );


    oyuncu.classList.remove(
        "alcaliyor"
    );


    oyuncu.classList.remove(
        "kosuyor"
    );


    guc.classList.remove(
        "hazir"
    );


    skorYazi.textContent="0";


    oyunMesaj.classList.remove(
        "aktif"
    );


    baslatButon.style.display=
        "none";


    yenidenButon.style.display=
        "none";


    oyunAktif=true;


    /*
       Oyuncuya başlangıçta hazırlanması
       için kısa süre veriyoruz.
    */

    setTimeout(()=>{

        if(oyunAktif){

            engelOlustur();
        }

    },900);


    oyunDongusu=
        requestAnimationFrame(
            oyunDongusuCalistir
        );
}


/* =====================================================
   OYUNU BİTİR
===================================================== */

function oyunBitir(){

    if(!oyunAktif) return;


    oyunAktif=false;


    cancelAnimationFrame(
        oyunDongusu
    );


    oyuncu.classList.remove(
        "kosuyor"
    );


    oyuncu.classList.remove(
        "havada"
    );


    oyuncu.classList.remove(
        "yukseliyor"
    );


    oyuncu.classList.remove(
        "alcaliyor"
    );


    oyuncu.classList.remove(
        "kalkan"
    );


    kalkanAktif=false;


    clearTimeout(
        gucKalkanTimer
    );


    if(skor>rekor){

        rekor=skor;


        localStorage.setItem(
            "kacRekor",
            String(rekor)
        );
    }


    rekorYazi.textContent=
        rekor;


    sonSkorYazi.textContent=
        skor;


    oyunMesaj.classList.add(
        "aktif"
    );


    yenidenButon.style.display=
        "inline-block";
}

</script>

</body>
</html>
