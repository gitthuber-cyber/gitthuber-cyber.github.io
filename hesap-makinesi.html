<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hesap Makinesi & Kaç!</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Arial,sans-serif;
    color:white;
    background:
        radial-gradient(circle at top left,#32105f 0%,transparent 35%),
        radial-gradient(circle at bottom right,#101d65 0%,transparent 40%),
        #05030b;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 20% 30%,rgba(150,70,255,.12),transparent 25%),
        radial-gradient(circle at 80% 70%,rgba(40,100,255,.10),transparent 25%);
}

.panel{
    display:none;
    width:100%;
    max-width:430px;
    position:relative;
    z-index:5;
}

.panel.aktif{
    display:block;
}

.kutu{
    width:100%;
    padding:20px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:28px;
    background:rgba(15,10,28,.78);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        0 0 35px rgba(140,60,255,.12);
}

.panel-ust{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
}

.panel-baslik{
    font-size:20px;
    font-weight:800;
}

.kapat-btn{
    border:0;
    color:#fff;
    background:rgba(255,255,255,.08);
    padding:9px 13px;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;
}

.kapat-btn:hover{
    background:rgba(255,80,100,.22);
}

#ekran{
    width:100%;
    height:85px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
    outline:none;
    padding:15px;
    margin-bottom:14px;
    color:white;
    background:rgba(0,0,0,.35);
    text-align:right;
    font-size:34px;
    font-weight:bold;
}

.butonlar{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.butonlar button{
    min-height:62px;
    border:0;
    border-radius:17px;
    color:white;
    background:rgba(255,255,255,.08);
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
}

.butonlar button:hover{
    background:rgba(255,255,255,.15);
    transform:translateY(-2px);
}

.butonlar button:active{
    transform:scale(.94);
}

.butonlar .islem{
    background:rgba(130,55,255,.28);
}

.butonlar .temizle{
    background:rgba(255,70,90,.22);
}

.butonlar .esittir{
    background:linear-gradient(135deg,#793cff,#4b55ff);
}


/* =========================
   OYUN
========================= */

.game-panel{
    position:relative;
}

.oyun-kontrol{
    display:flex;
    justify-content:center;
    margin-bottom:12px;
}

#baslatBtn,
#tekrarOyna{
    border:0;
    border-radius:14px;
    padding:11px 18px;
    color:white;
    background:linear-gradient(135deg,#7c3cff,#4f5cff);
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(100,60,255,.25);
}

#baslatBtn:hover,
#tekrarOyna:hover{
    transform:translateY(-1px);
}

.oyun-alani{
    position:relative;
    height:330px;
    overflow:hidden;
    border-radius:22px;
    border:1px solid rgba(255,255,255,.1);
    background:
        radial-gradient(circle at 75% 20%,rgba(125,80,255,.18),transparent 25%),
        linear-gradient(#080713,#0b0920);
    box-shadow:inset 0 0 50px rgba(0,0,0,.5);
    touch-action:none;
    user-select:none;
}

.ay{
    position:absolute;
    width:65px;
    height:65px;
    right:35px;
    top:30px;
    border-radius:50%;
    background:#eee9ff;
    box-shadow:0 0 30px rgba(230,220,255,.35);
}

.ay::after{
    content:"";
    position:absolute;
    width:60px;
    height:60px;
    left:-14px;
    top:-7px;
    border-radius:50%;
    background:#090817;
}

.zemin{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:45px;
    background:
        linear-gradient(180deg,#20134d,#100c25);
    border-top:2px solid rgba(150,100,255,.5);
}


/* =========================
   KARAKTER
========================= */

#oyuncu{
    position:absolute;
    left:65px;
    bottom:45px;
    width:42px;
    height:72px;
    z-index:4;

    --bacak-sol:12deg;
    --bacak-sag:-12deg;
    --kol-sol:25deg;
    --kol-sag:-25deg;

    transform:translate3d(0,0,0);
    transform-origin:center bottom;
    will-change:transform;
}

.oyuncu-kafa{
    position:absolute;
    top:0;
    left:10px;
    width:24px;
    height:24px;
    border-radius:50%;
    background:#eee;
    box-shadow:0 0 8px rgba(255,255,255,.15);
}

.oyuncu-govde{
    position:absolute;
    top:22px;
    left:14px;
    width:16px;
    height:28px;
    border-radius:8px;
    background:linear-gradient(#8d4dff,#5d36d9);
}

.oyuncu-kol{
    position:absolute;
    top:25px;
    width:23px;
    height:7px;
    border-radius:5px;
    background:#7041e7;
    transform-origin:top center;
    transition:transform .04s linear;
}

.oyuncu-kol.sol{
    left:-4px;
    transform:rotate(var(--kol-sol));
}

.oyuncu-kol.sag{
    right:-4px;
    transform:rotate(var(--kol-sag));
}

.oyuncu-bacak{
    position:absolute;
    top:48px;
    width:8px;
    height:24px;
    border-radius:5px;
    background:#5d36d9;
    transform-origin:top center;
    transition:transform .04s linear;
}

.oyuncu-bacak.sol{
    left:11px;
    transform:rotate(var(--bacak-sol));
}

.oyuncu-bacak.sag{
    right:11px;
    transform:rotate(var(--bacak-sag));
}

#oyuncu.havada .oyuncu-bacak.sol{
    transform:rotate(24deg);
}

#oyuncu.havada .oyuncu-bacak.sag{
    transform:rotate(-24deg);
}

#oyuncu.havada .oyuncu-kol.sol{
    transform:rotate(-18deg);
}

#oyuncu.havada .oyuncu-kol.sag{
    transform:rotate(18deg);
}


/* =========================
   KALKAN
========================= */

.kalkan::after{
    content:"";
    position:absolute;
    inset:-12px;
    border:3px solid #48e8ff;
    border-radius:50%;
    box-shadow:
        0 0 15px #48e8ff,
        inset 0 0 15px rgba(72,232,255,.35);
    pointer-events:none;
}


/* =========================
   ENGELLER
========================= */

.engel{
    position:absolute;
    bottom:45px;
    right:-65px;
    z-index:3;
    background:linear-gradient(135deg,#ff416c,#8b1e4d);
    box-shadow:0 0 18px rgba(255,50,100,.35);
    will-change:right;
}

.engel.kucuk{
    width:30px;
    height:42px;
    border-radius:8px 8px 3px 3px;
}

.engel.buyuk{
    width:43px;
    height:68px;
    border-radius:10px 10px 4px 4px;
}

.engel.yuvarlak{
    width:38px;
    height:38px;
    border-radius:50%;
}


/* =========================
   GÜÇ
========================= */

#guc{
    display:none;
    position:absolute;
    width:27px;
    height:27px;
    right:-35px;
    bottom:110px;
    border-radius:50%;
    z-index:4;
    background:#48e8ff;
    box-shadow:
        0 0 10px #48e8ff,
        0 0 25px rgba(72,232,255,.6);
    text-align:center;
    line-height:27px;
    font-size:15px;
    will-change:right;
}

.oyun-bilgi{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:12px 3px 8px;
    font-size:14px;
    color:#cfc7e8;
}

#skor{
    font-weight:bold;
    color:white;
}

#zorluk{
    color:#b48cff;
}

.ipucu{
    text-align:center;
    font-size:12px;
    color:#8e879f;
    margin-top:8px;
}


/* =========================
   GREAT
========================= */

#greatYazisi{
    position:absolute;
    left:50%;
    top:38%;
    transform:translate(-50%,-50%) scale(.5);
    opacity:0;
    z-index:20;
    color:#fff;
    font-size:40px;
    font-weight:900;
    text-shadow:
        0 0 8px #fff,
        0 0 20px #8c4dff,
        0 0 45px #6735ff;
    pointer-events:none;
}

.great-goster{
    animation:greatAnim .8s ease-out;
}

@keyframes greatAnim{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.5) rotate(-8deg);
    }

    25%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.2) rotate(3deg);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(1.5);
    }
}


/* =========================
   OYUN BİTİŞ
========================= */

#oyunMesaji{
    position:absolute;
    inset:0;
    z-index:30;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    text-align:center;
    background:rgba(3,2,10,.76);
    backdrop-filter:blur(6px);
}

#oyunMesaji h2{
    font-size:30px;
}

#sonSkor{
    color:#bca5ff;
}


/* =========================
   RARE EASTER EGG
========================= */

#rareScreen{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#000;
}

#rareScreen.aktif{
    display:flex;
}

#rareScreen::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 1px,
            transparent 1px,
            transparent 4px
        );
    pointer-events:none;
}

.rare-karakter{
    position:relative;
    width:150px;
    height:190px;
    opacity:0;
    transform:translateY(80px) scale(.7);
}

.rare-karakter.giris{
    animation:karakterGelir 1s ease forwards;
}

.rare-kafa{
    position:absolute;
    left:35px;
    top:15px;
    width:80px;
    height:80px;
    border:4px solid #fff;
    border-radius:50%;
    background:#080808;
    box-shadow:
        0 0 10px #fff,
        0 0 30px rgba(255,255,255,.5);
}

.rare-goz{
    position:absolute;
    top:27px;
    width:13px;
    height:20px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 12px #fff;
}

.rare-goz.sol{
    left:18px;
}

.rare-goz.sag{
    right:18px;
}

.rare-agiz{
    position:absolute;
    left:17px;
    bottom:14px;
    width:42px;
    height:18px;
    border-bottom:4px solid #fff;
    border-radius:50%;
}

.rare-govde{
    position:absolute;
    left:48px;
    top:92px;
    width:54px;
    height:65px;
    border:4px solid #fff;
    border-radius:20px 20px 8px 8px;
    background:#090909;
}

.rare-kol{
    position:absolute;
    top:100px;
    width:45px;
    height:8px;
    background:#fff;
    border-radius:8px;
}

.rare-kol.sol{
    left:10px;
    transform:rotate(35deg);
}

.rare-kol.sag{
    right:10px;
    transform:rotate(-35deg);
}

#rareYazi{
    position:absolute;
    left:50%;
    bottom:20%;
    transform:translateX(-50%);
    width:90%;
    text-align:center;
    color:#fff;
    font-size:30px;
    font-weight:900;
    letter-spacing:2px;
    text-shadow:
        0 0 8px #fff,
        0 0 20px #fff;
}

.rare-glitch{
    animation:gulus .12s infinite alternate;
}

@keyframes karakterGelir{
    0%{
        opacity:0;
        transform:translateY(80px) scale(.7);
    }

    60%{
        opacity:1;
    }

    100%{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes gulus{
    from{
        filter:none;
        transform:translateX(0);
    }

    to{
        filter:contrast(2);
        transform:translateX(3px);
    }
}

@keyframes ortamTitreme{
    0%{transform:translate(0)}
    25%{transform:translate(3px,-2px)}
    50%{transform:translate(-3px,2px)}
    75%{transform:translate(2px,3px)}
    100%{transform:translate(0)}
}

.rare-titreme{
    animation:ortamTitreme .08s infinite;
}


@media(max-width:480px){

    body{
        padding:12px;
    }

    .kutu{
        padding:15px;
        border-radius:22px;
    }

    #ekran{
        height:75px;
        font-size:29px;
    }

    .butonlar{
        gap:8px;
    }

    .butonlar button{
        min-height:58px;
    }

    .oyun-alani{
        height:300px;
    }

    #rareYazi{
        font-size:23px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HESAP MAKİNESİ
========================= -->

<div id="hesapPanel" class="panel aktif">

    <div class="kutu">

        <div class="panel-ust">
            <div class="panel-baslik">
                🧮 Hesap Makinesi
            </div>

            <button id="hesapKapat" class="kapat-btn">
                ✕ Kapat
            </button>
        </div>

        <input
            id="ekran"
            type="text"
            value="0"
            readonly
        >

        <div class="butonlar">

            <button
                class="temizle"
                onclick="temizle()"
            >
                C
            </button>

            <button onclick="sil()">
                ⌫
            </button>

            <button onclick="islemEkle('%')">
                %
            </button>

            <button
                class="islem"
                onclick="islemEkle('/')"
            >
                ÷
            </button>


            <button onclick="sayiEkle('7')">
                7
            </button>

            <button onclick="sayiEkle('8')">
                8
            </button>

            <button onclick="sayiEkle('9')">
                9
            </button>

            <button
                class="islem"
                onclick="islemEkle('*')"
            >
                ×
            </button>


            <button onclick="sayiEkle('4')">
                4
            </button>

            <button onclick="sayiEkle('5')">
                5
            </button>

            <button onclick="sayiEkle('6')">
                6
            </button>

            <button
                class="islem"
                onclick="islemEkle('-')"
            >
                −
            </button>


            <button onclick="sayiEkle('1')">
                1
            </button>

            <button onclick="sayiEkle('2')">
                2
            </button>

            <button onclick="sayiEkle('3')">
                3
            </button>

            <button
                class="islem"
                onclick="islemEkle('+')"
            >
                +
            </button>


            <button onclick="sayiEkle('0')">
                0
            </button>

            <button onclick="sayiEkle('.')">
                .
            </button>

            <button
                class="esittir"
                style="grid-column:span 2"
                onclick="hesapla()"
            >
                =
            </button>

        </div>
    </div>
</div>


<!-- =========================
     OYUN
========================= -->

<div id="oyunPanel" class="panel">

    <div class="kutu">

        <div class="panel-ust">

            <div class="panel-baslik">
                🏃 Kaç!
            </div>

            <button
                id="oyunKapat"
                class="kapat-btn"
            >
                ✕ Kapat
            </button>

        </div>

        <div class="game-panel">

            <div class="oyun-kontrol">

                <button id="baslatBtn">
                    ▶️ Başlat
                </button>

            </div>

            <div class="oyun-bilgi">

                <span>
                    Skor:
                    <b id="skor">0</b>
                </span>

                <span id="zorluk">
                    Kolay
                </span>

            </div>

            <div
                id="oyunAlani"
                class="oyun-alani"
            >

                <div class="ay"></div>


                <div id="oyuncu">

                    <div class="oyuncu-kafa"></div>

                    <div class="oyuncu-govde"></div>

                    <div class="oyuncu-kol sol"></div>

                    <div class="oyuncu-kol sag"></div>

                    <div class="oyuncu-bacak sol"></div>

                    <div class="oyuncu-bacak sag"></div>

                </div>


                <div id="guc">
                    ⚡
                </div>


                <div id="greatYazisi">
                    GREAT!
                </div>


                <div id="oyunMesaji">

                    <h2>
                        💀 Oyun Bitti
                    </h2>

                    <div id="sonSkor">
                        Skor: 0
                    </div>

                    <button id="tekrarOyna">
                        🔄 Tekrar Oyna
                    </button>

                </div>


                <div class="zemin"></div>

            </div>


            <div class="ipucu">
                Space / Dokun → Zıpla
            </div>

        </div>
    </div>
</div>


<!-- =========================
     RARE EASTER EGG
========================= -->

<div id="rareScreen">

    <div class="rare-karakter">

        <div class="rare-kafa">

            <div class="rare-goz sol"></div>

            <div class="rare-goz sag"></div>

            <div class="rare-agiz"></div>

        </div>

        <div class="rare-govde"></div>

        <div class="rare-kol sol"></div>

        <div class="rare-kol sag"></div>

    </div>

    <div id="rareYazi"></div>

</div>


<script>

/* =========================
   TEMEL ELEMENTLER
========================= */

const hesapPanel =
    document.getElementById("hesapPanel");

const oyunPanel =
    document.getElementById("oyunPanel");

const hesapKapat =
    document.getElementById("hesapKapat");

const oyunKapat =
    document.getElementById("oyunKapat");

const ekran =
    document.getElementById("ekran");

const baslatBtn =
    document.getElementById("baslatBtn");

const tekrarOyna =
    document.getElementById("tekrarOyna");

const oyunAlani =
    document.getElementById("oyunAlani");

const oyuncu =
    document.getElementById("oyuncu");

const skorYazi =
    document.getElementById("skor");

const sonSkor =
    document.getElementById("sonSkor");

const zorlukYazi =
    document.getElementById("zorluk");

const oyunMesaji =
    document.getElementById("oyunMesaji");

const greatYazisi =
    document.getElementById("greatYazisi");

const guc =
    document.getElementById("guc");


/* =========================
   URL MODU
========================= */

const urlParametreleri =
    new URLSearchParams(
        window.location.search
    );

const oyunModu =
    urlParametreleri.get("oyun") === "1";

if(oyunModu){

    hesapPanel.classList.remove("aktif");

    oyunPanel.classList.add("aktif");

}else{

    oyunPanel.classList.remove("aktif");

    hesapPanel.classList.add("aktif");
}


/* =========================
   HESAP MAKİNESİ
========================= */

function sayiEkle(sayi){

    if(
        ekran.value === "0" ||
        ekran.value === "Hata"
    ){

        ekran.value = sayi;

    }else{

        ekran.value += sayi;
    }
}


function islemEkle(islem){

    if(ekran.value === "Hata"){
        ekran.value = "0";
    }

    const son =
        ekran.value.slice(-1);

    if(
        ["+","-","*","/","%"].includes(son)
    ){

        ekran.value =
            ekran.value.slice(0,-1) +
            islem;

    }else{

        ekran.value += islem;
    }
}


function temizle(){

    ekran.value = "0";
}


function sil(){

    if(
        ekran.value.length <= 1 ||
        ekran.value === "Hata"
    ){

        ekran.value = "0";

        return;
    }

    ekran.value =
        ekran.value.slice(0,-1);
}


function hesapla(){

    try{

        let ifade =
            ekran.value.replace(
                /%/g,
                "/100"
            );

        const sonuc =
            Function(
                '"use strict"; return (' +
                ifade +
                ')'
            )();

        if(
            !Number.isFinite(sonuc)
        ){
            throw new Error();
        }

        ekran.value =
            Number.isInteger(sonuc)
            ? String(sonuc)
            : String(
                parseFloat(
                    sonuc.toFixed(10)
                )
            );

    }catch{

        ekran.value = "Hata";
    }
}


/* =========================
   OYUN DEĞİŞKENLERİ
========================= */

let oyunAktif = false;

let oyunBitti = false;

let oyunFrame = null;

let skor = 0;

let hiz = 5;

let sonZaman = 0;

let engelSayaci = 0;

let gucSayaci = 0;

let engeller = [];

let rareAktif = false;

let rareTimerlar = [];

let oncekiYuzluk = 0;


/* =========================
   GERÇEK FİZİK
========================= */

let oyuncuY = 0;

let oyuncuHizY = 0;

let yerde = true;

let sonZiplaZamani = 0;

let sonYerTemasi = 0;

let ziplamaKuyrugu = false;


/*
    Fizik değerleri.

    gravity:
    Karakterin düşüşünü belirler.

    jumpPower:
    İlk zıplama hızını belirler.
*/

const gravity = 0.78;

const jumpPower = 14.2;

const maxDusmeHizi = 18;


/* =========================
   RARE TIMER
========================= */

function rareTimerOlustur(fn,sure){

    const timer =
        setTimeout(fn,sure);

    rareTimerlar.push(timer);

    return timer;
}


function rareTimerlariniTemizle(){

    rareTimerlar.forEach(
        timer => clearTimeout(timer)
    );

    rareTimerlar = [];
}


/* =========================
   OYUNCU POZİSYONU
========================= */

function oyuncuPozisyonunuUygula(){

    oyuncu.style.transform =
        "translate3d(0," +
        (-oyuncuY) +
        "px,0)";
}


/* =========================
   KARAKTER ANİMASYONU
========================= */

function karakterAnimasyonu(zaman){

    if(!oyunAktif){
        return;
    }

    if(!yerde){

        oyuncu.classList.add(
            "havada"
        );

        return;
    }

    oyuncu.classList.remove(
        "havada"
    );

    /*
        Koşu animasyonu.

        Sinüs kullanıldığı için
        hareket yumuşak oluyor.
    */

    const kosu =
        Math.sin(
            zaman * 0.022
        );

    const kosu2 =
        Math.sin(
            zaman * 0.022 + Math.PI
        );

    oyuncu.style.setProperty(
        "--bacak-sol",
        (kosu * 28 + 8) + "deg"
    );

    oyuncu.style.setProperty(
        "--bacak-sag",
        (kosu2 * 28 - 8) + "deg"
    );

    oyuncu.style.setProperty(
        "--kol-sol",
        (kosu2 * 22 + 18) + "deg"
    );

    oyuncu.style.setProperty(
        "--kol-sag",
        (kosu * 22 - 18) + "deg"
    );
}


/* =========================
   ZIPLAMA
========================= */

function zipla(){

    if(
        !oyunAktif ||
        oyunBitti ||
        rareAktif
    ){
        return;
    }

    const simdi =
        performance.now();


    /*
        Çok kısa aralıkta gelen
        çift dokunmayı engeller.
    */

    if(
        simdi - sonZiplaZamani < 90
    ){
        return;
    }


    /*
        Yerde değilsek küçük bir
        jump-buffer bırakıyoruz.

        Böylece oyuncu yere değdiği
        anda basılmış tuşu kaçırmıyor.
    */

    if(!yerde){

        ziplamaKuyrugu = true;

        return;
    }


    sonZiplaZamani = simdi;

    yerde = false;

    oyuncuHizY =
        jumpPower;

    ziplamaKuyrugu = false;

    oyuncu.classList.add(
        "havada"
    );
}


function fizikGuncelle(dt){

    /*
        dt yaklaşık 1 olduğu zaman
        60 FPS davranışı verir.
    */

    oyuncuHizY -=
        gravity * dt;

    if(
        oyuncuHizY < -maxDusmeHizi
    ){

        oyuncuHizY =
            -maxDusmeHizi;
    }

    oyuncuY +=
        oyuncuHizY * dt;


    /*
        Zemin.
    */

    if(oyuncuY <= 0){

        oyuncuY = 0;

        oyuncuHizY = 0;

        if(!yerde){

            yerde = true;

            sonYerTemasi =
                performance.now();
        }

        oyuncu.classList.remove(
            "havada"
        );


        /*
            Jump buffer varsa
            yere iner inmez zıpla.
        */

        if(ziplamaKuyrugu){

            ziplamaKuyrugu = false;

            zipla();
        }
    }


    oyuncuPozisyonunuUygula();
}


/* =========================
   KONTROLLER
========================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.code === "Space"
        ){

            event.preventDefault();

            zipla();
        }
    }
);


oyunAlani.addEventListener(
    "pointerdown",
    event => {

        if(
            event.target.closest(
                "#oyunMesaji"
            )
        ){
            return;
        }

        event.preventDefault();

        zipla();
    },
    {
        passive:false
    }
);


/* =========================
   ENGEL OLUŞTUR
========================= */

function engelOlustur(){

    const engel =
        document.createElement("div");

    const rastgele =
        Math.random();

    let tip;

    if(rastgele < .30){

        tip = "yuvarlak";

    }else if(rastgele < .65){

        tip = "buyuk";

    }else{

        tip = "kucuk";
    }

    engel.className =
        "engel " + tip;

    engel.style.right =
        "-65px";

    oyunAlani.appendChild(
        engel
    );

    engeller.push({
        element:engel,
        right:-65
    });
}


/* =========================
   GÜÇ OLUŞTUR
========================= */

function gucOlustur(){

    if(
        guc.style.display === "block"
    ){
        return;
    }

    guc.style.display =
        "block";

    guc.style.right =
        "-35px";
}


function gucuTopla(){

    if(
        guc.style.display !== "block"
    ){
        return;
    }

    const oyuncuRect =
        oyuncu.getBoundingClientRect();

    const gucRect =
        guc.getBoundingClientRect();

    if(
        oyuncuRect.left < gucRect.right &&
        oyuncuRect.right > gucRect.left &&
        oyuncuRect.top < gucRect.bottom &&
        oyuncuRect.bottom > gucRect.top
    ){

        guc.style.display =
            "none";

        kalkanAktif = true;

        oyuncu.classList.add(
            "kalkan"
        );

        clearTimeout(
            gucKalkanTimer
        );

        gucKalkanTimer =
            setTimeout(()=>{

                kalkanAktif = false;

                oyuncu.classList.remove(
                    "kalkan"
                );

            },5000);
    }
}

let kalkanAktif = false;

let gucKalkanTimer = null;


/* =========================
   ÇARPIŞMA
========================= */

function carpismalar(){

    const oyuncuRect =
        oyuncu.getBoundingClientRect();

    /*
        Biraz daha adil collision.

        Karakterin etrafındaki
        görünmez kutuyu küçültüyoruz.
    */

    const oyuncuHitbox = {
        left: oyuncuRect.left + 7,
        right: oyuncuRect.right - 7,
        top: oyuncuRect.top + 5,
        bottom: oyuncuRect.bottom - 2
    };


    for(
        let i = engeller.length - 1;
        i >= 0;
        i--
    ){

        const veri =
            engeller[i];

        const engel =
            veri.element;

        const rect =
            engel.getBoundingClientRect();

        const temas =
            oyuncuHitbox.left < rect.right &&
            oyuncuHitbox.right > rect.left &&
            oyuncuHitbox.top < rect.bottom &&
            oyuncuHitbox.bottom > rect.top;


        if(temas){

            if(kalkanAktif){

                engel.remove();

                engeller.splice(
                    i,
                    1
                );

                kalkanAktif = false;

                oyuncu.classList.remove(
                    "kalkan"
                );

            }else{

                oyunBitir();

                return;
            }
        }
    }

    gucuTopla();
}


/* =========================
   GREAT
========================= */

function greatKontrol(){

    const yuzluk =
        Math.floor(
            skor / 100
        );

    if(
        yuzluk > 0 &&
        yuzluk > oncekiYuzluk
    ){

        oncekiYuzluk =
            yuzluk;

        greatYazisi.classList.remove(
            "great-goster"
        );

        void greatYazisi.offsetWidth;

        greatYazisi.classList.add(
            "great-goster"
        );
    }
}


/* =========================
   ZORLUK
========================= */

function zorlukGuncelle(){

    if(skor >= 1000){

        zorlukYazi.textContent =
            "🔥 Aşırı Zor";

    }else if(skor >= 700){

        zorlukYazi.textContent =
            "💀 Çok Zor";

    }else if(skor >= 400){

        zorlukYazi.textContent =
            "⚡ Zor";

    }else if(skor >= 200){

        zorlukYazi.textContent =
            "😈 Orta";

    }else{

        zorlukYazi.textContent =
            "Kolay";
    }


    hiz =
        5 +
        Math.min(
            skor / 100,
            8
        );
}


/* =========================
   RARE EASTER EGG
========================= */

/*
   %0.4 = 1 / 250
   Easter Egg ihtimali
*/
function rareKontrol(){

    if (
        Math.random() <
        (1 / 250)
    ) {
        oyunMesaji.style.display =
            "none";
        rareScreenBaslat();
    } else {
        oyunMesaji.style.display =
            "flex";
    }
}


function rareScreenBaslat(){

    rareAktif = true;

    cancelAnimationFrame(
        oyunFrame
    );

    const rareScreen =
        document.getElementById(
            "rareScreen"
        );

    const eskiKarakter =
        document.querySelector(
            ".rare-karakter"
        );

    const yeniKarakter =
        eskiKarakter.cloneNode(true);

    eskiKarakter.replaceWith(
        yeniKarakter
    );

    rareScreen.classList.add(
        "aktif"
    );

    document.body.classList.add(
        "rare-titreme"
    );

    const karakter =
        document.querySelector(
            ".rare-karakter"
        );

    const rareYazi =
        document.getElementById(
            "rareYazi"
        );

    rareYazi.textContent =
        "";

    karakter.classList.remove(
        "giris"
    );


    rareTimerOlustur(()=>{

        karakter.classList.add(
            "giris"
        );

    },100);


    rareTimerOlustur(()=>{

        document.body.classList.remove(
            "rare-titreme"
        );

    },450);


    rareTimerOlustur(()=>{

        rareYazi.textContent =
            "bu";

    },2000);


    rareTimerOlustur(()=>{

        rareYazi.textContent =
            "bu normal";

    },2500);


    rareTimerOlustur(()=>{

        rareYazi.textContent =
            "bu normal bir";

    },3000);


    rareTimerOlustur(()=>{

        rareYazi.textContent =
            "bu normal bir oyun";

    },3500);


    rareTimerOlustur(()=>{

        rareYazi.textContent =
            "bu normal bir oyun değil...";

    },4000);


    rareTimerOlustur(()=>{

        karakter.classList.add(
            "rare-glitch"
        );

    },4500);


    rareTimerOlustur(()=>{

        karakter.classList.remove(
            "rare-glitch"
        );

        document.body.classList.add(
            "rare-titreme"
        );

    },5200);


    rareTimerOlustur(()=>{

        document.body.classList.remove(
            "rare-titreme"
        );

        rareScreen.classList.remove(
            "aktif"
        );

        rareYazi.textContent =
            "";

        rareAktif = false;

        oyunMesaji.style.display =
            "flex";

        sonSkor.textContent =
            "Skor: " +
            Math.floor(skor);

    },6500);
}


/* =========================
   TEMİZLE
========================= */

function oyunDurumunuTemizle(){

    cancelAnimationFrame(
        oyunFrame
    );

    oyunFrame = null;

    oyunAktif = false;

    oyunBitti = false;

    skor = 0;

    hiz = 5;

    sonZaman = 0;

    engelSayaci = 0;

    gucSayaci = 0;

    oyuncuY = 0;

    oyuncuHizY = 0;

    yerde = true;

    ziplamaKuyrugu = false;

    kalkanAktif = false;

    clearTimeout(
        gucKalkanTimer
    );

    gucKalkanTimer = null;

    oyuncu.style.setProperty(
        "--bacak-sol",
        "12deg"
    );

    oyuncu.style.setProperty(
        "--bacak-sag",
        "-12deg"
    );

    oyuncu.style.setProperty(
        "--kol-sol",
        "25deg"
    );

    oyuncu.style.setProperty(
        "--kol-sag",
        "-25deg"
    );

    oyuncu.classList.remove(
        "havada"
    );

    oyuncu.classList.remove(
        "kalkan"
    );

    oyuncuPozisyonunuUygula();

    guc.style.display =
        "none";

    engeller.forEach(
        veri => {

            veri.element.remove();

        }
    );

    engeller = [];


    document
        .querySelectorAll(".engel")
        .forEach(
            el => el.remove()
        );


    oyunMesaji.style.display =
        "none";


    greatYazisi.classList.remove(
        "great-goster"
    );


    rareAktif = false;

    rareTimerlariniTemizle();


    document.body.classList.remove(
        "rare-titreme"
    );


    document
        .getElementById("rareScreen")
        .classList.remove(
            "aktif"
        );


    document
        .querySelectorAll(
            ".rare-karakter"
        )
        .forEach(
            karakter =>
                karakter.classList.remove(
                    "giris"
                )
        );


    document.getElementById(
        "rareYazi"
    ).textContent =
        "";


    skorYazi.textContent =
        "0";

    zorlukYazi.textContent =
        "Kolay";

    baslatBtn.textContent =
        "▶️ Başlat";
}


/*
    Kapatma butonu için
    eski isimle uyumlu fonksiyon.
*/

function oyunuDurdurVeTemizle(){

    oyunDurumunuTemizle();
}


/* =========================
   OYUN DÖNGÜSÜ
========================= */

function oyunDongusu(zaman){

    if(
        !oyunAktif ||
        oyunBitti ||
        rareAktif
    ){
        return;
    }


    if(!sonZaman){

        sonZaman =
            zaman;
    }


    /*
        Gerçek delta.

        60 FPS = yaklaşık 1

        Böylece cihaz 30 FPS
        veya 120 FPS olsa bile
        oyun hissi bozulmaz.
    */

    const deltaMs =
        zaman - sonZaman;

    sonZaman =
        zaman;


    const dt =
        Math.min(
            deltaMs / 16.6667,
            2
        );


    /*
        Skor.
    */

    skor +=
        deltaMs * .015;


    const tamSkor =
        Math.floor(skor);


    skorYazi.textContent =
        tamSkor;


    greatKontrol();

    zorlukGuncelle();


    /*
        FİZİK.
    */

    fizikGuncelle(dt);


    /*
        KARAKTER KOŞUSU.
    */

    karakterAnimasyonu(
        zaman
    );


    /*
        ENGEL ÜRETİMİ.
    */

    engelSayaci +=
        deltaMs;


    const engelAraligi =
        Math.max(
            650,
            1250 -
            tamSkor * 1.4
        );


    if(
        engelSayaci >=
        engelAraligi
    ){

        engelSayaci = 0;

        engelOlustur();
    }


    /*
        GÜÇ ÜRETİMİ.
    */

    gucSayaci +=
        deltaMs;


    if(
        gucSayaci > 7000
    ){

        gucSayaci = 0;

        if(
            Math.random() < .5
        ){

            gucOlustur();
        }
    }


    /*
        ENGELLERİ HAREKET ETTİR.
    */

    for(
        let i = engeller.length - 1;
        i >= 0;
        i--
    ){

        const veri =
            engeller[i];

        const engel =
            veri.element;


        /*
            Burada hiz'ı frame'e
            doğrudan eklemiyoruz.

            dt ile çarpıyoruz.
        */

        veri.right +=
            hiz * dt;


        engel.style.right =
            veri.right + "px";


        if(
            veri.right >
            oyunAlani.offsetWidth + 100
        ){

            engel.remove();

            engeller.splice(
                i,
                1
            );
        }
    }


    /*
        GÜÇ HAREKETİ.
    */

    if(
        guc.style.display === "block"
    ){

        let mevcut =
            parseFloat(
                getComputedStyle(
                    guc
                ).right
            );


        if(
            !Number.isFinite(mevcut)
        ){

            mevcut = -35;
        }


        mevcut +=
            hiz * dt;


        guc.style.right =
            mevcut + "px";


        if(
            mevcut >
            oyunAlani.offsetWidth + 50
        ){

            guc.style.display =
                "none";
        }
    }


    /*
        ÇARPIŞMA.
    */

    carpismalar();


    /*
        Sonraki frame.
    */

    oyunFrame =
        requestAnimationFrame(
            oyunDongusu
        );
}


/* =========================
   OYUNU BAŞLAT
========================= */

function oyunuBaslat(){

    oyunDurumunuTemizle();

    oyunAktif = true;

    oyunBitti = false;

    skor = 0;

    hiz = 5;

    oncekiYuzluk = 0;

    skorYazi.textContent =
        "0";

    zorlukYazi.textContent =
        "Kolay";

    oyunMesaji.style.display =
        "none";

    baslatBtn.textContent =
        "⏸️ Oynuyorsun";

    sonZaman = 0;

    oyunFrame =
        requestAnimationFrame(
            oyunDongusu
        );
}


/* =========================
   OYUN BİTİR
========================= */

function oyunBitir(){

    if(oyunBitti){
        return;
    }

    oyunBitti = true;

    oyunAktif = false;

    cancelAnimationFrame(
        oyunFrame
    );

    oyunFrame = null;

    baslatBtn.textContent =
        "▶️ Başlat";

    sonSkor.textContent =
        "Skor: " +
        Math.floor(skor);


    /*
       %0.4 = 1 / 250
       Easter Egg ihtimali
    */

    if (
        Math.random() <
        (1 / 250)
    ) {

        oyunMesaji.style.display =
            "none";

        rareScreenBaslat();

    } else {

        oyunMesaji.style.display =
            "flex";
    }
}
