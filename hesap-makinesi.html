<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>🏃 Kaç!</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#01020a;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    touch-action:none;
}

/* =========================================================
   ANA SAHNE
========================================================= */

#oyunAlani{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 50% 20%,
            rgba(0,225,255,.14),
            transparent 30%
        ),
        radial-gradient(
            ellipse at 10% 40%,
            rgba(112,0,255,.16),
            transparent 30%
        ),
        radial-gradient(
            ellipse at 90% 35%,
            rgba(255,0,166,.12),
            transparent 28%
        ),
        linear-gradient(
            180deg,
            #01030d 0%,
            #04091b 45%,
            #02040c 75%,
            #010208 100%
        );
}

/* =========================================================
   ARKA PLAN IŞIKLARI
========================================================= */

.arka-plan{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.isik{
    position:absolute;
    border-radius:50%;
    filter:blur(85px);
    pointer-events:none;
}

.isik1{
    width:430px;
    height:430px;
    left:-200px;
    top:5%;

    background:#00d9ff;
    opacity:.16;

    animation:
        isikHareket1 9s ease-in-out infinite alternate;
}

.isik2{
    width:400px;
    height:400px;
    right:-190px;
    top:15%;

    background:#7b00ff;
    opacity:.15;

    animation:
        isikHareket2 11s ease-in-out infinite alternate;
}

.isik3{
    width:350px;
    height:350px;
    left:35%;
    bottom:-250px;

    background:#ff008c;
    opacity:.13;

    animation:
        isikHareket3 10s ease-in-out infinite alternate;
}

.isik4{
    width:260px;
    height:260px;
    left:50%;
    top:8%;

    background:#008cff;
    opacity:.08;

    animation:
        isikHareket4 7s ease-in-out infinite alternate;
}

@keyframes isikHareket1{
    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(150px,90px);
    }
}

@keyframes isikHareket2{
    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-140px,80px);
    }
}

@keyframes isikHareket3{
    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(100px,-90px);
    }
}

@keyframes isikHareket4{
    from{
        transform:translate(-50px,0) scale(.8);
    }

    to{
        transform:translate(60px,80px) scale(1.15);
    }
}

/* =========================================================
   YILDIZLAR
========================================================= */

.yildiz{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 5px white,
        0 0 10px rgba(100,230,255,.7);

    opacity:.65;

    animation:
        yildizParla 2s ease-in-out infinite alternate;
}

@keyframes yildizParla{
    from{
        opacity:.2;
        transform:scale(.7);
    }

    to{
        opacity:.9;
        transform:scale(1.5);
    }
}

/* =========================================================
   HAREKETLİ PARÇACIKLAR
========================================================= */

.parcacik{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#5cefff;

    box-shadow:
        0 0 7px #00eaff,
        0 0 15px rgba(0,225,255,.6);

    opacity:.55;

    animation:
        parcacikYuksel 7s linear infinite;
}

@keyframes parcacikYuksel{
    from{
        transform:translateY(110vh);
        opacity:0;
    }

    15%{
        opacity:.7;
    }

    80%{
        opacity:.55;
    }

    to{
        transform:translateY(-20vh);
        opacity:0;
    }
}

/* =========================================================
   UZAK NEON BİNALAR
========================================================= */

.sehir{
    position:absolute;

    left:0;
    right:0;
    bottom:76px;

    height:190px;

    display:flex;
    align-items:flex-end;

    gap:5px;

    opacity:.68;

    pointer-events:none;
}

.bina{
    position:relative;

    flex:1;
    min-width:20px;

    background:
        linear-gradient(
            90deg,
            rgba(12,18,37,.98),
            rgba(4,8,20,.98)
        );

    border-top:
        1px solid rgba(0,225,255,.25);

    box-shadow:
        0 -4px 15px rgba(0,180,255,.04);
}

.bina:before{
    content:"";

    position:absolute;

    left:6px;
    right:6px;
    top:10px;
    bottom:8px;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(0,225,255,.2) 0 2px,
            transparent 2px 12px
        ),
        repeating-linear-gradient(
            to right,
            rgba(255,0,170,.12) 0 2px,
            transparent 2px 14px
        );

    opacity:.6;
}

.bina:after{
    content:"";

    position:absolute;

    left:20%;
    right:20%;

    top:0;

    height:2px;

    background:#00eaff;

    box-shadow:
        0 0 8px #00eaff,
        0 0 18px rgba(0,225,255,.5);

    opacity:.5;
}

.bina:nth-child(1){height:70px}
.bina:nth-child(2){height:115px}
.bina:nth-child(3){height:88px}
.bina:nth-child(4){height:145px}
.bina:nth-child(5){height:105px}
.bina:nth-child(6){height:170px}
.bina:nth-child(7){height:115px}
.bina:nth-child(8){height:140px}
.bina:nth-child(9){height:82px}
.bina:nth-child(10){height:158px}
.bina:nth-child(11){height:98px}
.bina:nth-child(12){height:130px}
.bina:nth-child(13){height:105px}
.bina:nth-child(14){height:150px}

/* =========================================================
   UZAK IŞIKLI KULELER
========================================================= */

.kule{
    position:absolute;

    bottom:76px;

    width:3px;

    background:
        linear-gradient(
            to top,
            rgba(0,225,255,.1),
            #00eaff
        );

    box-shadow:
        0 0 8px #00eaff;

    opacity:.45;
}

.kule1{
    left:19%;
    height:110px;
}

.kule2{
    left:73%;
    height:145px;
}

.kule3{
    left:86%;
    height:90px;
}

.kule:before{
    content:"";

    position:absolute;

    left:50%;
    top:-6px;

    width:7px;
    height:7px;

    transform:translateX(-50%);

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 8px #00eaff;
}

/* =========================================================
   HAVADA NEON ŞEKİLLER
========================================================= */

.sekil{
    position:absolute;

    width:30px;
    height:30px;

    border:
        1px solid rgba(0,225,255,.5);

    transform:rotate(45deg);

    box-shadow:
        0 0 12px rgba(0,225,255,.25),
        inset 0 0 12px rgba(0,225,255,.1);

    opacity:.35;

    pointer-events:none;
}

.sekil1{
    left:12%;
    top:24%;

    animation:
        sekilDon 8s linear infinite;
}

.sekil2{
    right:14%;
    top:27%;

    width:48px;
    height:48px;

    animation:
        sekilDon 11s linear infinite reverse;
}

.sekil3{
    left:69%;
    top:12%;

    width:18px;
    height:18px;

    animation:
        sekilDon 6s linear infinite;
}

.sekil4{
    left:42%;
    top:19%;

    width:22px;
    height:22px;

    animation:
        sekilDon 9s linear infinite reverse;
}

@keyframes sekilDon{
    to{
        transform:rotate(405deg);
    }
}

/* =========================================================
   NEON HAT ÇİZGİLERİ
========================================================= */

.neonHat{
    position:absolute;

    width:180px;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00eaff,
            transparent
        );

    box-shadow:
        0 0 8px #00eaff;

    opacity:.25;

    transform:rotate(-18deg);

    animation:
        hatKay 6s ease-in-out infinite alternate;
}

.neonHat1{
    top:30%;
    left:-30px;
}

.neonHat2{
    top:47%;
    right:-40px;

    animation-delay:2s;
}

@keyframes hatKay{
    from{
        transform:
            translateX(0)
            rotate(-18deg);
    }

    to{
        transform:
            translateX(80px)
            rotate(-18deg);
    }
}

/* =========================================================
   PERSPEKTİF GRID
========================================================= */

.cizgiler{
    position:absolute;

    left:-20%;

    width:140%;

    bottom:0;

    height:245px;

    perspective:350px;

    overflow:hidden;

    pointer-events:none;
}

.cizgiler:before{
    content:"";

    position:absolute;

    inset:-20%;

    background:
        linear-gradient(
            rgba(0,225,255,.19) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,225,255,.16) 1px,
            transparent 1px
        );

    background-size:
        55px 35px;

    transform:
        rotateX(65deg);

    transform-origin:center bottom;

    animation:
        gridAkis 2.2s linear infinite;
}

@keyframes gridAkis{
    from{
        background-position:
            0 0,
            0 0;
    }

    to{
        background-position:
            0 35px,
            55px 0;
    }
}

/* =========================================================
   ZEMİN
========================================================= */

.zemin{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:80px;

    background:
        linear-gradient(
            to bottom,
            rgba(0,225,255,.09),
            rgba(0,0,0,.9)
        );

    border-top:
        2px solid rgba(0,225,255,.45);

    box-shadow:
        0 -4px 25px rgba(0,225,255,.18);
}

/* =========================================================
   ÜST BİLGİ
========================================================= */

.ust{
    position:absolute;

    z-index:50;

    top:13px;
    left:50%;

    transform:
        translateX(-50%);

    width:min(94%,600px);

    text-align:center;

    pointer-events:none;
}

.baslik{
    margin:0;

    font-size:30px;
    font-weight:900;

    letter-spacing:2px;

    text-shadow:
        0 0 8px #00eaff,
        0 0 20px #00eaff,
        0 0 35px rgba(0,225,255,.4);
}

.yapimci{
    margin-top:3px;

    font-size:12px;

    color:#7beeff;

    opacity:.8;
}

.bilgi{
    display:flex;

    justify-content:center;

    gap:14px;

    margin-top:9px;
}

.bilgi span{
    padding:7px 13px;

    border:
        1px solid rgba(0,225,255,.25);

    border-radius:12px;

    background:
        rgba(0,10,25,.55);

    box-shadow:
        0 0 14px rgba(0,225,255,.08);

    font-size:14px;

    font-weight:bold;
}

/* =========================================================
   KARAKTER
========================================================= */

#oyuncu{
    position:absolute;

    z-index:30;

    left:85px;
    bottom:47px;

    width:66px;
    height:108px;

    transform-origin:center bottom;
}

.karakter{
    position:absolute;

    inset:0;

    transform-origin:center bottom;
}

/* KARAKTER AURASI */

.karakter:before{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:65px;
    height:85px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,
            rgba(0,225,255,.13),
            transparent 70%
        );

    filter:blur(5px);
}

/* KAFA */

.kafa{
    position:absolute;

    left:50%;
    top:3px;

    width:35px;
    height:35px;

    transform:
        translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 30% 22%,
            #fff 0 8%,
            #a7f8ff 18%,
            #25c7ff 45%,
            #0755d9 75%,
            #06154c 100%
        );

    border:
        2px solid #bafaff;

    box-shadow:
        0 0 8px #00eaff,
        0 0 22px rgba(0,225,255,.5);
}

.kafa:before{
    content:"";

    position:absolute;

    left:5px;
    right:5px;

    top:14px;

    height:8px;

    border-radius:8px;

    background:
        linear-gradient(
            90deg,
            #06142e,
            #c4fcff,
            #06142e
        );

    box-shadow:
        0 0 7px #00eaff;
}

.kafa:after{
    content:"";

    position:absolute;

    left:13px;
    top:8px;

    width:7px;
    height:4px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 8px white;
}

/* BOYUN */

.boyun{
    position:absolute;

    left:50%;
    top:31px;

    width:12px;
    height:9px;

    transform:
        translateX(-50%);

    background:#09266d;

    border-left:
        1px solid #58edff;

    border-right:
        1px solid #58edff;
}

/* GÖVDE */

.govde{
    position:absolute;

    left:50%;
    top:37px;

    width:36px;
    height:44px;

    transform:
        translateX(-50%);

    border-radius:
        13px 13px 9px 9px;

    background:
        linear-gradient(
            145deg,
            #5af2ff 0%,
            #087fff 45%,
            #1927b5 100%
        );

    border:
        1px solid #b6faff;

    box-shadow:
        0 0 8px #00eaff,
        0 0 22px rgba(0,225,255,.42),
        inset 3px 3px 8px rgba(255,255,255,.3),
        inset -5px -5px 10px rgba(0,0,100,.4);
}

.govde:before{
    content:"";

    position:absolute;

    left:7px;
    right:7px;

    top:8px;

    height:16px;

    border-radius:7px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.24),
            rgba(0,30,100,.2)
        );

    border:
        1px solid rgba(180,250,255,.55);
}

.govde:after{
    content:"";

    position:absolute;

    left:50%;
    top:13px;

    width:6px;
    height:6px;

    transform:
        translateX(-50%)
        rotate(45deg);

    background:#fff;

    box-shadow:
        0 0 7px #fff,
        0 0 13px #00eaff;
}

/* KOLLAR */

.kol{
    position:absolute;

    top:39px;

    width:11px;
    height:37px;

    border-radius:9px;

    background:
        linear-gradient(
            180deg,
            #42ebff,
            #0878ff 60%,
            #102d9f
        );

    border:
        1px solid rgba(175,250,255,.85);

    box-shadow:
        0 0 7px rgba(0,225,255,.5);

    transform-origin:top center;
}

.kol-sol{
    left:8px;

    transform:
        rotate(34deg);
}

.kol-sag{
    right:8px;

    transform:
        rotate(-34deg);
}

.kol:after{
    content:"";

    position:absolute;

    left:50%;
    bottom:-6px;

    width:10px;
    height:10px;

    transform:
        translateX(-50%);

    border-radius:50%;

    background:#a9f8ff;

    box-shadow:
        0 0 8px #00eaff;
}

/* BEL */

.bel{
    position:absolute;

    left:50%;
    top:77px;

    width:31px;
    height:8px;

    transform:
        translateX(-50%);

    border-radius:5px;

    background:#071d70;

    border:
        1px solid #45eaff;

    box-shadow:
        0 0 6px rgba(0,225,255,.5);
}

/* BACAK */

.bacak{
    position:absolute;

    top:80px;

    width:12px;
    height:29px;

    border-radius:8px;

    background:
        linear-gradient(
            180deg,
            #294dff,
            #09146e
        );

    border:
        1px solid rgba(110,235,255,.85);

    box-shadow:
        0 0 6px rgba(0,180,255,.45);

    transform-origin:top center;
}

.bacak-sol{
    left:16px;
}

.bacak-sag{
    right:16px;
}

.bacak:after{
    content:"";

    position:absolute;

    left:-5px;
    bottom:-4px;

    width:21px;
    height:8px;

    border-radius:
        8px 5px 5px 8px;

    background:#07134c;

    border:
        1px solid #55eaff;

    box-shadow:
        0 0 6px rgba(0,225,255,.5);
}

/* =========================================================
   KOŞU ANİMASYONU
========================================================= */

#oyuncu.kosuyor .kol-sol{
    animation:
        kolSol .25s ease-in-out infinite alternate;
}

#oyuncu.kosuyor .kol-sag{
    animation:
        kolSag .25s ease-in-out infinite alternate;
}

#oyuncu.kosuyor .bacak-sol{
    animation:
        bacakSol .25s ease-in-out infinite alternate;
}

#oyuncu.kosuyor .bacak-sag{
    animation:
        bacakSag .25s ease-in-out infinite alternate;
}

#oyuncu.kosuyor .govde{
    animation:
        govdeKos .25s ease-in-out infinite alternate;
}

#oyuncu.kosuyor .kafa{
    animation:
        kafaKos .25s ease-in-out infinite alternate;
}

#oyuncu.kosuyor .karakter{
    animation:
        karakterKos .25s ease-in-out infinite alternate;
}

@keyframes kolSol{
    from{
        transform:rotate(38deg);
    }

    to{
        transform:rotate(-48deg);
    }
}

@keyframes kolSag{
    from{
        transform:rotate(-38deg);
    }

    to{
        transform:rotate(48deg);
    }
}

@keyframes bacakSol{
    from{
        transform:rotate(38deg);
    }

    to{
        transform:rotate(-45deg);
    }
}

@keyframes bacakSag{
    from{
        transform:rotate(-38deg);
    }

    to{
        transform:rotate(45deg);
    }
}

@keyframes govdeKos{
    from{
        transform:
            translateX(-50%)
            rotate(-1deg);
    }

    to{
        transform:
            translateX(-50%)
            rotate(2deg);
    }
}

@keyframes kafaKos{
    from{
        transform:
            translateX(-50%)
            translateY(0);
    }

    to{
        transform:
            translateX(-50%)
            translateY(-2px);
    }
}

@keyframes karakterKos{
    from{
        transform:
            translateY(1px)
            scaleY(.99);
    }

    to{
        transform:
            translateY(-2px)
            scaleY(1.01);
    }
}

/* =========================================================
   ZIPLAMA
========================================================= */

#oyuncu.zipliyor .karakter{
    animation:none;

    transform:
        rotate(-5deg)
        scaleY(1.04);
}

#oyuncu.zipliyor .kol-sol{
    animation:none;

    transform:
        rotate(-60deg);
}

#oyuncu.zipliyor .kol-sag{
    animation:none;

    transform:
        rotate(60deg);
}

#oyuncu.zipliyor .bacak-sol{
    animation:none;

    transform:
        rotate(24deg);
}

#oyuncu.zipliyor .bacak-sag{
    animation:none;

    transform:
        rotate(-24deg);
}

/* =========================================================
   DÜŞÜŞ
========================================================= */

#oyuncu.dusuyor .karakter{
    animation:none;

    transform:
        rotate(7deg)
        scaleY(.96);
}

#oyuncu.dusuyor .kol-sol{
    animation:none;

    transform:
        rotate(-65deg);
}

#oyuncu.dusuyor .kol-sag{
    animation:none;

    transform:
        rotate(58deg);
}

/* =========================================================
   ENERJİ İZİ
========================================================= */

.enerji-izi{
    position:absolute;

    left:-28px;
    top:54px;

    width:34px;
    height:4px;

    border-radius:50%;

    background:#00eaff;

    box-shadow:
        0 0 7px #00eaff,
        0 0 16px #00eaff;

    opacity:.55;

    animation:
        enerjiIz .32s ease-out infinite;
}

@keyframes enerjiIz{
    from{
        transform:
            translateX(0)
            scaleX(.5);

        opacity:.5;
    }

    to{
        transform:
            translateX(-25px)
            scaleX(1.6);

        opacity:0;
    }
}

/* =========================================================
   KALKAN AKTİF
========================================================= */

#oyuncu.kalkan:before{
    content:"";

    position:absolute;

    z-index:-1;

    left:50%;
    top:50%;

    width:124px;
    height:124px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    border:
        3px solid #4ceeff;

    background:
        radial-gradient(
            circle,
            rgba(60,235,255,.18),
            rgba(0,150,255,.05) 58%,
            transparent 72%
        );

    box-shadow:
        0 0 12px #48e8ff,
        0 0 30px rgba(72,232,255,.75),
        0 0 60px rgba(0,180,255,.45),
        inset 0 0 22px rgba(72,232,255,.3);

    animation:
        kalkanDon 1.5s linear infinite;
}

#oyuncu.kalkan:after{
    content:"";

    position:absolute;

    z-index:-2;

    left:50%;
    top:50%;

    width:148px;
    height:148px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    border:
        1px solid rgba(150,245,255,.6);

    box-shadow:
        0 0 22px rgba(0,220,255,.45);

    animation:
        kalkanNefes 1s ease-in-out infinite alternate;
}

@keyframes kalkanDon{
    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}

@keyframes kalkanNefes{
    from{
        opacity:.35;

        transform:
            translate(-50%,-50%)
            scale(.92);
    }

    to{
        opacity:.9;

        transform:
            translate(-50%,-50%)
            scale(1.08);
    }
}

/* =========================================================
   YOLDAKİ KALKAN
========================================================= */

.kalkanGuc{
    position:absolute;

    z-index:20;

    width:45px;
    height:45px;

    right:-80px;
    bottom:82px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.95) 0 12%,
            rgba(100,245,255,.95) 22%,
            rgba(0,145,255,.8) 55%,
            rgba(0,60,255,.15) 72%,
            transparent 74%
        );

    border:
        2px solid rgba(150,250,255,.95);

    box-shadow:
        0 0 9px #00eaff,
        0 0 22px #00eaff,
        0 0 45px rgba(0,220,255,.8);

    animation:
        kalkanNefesYol .8s ease-in-out infinite alternate;
}

/*
   ŞİMŞEK YOK.
   Ortada kalkan şekli var.
*/

.kalkanGuc:before{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:20px;
    height:25px;

    transform:
        translate(-50%,-50%);

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #4deaff 45%,
            #007cff
        );

    clip-path:
        polygon(
            50% 0,
            90% 18%,
            84% 65%,
            50% 100%,
            16% 65%,
            10% 18%
        );

    filter:
        drop-shadow(
            0 0 6px #00eaff
        );
}

.kalkanGuc:after{
    content:"";

    position:absolute;

    inset:-9px;

    border:
        1px solid rgba(80,235,255,.65);

    border-radius:50%;

    animation:
        kalkanHalka 1.1s linear infinite;
}

@keyframes kalkanNefesYol{
    from{
        transform:scale(.92);
        filter:brightness(.9);
    }

    to{
        transform:scale(1.08);
        filter:brightness(1.35);
    }
}

@keyframes kalkanHalka{
    from{
        transform:scale(.8);
        opacity:.8;
    }

    to{
        transform:scale(1.4);
        opacity:0;
    }
}

/* =========================================================
   KALKAN ALMA EFEKTİ
========================================================= */

.almaEfekti{
    position:absolute;

    z-index:45;

    width:90px;
    height:90px;

    border-radius:50%;

    border:
        3px solid #55efff;

    box-shadow:
        0 0 20px #00eaff,
        0 0 45px #00eaff;

    pointer-events:none;

    animation:
        alma .55s ease-out forwards;
}

@keyframes alma{
    from{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.2);
    }

    to{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(2.2);
    }
}

/* =========================================================
   KAYALAR
========================================================= */

.engel{
    position:absolute;

    z-index:16;

    width:54px;
    height:45px;

    bottom:47px;
    right:-80px;

    background:
        linear-gradient(

        );

        );

.engel:after{

<script>

/* =========================================================
   ELEMANLAR
========================================================= */

const oyunAlani =
    document.getElementById("oyunAlani");

const oyuncu =
    document.getElementById("oyuncu");

const skorYazi =
    document.getElementById("skor");

const rekorYazi =
    document.getElementById("rekor");

const baslat =
    document.getElementById("baslat");

const ziplamaButonu =
    document.getElementById("ziplama");

const oyunSonu =
    document.getElementById("oyunSonu");

const sonSkor =
    document.getElementById("sonSkor");

const sonRekor =
    document.getElementById("sonRekor");

const tekrar =
    document.getElementById("tekrar");


/* =========================================================
   OYUN DEĞİŞKENLERİ
========================================================= */

let oyunAktif = false;

let skor = 0;

let tamSkor = 0;

let rekor =
    Number(
        localStorage.getItem("kacRekor")
    ) || 0;

rekorYazi.textContent =
    rekor;

let engeller = [];

let kalkanlar = [];

let sonZaman = 0;

let sonEngel = 0;

let sonKalkan = 0;

/*
   KALKAN ZAMANLAYICISI

   10-15 saniye.
   Skorla bağlantısı yok.
*/

let sonrakiKalkanZamani = 0;

/*
   KALKAN AKTİF Mİ?
*/

let kalkanAktif = false;


/*
   KALKAN KIRILDIĞINDA
   BU TIMER BAŞLAYACAK.
*/

let kalkanTimer = null;


/* FİZİK */

let oyuncuY = 0;

let oyuncuHizY = 0;

let yerde = true;

let ziplamaKuyrugu = false;


/* =========================================================
   FİZİK AYARLARI
========================================================= */

const gravityUp = .72;

const gravityDown = .92;

const jumpPower = 16.5;

const maxDusmeHizi = 18;


/* =========================================================
   OYUNU BAŞLAT
========================================================= */

function oyunuBaslat(){

    oyunAktif = true;

    skor = 0;

    tamSkor = 0;

    skorYazi.textContent =
        "0";


    oyuncuY = 0;

    oyuncuHizY = 0;

    yerde = true;

    ziplamaKuyrugu = false;


    /*
       Eski kayaları temizle
    */

    engeller.forEach(
        function(kaya){

            if(kaya.element){

                kaya.element.remove();

            }

        }
    );


    /*
       Eski kalkanları temizle
    */

    kalkanlar.forEach(
        function(guc){

            if(guc.element){

                guc.element.remove();

            }

        }
    );


    engeller = [];

    kalkanlar = [];


    /*
       KALKANI SIFIRLA
    */

    clearTimeout(
        kalkanTimer
    );

    kalkanAktif = false;

    oyuncu.classList.remove(
        "kalkan"
    );


    /*
       Karakter animasyonu
    */

    oyuncu.classList.remove(
        "zipliyor"
    );

    oyuncu.classList.remove(
        "dusuyor"
    );

    oyuncu.classList.add(
        "kosuyor"
    );


    /*
       Zaman
    */

    sonZaman =
        performance.now();

    sonEngel =
        performance.now();

    sonKalkan =
        performance.now();


    /*
       İLK KALKAN:
       10-15 SANİYE ARASI
    */

    sonrakiKalkanZamani =
        10000 +
        Math.random() * 5000;


    oyunSonu.classList.remove(
        "aktif"
    );

    baslat.style.display =
        "none";


    requestAnimationFrame(
        oyunDongusu
    );
}


/* =========================================================
   ZIPLA
========================================================= */

function zipla(){

    if(!oyunAktif){

        return;

    }


    if(yerde){

        oyuncuHizY =
            jumpPower;

        yerde = false;


        oyuncu.classList.remove(
            "kosuyor"
        );

        oyuncu.classList.add(
            "zipliyor"
        );

    }else{

        /*
           Havada basılırsa
           sonraki inişte tekrar zıplar.
        */

        ziplamaKuyrugu =
            true;

    }
}


/* =========================================================
   FİZİK
========================================================= */

function fizikGuncelle(dt){

    if(oyuncuHizY > 0){

        oyuncuHizY -=
            gravityUp * dt;

    }else{

        oyuncuHizY -=
            gravityDown * dt;

    }


    if(
        oyuncuHizY <
        -maxDusmeHizi
    ){

        oyuncuHizY =
            -maxDusmeHizi;

    }


    oyuncuY +=
        oyuncuHizY * dt;


    if(oyuncuY <= 0){

        oyuncuY = 0;

        oyuncuHizY = 0;


        if(!yerde){

            yerde = true;


            oyuncu.classList.remove(
                "zipliyor"
            );

            oyuncu.classList.remove(
                "dusuyor"
            );

            oyuncu.classList.add(
                "kosuyor"
            );


            if(ziplamaKuyrugu){

                ziplamaKuyrugu =
                    false;

                oyuncuHizY =
                    jumpPower;

                yerde = false;


                oyuncu.classList.remove(
                    "kosuyor"
                );

                oyuncu.classList.add(
                    "zipliyor"
                );

            }

        }

    }


    /*
       HAVADAKİ ANİMASYON
    */

    if(!yerde){

        if(oyuncuHizY < 0){

            oyuncu.classList.remove(
                "zipliyor"
            );

            oyuncu.classList.add(
                "dusuyor"
            );

        }else{

            oyuncu.classList.remove(
                "dusuyor"
            );

            oyuncu.classList.add(
                "zipliyor"
            );

        }

    }


    oyuncu.style.bottom =
        (47 + oyuncuY) + "px";

}


/* =========================================================
   SKOR
========================================================= */

function skorGuncelle(dt){

    tamSkor +=
        dt * .7;


    skor =
        Math.floor(
            tamSkor / 10
        );


    skorYazi.textContent =
        skor;


    if(skor > rekor){

        rekor = skor;

        rekorYazi.textContent =
            rekor;


        localStorage.setItem(
            "kacRekor",
            rekor
        );

    }

}


/* =========================================================
   KAYA OLUŞTUR
========================================================= */

function engelOlustur(){

    const son =
        engeller[
            engeller.length - 1
        ];


    if(
        son &&
        son.element &&
        son.right <
        oyunAlani.offsetWidth - 220
    ){

        return;

    }


    const el =
        document.createElement(
            "div"
        );


    el.className =
        "engel";


    oyunAlani.appendChild(
        el
    );


    const kaya = {

        element:el,

        right:
            oyunAlani.offsetWidth + 80

    };


    engeller.push(
        kaya
    );

}


/* =========================================================
   KALKAN OLUŞTUR
========================================================= */

function kalkanOlustur(){

    if(!oyunAktif){

        return;

    }


    /*
       Aynı anda birden fazla
       kalkan yolda olmasın.
    */

    if(kalkanlar.length > 0){

        return;

    }


    /*
       Oyuncunun zaten aktif
       kalkanı varsa yeni kalkan çıkarma.
    */

    if(kalkanAktif){

        return;

    }


    const el =
        document.createElement(
            "div"
        );


    el.className =
        "kalkanGuc";


    oyunAlani.appendChild(
        el
    );


    const guc = {

        element:el,

        right:
            oyunAlani.offsetWidth + 80

    };


    kalkanlar.push(
        guc
    );

}


/* =========================================================
   KAYALARI HAREKET ETTİR
========================================================= */

function engellerGuncelle(dt){

    const hiz =
        Math.min(
            8.2 +
            tamSkor / 750,
            13
        );


    for(
        let i =
        engeller.length - 1;

        i >= 0;

        i--
    ){

        const kaya =
            engeller[i];


        kaya.right -=
            hiz * dt;


        kaya.element.style.right =
            (-kaya.right) + "px";


        /*
           EKRANDAN ÇIKTI
        */

        if(
            kaya.right < -100
        ){

            kaya.element.remove();

            engeller.splice(
                i,
                1
            );

            continue;

        }


        /*
           KAYAYA ÇARPTI
        */

        if(
            carpismaVar(kaya)
        ){

            /*
               KALKAN VARSA:
               KAYA YOK OLUR
               KALKAN KIRILIR
            */

            if(kalkanAktif){

                kaya.element.classList.add(
                    "yok"
                );


                setTimeout(
                    function(){

                        if(
                            kaya.element
                        ){

                            kaya.element.remove();

                        }

                    },
                    280
                );


                engeller.splice(
                    i,
                    1
                );


                /*
                   ÇOK ÖNEMLİ:
                   KALKANIN SÜRESİ
                   BURADA BAŞLAMIYOR.

                   KALKAN TAM BURADA KIRILIYOR
                   VE YENİ KALKAN İÇİN
                   10-15 SANİYE SAYACI
                   BURADA BAŞLIYOR.
                */

                kalkanKirildi();

            }else{

                /*
                   KALKAN YOKSA
                   OYUN BİTER.
                */

                oyunuBitir();

                return;

            }

        }

    }

}


/* =========================================================
   KALKANLARI HAREKET ETTİR
========================================================= */

function kalkanlarGuncelle(dt){

    const hiz =
        Math.min(
            8.2 +
            tamSkor / 750,
            13
        );


    for(
        let i =
        kalkanlar.length - 1;

        i >= 0;

        i--
    ){

        const guc =
            kalkanlar[i];


        guc.right -=
            hiz * dt;


        guc.element.style.right =
            (-guc.right) + "px";


        /*
           KALKAN EKRANDAN ÇIKTI
        */

        if(
            guc.right < -100
        ){

            guc.element.remove();

            kalkanlar.splice(
                i,
                1
            );

            continue;

        }


        /*
           OYUNCU KALKANA ÇARPTI
        */

        if(
            gucToplandi(guc)
        ){

            /*
               KALKANI AL
            */

            kalkanAktifEt();


            /*
               ALMA EFEKTİ
            */

            almaEfektiOlustur();


            /*
               YOLDAKİ KALKANI SİL
            */

            guc.element.remove();

            kalkanlar.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   KAYA ÇARPIŞMASI
========================================================= */

function carpismaVar(kaya){

    const kayaRect =
        kaya.element.getBoundingClientRect();


    const oyuncuRect =
        oyuncu.getBoundingClientRect();


    /*
       Biraz yumuşatılmış hitbox
    */

    const kayaHit = {

        left:
            kayaRect.left + 7,

        right:
            kayaRect.right - 7,

        top:
            kayaRect.top + 6,

        bottom:
            kayaRect.bottom - 3

    };


    const karakterHit = {

        left:
            oyuncuRect.left + 9,

        right:
            oyuncuRect.right - 9,

        top:
            oyuncuRect.top + 7,

        bottom:
            oyuncuRect.bottom - 4

    };


    return (

        karakterHit.left <
        kayaHit.right &&

        karakterHit.right >
        kayaHit.left &&

        karakterHit.top <
        kayaHit.bottom &&

        karakterHit.bottom >
        kayaHit.top

    );

}


/* =========================================================
   KALKAN TOPLAMA
========================================================= */

function gucToplandi(guc){

    const gucRect =
        guc.element.getBoundingClientRect();


    const oyuncuRect =
        oyuncu.getBoundingClientRect();


    /*
       GERÇEK ÇARPIŞMA
    */

    return (

        oyuncuRect.left <
        gucRect.right &&

        oyuncuRect.right >
        gucRect.left &&

        oyuncuRect.top <
        gucRect.bottom &&

        oyuncuRect.bottom >
        gucRect.top

    );

}


/* =========================================================
   KALKAN AKTİF ET
========================================================= */

function kalkanAktifEt(){

    /*
       Kalkan süresi yok.
       Kırılana kadar aktif.
    */

    kalkanAktif = true;


    oyuncu.classList.add(
        "kalkan"
    );


    /*
       Eski timer varsa iptal.
    */

    clearTimeout(
        kalkanTimer
    );

}


/* =========================================================
   KALKAN KIRILDI
========================================================= */

function kalkanKirildi(){

    /*
       Kalkan artık aktif değil.
    */

    kalkanAktif = false;


    /*
       Görseli kaldır.
    */

    oyuncu.classList.remove(
        "kalkan"
    );


    /*
       TAM BU ANDA
       yeni kalkan için
       10-15 saniyelik süre başlar.
    */

    sonKalkan =
        performance.now();


    sonrakiKalkanZamani =
        10000 +
        Math.random() * 5000;


    /*
       Küçük kırılma efekti
    */

    kalkanKirilmAefekti();

}


/* =========================================================
   KALKAN KIRILMA EFEKTİ
========================================================= */

function kalkanKirilmAefekti(){

    const rect =
        oyuncu.getBoundingClientRect();


    const efekt =
        document.createElement(
            "div"
        );


    efekt.className =
        "almaEfekti";


    efekt.style.left =
        (
            rect.left +
            rect.width / 2
        ) + "px";


    efekt.style.top =
        (
            rect.top +
            rect.height / 2
        ) + "px";


    oyunAlani.appendChild(
        efekt
    );


    setTimeout(
        function(){

            efekt.remove();

        },
        600
    );

}


/* =========================================================
   KALKAN ALMA EFEKTİ
========================================================= */

function almaEfektiOlustur(){

    const rect =
        oyuncu.getBoundingClientRect();


    const efekt =
        document.createElement(
            "div"
        );


    efekt.className =
        "almaEfekti";


    efekt.style.left =
        (
            rect.left +
            rect.width / 2
        ) + "px";


    efekt.style.top =
        (
            rect.top +
            rect.height / 2
        ) + "px";


    oyunAlani.appendChild(
        efekt
    );


    setTimeout(
        function(){

            efekt.remove();

        },
        600
    );

}


/* =========================================================
   OYUN DÖNGÜSÜ
========================================================= */

function oyunDongusu(zaman){

    if(!oyunAktif){

        return;

    }


    let dt =
        (
            zaman -
            sonZaman
        ) / 16.67;


    if(dt > 2){

        dt = 2;

    }


    sonZaman =
        zaman;


    /*
       FİZİK
    */

    fizikGuncelle(dt);


    /*
       SKOR
    */

    skorGuncelle(dt);


    /*
       KAYALAR
    */

    engellerGuncelle(dt);


    if(!oyunAktif){

        return;

    }


    /*
       KALKANLAR
    */

    kalkanlarGuncelle(dt);


    /*
       KAYA ÇIKIŞI
    */

    const engelAralik =
        Math.max(
            900,
            1350 -
            tamSkor * 1.05
        );


    if(
        zaman -
        sonEngel >
        engelAralik
    ){

        engelOlustur();

        sonEngel =
            zaman;

    }


    /*
       =====================================================
       KALKAN ÇIKIŞI

       Burada skor kontrolü YOK.

       Kalkan aktifken yeni kalkan çıkmaz.

       Kalkan kırıldıktan sonra
       sonKalkan zamanı güncellenir.

       Böylece kırıldığı andan itibaren
       10-15 saniye beklenir.
       =====================================================
    */

    if(
        !kalkanAktif &&
        zaman -
        sonKalkan >=
        sonrakiKalkanZamani
    ){

        kalkanOlustur();


        /*
           Yeni kalkan yola çıktıktan sonra
           tekrar hemen çıkmasın.

           Bir sonraki sayım,
           kalkan toplandıktan sonra
           kırılma anında yeniden kurulacak.
        */

        sonKalkan =
            zaman;

        /*
           Burada yeni süre vermiyoruz.
           Kalkan kaçarsa bir daha sonsuza
           kadar beklemesin diye 10-15 saniyelik
           yeni deneme süresi başlatıyoruz.
        */

        sonrakiKalkanZamani =
            10000 +
            Math.random() * 5000;

    }


    requestAnimationFrame(
        oyunDongusu
    );

}


/* =========================================================
   OYUN BİTİR
========================================================= */

function oyunuBitir(){

    if(!oyunAktif){

        return;

    }


    oyunAktif = false;


    oyuncu.classList.remove(
        "kosuyor"
    );

    oyuncu.classList.remove(
        "zipliyor"
    );

    oyuncu.classList.remove(
        "dusuyor"
    );

    oyuncu.classList.remove(
        "kalkan"
    );


    kalkanAktif = false;


    clearTimeout(
        kalkanTimer
    );


    sonSkor.textContent =
        skor;


    sonRekor.textContent =
        rekor;


    oyunSonu.classList.add(
        "aktif"
    );

}


/* =========================================================
   YENİDEN OYNA
========================================================= */

function yenidenBaslat(){

    oyunSonu.classList.remove(
        "aktif"
    );


    oyunuBaslat();

}


/* =========================================================
   BUTONLAR
========================================================= */

baslat.addEventListener(
    "click",
    oyunuBaslat
);


tekrar.addEventListener(
    "click",
    yenidenBaslat
);


ziplamaButonu.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        zipla();

    }
);


/* =========================================================
   KLAVYE
========================================================= */

window.addEventListener(
    "keydown",
    function(e){

        /*
           SADECE ZIPLAMA
        */

        if(
            e.code === "Space" ||
            e.code === "ArrowUp" ||
            e.code === "KeyW"
        ){

            e.preventDefault();

            zipla();

        }


        /*
           ENTER = BAŞLAT
        */

        if(
            e.code === "Enter" &&
            !oyunAktif
        ){

            if(
                !oyunSonu.classList.contains(
                    "aktif"
                )
            ){

                oyunuBaslat();

            }

        }

    }
);
