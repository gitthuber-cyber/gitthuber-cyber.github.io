<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏃 Kaç!</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#03040c;
    color:white;
}

body{
    touch-action:none;
}

/* ANA SAHNE */

#oyunAlani{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 35%,rgba(0,180,255,.13),transparent 35%),
        radial-gradient(circle at 20% 20%,rgba(170,0,255,.12),transparent 30%),
        linear-gradient(#03040c,#070b18 55%,#02030a);
}

/* NEON IŞIKLAR */

.arka-plan{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.isik{
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;
    filter:blur(90px);
    opacity:.18;
}

.isik1{
    background:#00d9ff;
    left:-180px;
    top:5%;
    animation:isikHareket1 8s ease-in-out infinite alternate;
}

.isik2{
    background:#8b00ff;
    right:-180px;
    top:15%;
    animation:isikHareket2 10s ease-in-out infinite alternate;
}

.isik3{
    background:#ff008c;
    left:30%;
    bottom:-260px;
    animation:isikHareket3 9s ease-in-out infinite alternate;
}

@keyframes isikHareket1{
    from{transform:translate(0,0)}
    to{transform:translate(120px,80px)}
}

@keyframes isikHareket2{
    from{transform:translate(0,0)}
    to{transform:translate(-130px,70px)}
}

@keyframes isikHareket3{
    from{transform:translate(0,0)}
    to{transform:translate(80px,-90px)}
}

/* PARÇACIKLAR */

.parcacik{
    position:absolute;
    width:3px;
    height:3px;
    background:#55eaff;
    border-radius:50%;
    box-shadow:0 0 8px #55eaff;
    animation:yukariParcacik linear infinite;
    opacity:.7;
}

@keyframes yukariParcacik{
    from{
        transform:translateY(110vh);
        opacity:0;
    }
    20%{opacity:.8}
    80%{opacity:.7}
    to{
        transform:translateY(-20vh);
        opacity:0;
    }
}

/* ŞEHİR */

.sehir{
    position:absolute;
    left:0;
    right:0;
    bottom:76px;
    height:150px;
    display:flex;
    align-items:flex-end;
    gap:7px;
    opacity:.65;
    pointer-events:none;
}

.bina{
    flex:1;
    min-width:20px;
    background:
        linear-gradient(
            90deg,
            rgba(20,25,45,.9),
            rgba(8,12,25,.95)
        );
    border-top:1px solid rgba(0,225,255,.18);
    box-shadow:0 -3px 12px rgba(0,180,255,.06);
    position:relative;
}

.bina:before{
    content:"";
    position:absolute;
    inset:10px 5px;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(0,225,255,.22) 0 3px,
            transparent 3px 13px
        ),
        repeating-linear-gradient(
            to right,
            rgba(255,0,200,.13) 0 3px,
            transparent 3px 14px
        );
    opacity:.5;
}

.bina:nth-child(1){height:65px}
.bina:nth-child(2){height:110px}
.bina:nth-child(3){height:80px}
.bina:nth-child(4){height:135px}
.bina:nth-child(5){height:95px}
.bina:nth-child(6){height:150px}
.bina:nth-child(7){height:105px}
.bina:nth-child(8){height:125px}
.bina:nth-child(9){height:75px}
.bina:nth-child(10){height:145px}
.bina:nth-child(11){height:90px}
.bina:nth-child(12){height:118px}

/* GEOMETRİK ŞEKİLLER */

.sekil{
    position:absolute;
    width:28px;
    height:28px;
    border:1px solid rgba(0,225,255,.5);
    transform:rotate(45deg);
    box-shadow:
        0 0 10px rgba(0,225,255,.3),
        inset 0 0 10px rgba(0,225,255,.12);
    opacity:.35;
    pointer-events:none;
}

.sekil1{
    left:12%;
    top:25%;
    animation:sekilDon 7s linear infinite;
}

.sekil2{
    right:15%;
    top:30%;
    width:45px;
    height:45px;
    animation:sekilDon 10s linear infinite reverse;
}

.sekil3{
    left:70%;
    top:12%;
    width:18px;
    height:18px;
    animation:sekilDon 6s linear infinite;
}

.sekil4{
    left:40%;
    top:20%;
    width:22px;
    height:22px;
    animation:sekilDon 8s linear infinite reverse;
}

@keyframes sekilDon{
    to{
        transform:rotate(405deg);
    }
}

/* GRID */

.cizgiler{
    position:absolute;
    left:-20%;
    width:140%;
    bottom:0;
    height:230px;
    perspective:350px;
    overflow:hidden;
    pointer-events:none;
}

.cizgiler:before{
    content:"";
    position:absolute;
    inset:-20%;
    background:
        linear-gradient(
            rgba(0,225,255,.18) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,225,255,.18) 1px,
            transparent 1px
        );
    background-size:55px 35px;
    transform:rotateX(65deg);
    transform-origin:center bottom;
    animation:gridAkis 2.2s linear infinite;
}

@keyframes gridAkis{
    from{
        background-position:0 0,0 0;
    }
    to{
        background-position:0 35px,55px 0;
    }
}

/* ZEMİN */

.zemin{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:80px;
    background:
        linear-gradient(
            to bottom,
            rgba(0,225,255,.08),
            rgba(0,0,0,.8)
        );
    border-top:2px solid rgba(0,225,255,.4);
    box-shadow:
        0 -4px 20px rgba(0,225,255,.15);
}

/* ÜST BİLGİ */

.ust{
    position:absolute;
    z-index:50;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    width:min(94%,600px);
    text-align:center;
    pointer-events:none;
}

.baslik{
    margin:0;
    font-size:30px;
    font-weight:900;
    letter-spacing:2px;
    text-shadow:
        0 0 8px #00eaff,
        0 0 22px rgba(0,225,255,.5);
}

.yapimci{
    margin-top:4px;
    font-size:12px;
    color:#73eaff;
    opacity:.8;
}

.bilgi{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-top:10px;
    font-size:15px;
    font-weight:bold;
}

.bilgi span{
    padding:7px 13px;
    border:1px solid rgba(0,225,255,.25);
    border-radius:12px;
    background:rgba(0,10,25,.5);
    box-shadow:0 0 12px rgba(0,225,255,.08);
}

/* OYUNCU */

#oyuncu{
    position:absolute;
    z-index:20;
    left:105px;
    bottom:47px;
    width:54px;
    height:92px;
    transform-origin:center bottom;
}

/* KARAKTER GÖVDESİ */

.karakter{
    position:absolute;
    left:50%;
    bottom:0;
    width:100%;
    height:100%;
    transform:translateX(-50%);
}

/* GÖVDE */

.govde{
    position:absolute;
    left:50%;
    top:34px;
    width:30px;
    height:39px;
    transform:translateX(-50%);
    border-radius:12px 12px 8px 8px;
    background:
        linear-gradient(
            135deg,
            #28eaff,
            #0086ff 55%,
            #244cff
        );
    border:1px solid rgba(160,250,255,.9);
    box-shadow:
        0 0 7px #00eaff,
        0 0 20px rgba(0,225,255,.45),
        inset 0 0 10px rgba(255,255,255,.3);
}

/* GÖVDE LOGOSU */

.govde:after{
    content:"";
    position:absolute;
    left:50%;
    top:12px;
    width:9px;
    height:9px;
    transform:translateX(-50%) rotate(45deg);
    border:2px solid white;
    box-shadow:0 0 8px white;
}

/* KAFA */

.kafa{
    position:absolute;
    left:50%;
    top:5px;
    width:31px;
    height:31px;
    transform:translateX(-50%);
    border-radius:50%;
    background:
        radial-gradient(
            circle at 35% 30%,
            #e8fbff,
            #5eeaff 30%,
            #078cff 72%,
            #0738a7
        );
    border:2px solid #b7f8ff;
    box-shadow:
        0 0 8px #00eaff,
        0 0 20px rgba(0,225,255,.5);
}

/* SİPERLİK */

.kafa:after{
    content:"";
    position:absolute;
    left:5px;
    right:5px;
    bottom:6px;
    height:8px;
    border-radius:10px;
    background:rgba(0,10,30,.75);
    border:1px solid rgba(150,245,255,.8);
    box-shadow:0 0 5px #00eaff;
}

/* KOLLAR */

.kol{
    position:absolute;
    top:38px;
    width:10px;
    height:32px;
    border-radius:8px;
    background:linear-gradient(#22eaff,#006cff);
    border:1px solid rgba(150,245,255,.8);
    box-shadow:0 0 7px rgba(0,225,255,.6);
    transform-origin:top center;
}

.kol-sol{
    left:7px;
    transform:rotate(28deg);
}

.kol-sag{
    right:7px;
    transform:rotate(-28deg);
}

/* ELLER */

.kol:after{
    content:"";
    position:absolute;
    bottom:-5px;
    left:50%;
    width:9px;
    height:9px;
    transform:translateX(-50%);
    border-radius:50%;
    background:#a8f7ff;
    box-shadow:0 0 8px #00eaff;
}

/* BACAKLAR */

.bacak{
    position:absolute;
    top:68px;
    width:11px;
    height:28px;
    border-radius:7px;
    background:
        linear-gradient(
            to bottom,
            #263dff,
            #08166f
        );
    border:1px solid rgba(100,230,255,.8);
    box-shadow:0 0 6px rgba(0,180,255,.5);
    transform-origin:top center;
}

.bacak-sol{
    left:13px;
}

.bacak-sag{
    right:13px;
}

/* AYAK */

.bacak:after{
    content:"";
    position:absolute;
    bottom:-4px;
    left:-5px;
    width:20px;
    height:8px;
    border-radius:8px 5px 5px 8px;
    background:#0a174f;
    border:1px solid #50eaff;
    box-shadow:0 0 6px rgba(0,225,255,.5);
}

/* KOŞU ANİMASYONU */

#oyuncu.kosuyor .kol-sol{
    animation:kolSol .28s ease-in-out infinite alternate;
}

#oyuncu.kosuyor .kol-sag{
    animation:kolSag .28s ease-in-out infinite alternate;
}

#oyuncu.kosuyor .bacak-sol{
    animation:bacakSol .28s ease-in-out infinite alternate;
}

#oyuncu.kosuyor .bacak-sag{
    animation:bacakSag .28s ease-in-out infinite alternate;
}

#oyuncu.kosuyor .govde{
    animation:govdeKos  .28s ease-in-out infinite alternate;
}

#oyuncu.kosuyor .kafa{
    animation:kafaKos .28s ease-in-out infinite alternate;
}

@keyframes kolSol{
    from{transform:rotate(35deg)}
    to{transform:rotate(-38deg)}
}

@keyframes kolSag{
    from{transform:rotate(-35deg)}
    to{transform:rotate(38deg)}
}

@keyframes bacakSol{
    from{transform:rotate(30deg)}
    to{transform:rotate(-38deg)}
}

@keyframes bacakSag{
    from{transform:rotate(-30deg)}
    to{transform:rotate(38deg)}
}

@keyframes govdeKos{
    from{transform:translateX(-50%) translateY(0)}
    to{transform:translateX(-50%) translateY(-3px)}
}

@keyframes kafaKos{
    from{transform:translateX(-50%) translateY(0)}
    to{transform:translateX(-50%) translateY(-2px)}
}

/* ZIPLAMA */

#oyuncu.zipliyor .karakter{
    transform:rotate(-3deg) scaleY(1.04);
}

#oyuncu.zipliyor .bacak{
    animation:none;
    transform:rotate(20deg);
}

#oyuncu.zipliyor .kol-sol{
    transform:rotate(-55deg);
}

#oyuncu.zipliyor .kol-sag{
    transform:rotate(55deg);
}

/* DÜŞÜŞ */

#oyuncu.dusuyor .karakter{
    transform:rotate(8deg) scaleY(.97);
}

#oyuncu.dusuyor .kol-sol{
    transform:rotate(-65deg);
}

#oyuncu.dusuyor .kol-sag{
    transform:rotate(55deg);
}

/* ENERJİ İZİ */

.enerji-izi{
    position:absolute;
    left:-25px;
    top:43px;
    width:30px;
    height:4px;
    border-radius:50%;
    background:#00eaff;
    box-shadow:
        0 0 7px #00eaff,
        0 0 15px #00eaff;
    opacity:.55;
    animation:izKay  .35s ease-out infinite;
}

@keyframes izKay{
    from{
        transform:scaleX(.5);
        opacity:.2;
    }
    to{
        transform:translateX(-22px) scaleX(1.5);
        opacity:0;
    }
}

/* KALKAN */

#oyuncu.kalkan::before{
    content:"";
    position:absolute;
    z-index:-1;
    left:50%;
    top:50%;
    width:115px;
    height:115px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:3px solid #45efff;
    background:
        radial-gradient(
            circle,
            rgba(50,235,255,.16),
            rgba(0,160,255,.06) 55%,
            transparent 72%
        );
    box-shadow:
        0 0 12px #48e8ff,
        0 0 28px rgba(72,232,255,.8),
        0 0 55px rgba(0,180,255,.45),
        inset 0 0 25px rgba(72,232,255,.3);
    animation:kalkanDon 1.5s linear infinite;
}

#oyuncu.kalkan::after{
    content:"";
    position:absolute;
    z-index:-2;
    left:50%;
    top:50%;
    width:138px;
    height:138px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:1px solid rgba(150,245,255,.6);
    box-shadow:0 0 20px rgba(0,220,255,.45);
    animation:kalkanNefes 1s ease-in-out infinite alternate;
}

@keyframes kalkanDon{
    to{
        transform:translate(-50%,-50%) rotate(360deg);
    }
}

@keyframes kalkanNefes{
    from{
        opacity:.35;
        transform:translate(-50%,-50%) scale(.92);
    }
    to{
        opacity:.9;
        transform:translate(-50%,-50%) scale(1.08);
    }
}

/* KALKAN ALMA EFEKTİ */

.almaEfekti{
    position:absolute;
    z-index:35;
    width:90px;
    height:90px;
    border-radius:50%;
    border:3px solid #55efff;
    box-shadow:
        0 0 20px #00eaff,
        0 0 45px #00eaff;
    pointer-events:none;
    animation:alma  .55s ease-out forwards;
}

@keyframes alma{
    from{
        opacity:1;
        transform:translate(-50%,-50%) scale(.2);
    }
    to{
        opacity:0;
        transform:translate(-50%,-50%) scale(2.2);
    }
}

/* ENGELLER */

.engel{
    position:absolute;
    z-index:15;
    width:54px;
    height:44px;
    bottom:47px;
    right:-80px;
    background:
        linear-gradient(
            145deg,
            #292f42,
            #090c16
        );
    clip-path:polygon(
        8% 85%,
        0 45%,
        18% 15%,
        45% 0,
        77% 10%,
        100% 50%,
        88% 87%,
        53% 100%
    );
    border:1px solid rgba(120,150,190,.5);
    box-shadow:
        0 0 8px rgba(80,110,160,.35),
        inset 0 0 12px rgba(255,255,255,.04);
}

.engel:after{
    content:"";
    position:absolute;
    inset:7px;
    background:
        linear-gradient(
            140deg,
            rgba(100,120,150,.3),
            transparent 60%
        );
    clip-path:inherit;
}

.engel.yok{
    animation:kayaPatla .28s ease-out forwards;
}

@keyframes kayaPatla{
    to{
        opacity:0;
        transform:scale(1.7) rotate(25deg);
        filter:blur(3px);
    }
}

/* KALKAN GÜÇLENDİRMESİ */

.kalkanGuc{
    position:absolute;
    z-index:17;
    width:40px;
    height:40px;
    right:-70px;
    bottom:82px;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            #eaffff 0 12%,
            #55edff 30%,
            #008cff 65%,
            transparent 70%
        );
    box-shadow:
        0 0 8px #00eaff,
        0 0 20px #00eaff,
        0 0 45px rgba(0,220,255,.8);
    animation:
        gucDon 1s linear infinite,
        gucNefes .7s ease-in-out infinite alternate;
}

.kalkanGuc:before{
    content:"⚡";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-53%);
    font-size:22px;
    color:white;
    text-shadow:
        0 0 5px #fff,
        0 0 12px #00eaff;
}

.kalkanGuc:after{
    content:"";
    position:absolute;
    inset:-8px;
    border:1px solid rgba(80,235,255,.6);
    border-radius:50%;
    animation:gucHalka 1.2s linear infinite;
}

@keyframes gucDon{
    to{
        transform:rotate(360deg);
    }
}

@keyframes gucNefes{
    from{filter:brightness(.9)}
    to{filter:brightness(1.4)}
}

@keyframes gucHalka{
    from{
        transform:scale(.8);
        opacity:.8;
    }
    to{
        transform:scale(1.4);
        opacity:0;
    }
}

/* OYUN BAŞLAT */

.baslat{
    position:absolute;
    z-index:60;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    padding:15px 30px;
    border:1px solid #00eaff;
    border-radius:15px;
    color:white;
    background:
        linear-gradient(
            135deg,
            rgba(0,200,255,.18),
            rgba(100,0,255,.15)
        );
    box-shadow:
        0 0 15px rgba(0,225,255,.4),
        inset 0 0 15px rgba(0,225,255,.08);
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.baslat:hover{
    box-shadow:
        0 0 25px rgba(0,225,255,.7),
        inset 0 0 20px rgba(0,225,255,.15);
}

/* OYUN BİTTİ */

.oyunSonu{
    position:absolute;
    z-index:100;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,10,.72);
    backdrop-filter:blur(7px);
}

.oyunSonu.aktif{
    display:flex;
}

.sonKutu{
    width:min(88%,360px);
    padding:28px;
    text-align:center;
    border:1px solid rgba(0,225,255,.45);
    border-radius:22px;
    background:
        linear-gradient(
            145deg,
            rgba(5,20,45,.9),
            rgba(15,5,35,.9)
        );
    box-shadow:
        0 0 35px rgba(0,225,255,.25);
}

.sonKutu h2{
    margin:0 0 10px;
    font-size:30px;
}

.sonKutu p{
    margin:7px 0;
}

.tekrar{
    margin-top:20px;
    padding:13px 25px;
    border:1px solid #00eaff;
    border-radius:12px;
    background:rgba(0,225,255,.1);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* MOBİL KONTROLLER */

.kontroller{
    position:absolute;
    z-index:80;
    left:0;
    right:0;
    bottom:12px;
    display:flex;
    justify-content:space-between;
    padding:0 15px;
    pointer-events:none;
}

.kontrolGrup{
    display:flex;
    gap:10px;
}

.kontrol{
    width:65px;
    height:58px;
    border-radius:17px;
    border:1px solid rgba(0,225,255,.45);
    background:rgba(0,10,25,.55);
    color:white;
    font-size:24px;
    box-shadow:
        0 0 12px rgba(0,225,255,.15),
        inset 0 0 12px rgba(0,225,255,.05);
    pointer-events:auto;
    user-select:none;
}

.kontrol:active{
    transform:scale(.92);
    background:rgba(0,225,255,.2);
}

.kontrol.ziplama{
    width:90px;
    font-size:17px;
}

/* GERİ */

.geri{
    position:absolute;
    z-index:70;
    left:15px;
    top:15px;
    padding:8px 12px;
    color:#9cefff;
    text-decoration:none;
    font-size:13px;
    border:1px solid rgba(0,225,255,.2);
    border-radius:10px;
    background:rgba(0,10,25,.4);
}

/* RESPONSIVE */

@media(max-width:600px){
    .baslik{
        font-size:25px;
    }

    .bilgi{
        gap:7px;
        font-size:12px;
    }

    .bilgi span{
        padding:6px 9px;
    }

    #oyuncu{
        left:75px;
    }

    .engel{
        width:48px;
        height:40px;
    }

    .kalkanGuc{
        width:36px;
        height:36px;
    }

    .kontrol{
        width:58px;
        height:54px;
    }

    .kontrol.ziplama{
        width:84px;
    }
}
</style>
</head>

<body>

<div id="oyunAlani">

    <!-- NEON ARKA PLAN -->
    <div class="arka-plan">
        <div class="isik isik1"></div>
        <div class="isik isik2"></div>
        <div class="isik isik3"></div>

    <!-- PARÇACIKLAR -->
    <div class="parcacik" style="left:5%;animation-duration:6s"></div>

    <div class="parcacik" style="left:53%;animation-duration:8s"></div>
    <div class="parcacik" style="left:64%;animation-duration:7s;animation-delay:2s"></div>
    <div class="parcacik" style="left:75%;animation-duration:9s;animation-delay:1s"></div>
    <div class="parcacik" style="left:86%;animation-duration:6s"></div>
    <div class="parcacik" style="left:94%;animation-duration:8s;animation-delay:3s"></div>

    <!-- ŞEHİR -->
    <div class="sehir">

    </div>

    <!-- GRID -->
    <div class="cizgiler"></div>
    <div class="zemin"></div>

    <!-- GERİ -->
    <a class="geri" href="oyunlar.html">← Oyunlar</a>

    <!-- ÜST -->
    <div class="ust">
        <h1 class="baslik">🏃 KAÇ!</h1>
        <div class="yapimci">Ali tarafından yapılmıştır</div>

        <div class="bilgi">
            <span>Skor: <b id="skor">0</b></span>
            <span>Rekor: <b id="rekor">0</b></span>
        </div>
    </div>

    <!-- OYUNCU -->
    <div id="oyuncu" class="kosuyor">

        <div class="karakter">

            <div class="kafa"></div>

            <div class="govde"></div>

            <div class="kol kol-sol"></div>
            <div class="kol kol-sag"></div>

            <div class="bacak bacak-sol"></div>
            <div class="bacak bacak-sag"></div>

            <div class="enerji-izi"></div>

        </div>
    </div>

    <!-- BAŞLAT -->
    <button id="baslat" class="baslat">
        ▶ BAŞLAT
    </button>

    <!-- KONTROLLER -->
    <div class="kontroller">

        <div class="kontrolGrup">
            <button id="sol" class="kontrol">◀</button>
            <button id="sag" class="kontrol">▶</button>
        </div>

        <button id="ziplama" class="kontrol ziplama">
            ⬆ ZIPLA
        </button>

    </div>

    <!-- OYUN SONU -->
    <div id="oyunSonu" class="oyunSonu">

        <div class="sonKutu">

            <h2>💥 Oyun Bitti!</h2>

            <p>Skorun: <b id="sonSkor">0</b></p>
            <p>Rekor: <b id="sonRekor">0</b></p>

            <button id="tekrar" class="tekrar">
                🔄 Tekrar Oyna
            </button>

        </div>

    </div>

</div>

<script>

/* =========================
   DEĞİŞKENLER
========================= */

const oyunAlani = document.getElementById("oyunAlani");
const oyuncu = document.getElementById("oyuncu");

const skorYazi = document.getElementById("skor");
const rekorYazi = document.getElementById("rekor");

const baslat = document.getElementById("baslat");

const oyunSonu = document.getElementById("oyunSonu");
const sonSkor = document.getElementById("sonSkor");
const sonRekor = document.getElementById("sonRekor");

const tekrar = document.getElementById("tekrar");

const ziplamaButonu = document.getElementById("ziplama");
const solButon = document.getElementById("sol");
const sagButon = document.getElementById("sag");

let oyunAktif = false;

let skor = 0;
let tamSkor = 0;

let rekor = Number(localStorage.getItem("kacRekor")) || 0;

rekorYazi.textContent = rekor;

let engeller = [];

let kalkanlar = [];

let sonZaman = 0;

let sonEngel = 0;
let sonKalkan = 0;

let oyuncuY = 0;
let oyuncuHizY = 0;

let yerde = true;
let ziplamaKuyrugu = false;

let yatayYon = 0;

let oyuncuX = 105;

let kalkanAktif = false;
let kalkanTimer = null;

let sonrakiKalkanZamani = 15000;

/* =========================
   FİZİK
========================= */

const gravityUp = 0.72;
const gravityDown = 0.92;

const jumpPower = 16.5;
const maxDusmeHizi = 18;

/* =========================
   BAŞLANGIÇ
========================= */

function oyunuBaslat(){

    oyunAktif = true;

    skor = 0;
    tamSkor = 0;

    skorYazi.textContent = "0";

    oyuncuX = window.innerWidth < 600 ? 75 : 105;

    oyuncu.style.left = oyuncuX + "px";

    oyuncuY = 0;
    oyuncuHizY = 0;

    yerde = true;
    ziplamaKuyrugu = false;

    engeller.forEach(e=>{
        if(e.element) e.element.remove();
    });

    kalkanlar.forEach(k=>{
        if(k.element) k.element.remove();
    });

    engeller = [];
    kalkanlar = [];

    sonZaman = performance.now();

    sonEngel = performance.now();

    sonKalkan = performance.now();

    sonrakiKalkanZamani =
        15000 + Math.random()*2500;

    kalkanAktif = false;

    clearTimeout(kalkanTimer);

    oyuncu.classList.remove("kalkan");
    oyuncu.classList.remove("zipliyor");
    oyuncu.classList.remove("dusuyor");
    oyuncu.classList.add("kosuyor");

    oyunSonu.classList.remove("aktif");

    baslat.style.display = "none";

    requestAnimationFrame(oyunDongusu);
}

/* =========================
   ZIPLAMA
========================= */

function zipla(){

    if(!oyunAktif){
        return;
    }

    if(yerde){

        oyuncuHizY = jumpPower;

        yerde = false;

        oyuncu.classList.remove("kosuyor");
        oyuncu.classList.add("zipliyor");

    }else{

        /*
         Havada tekrar basılırsa
         küçük bir kuyruk oluşturur.
        */

        ziplamaKuyrugu = true;
    }
}

/* =========================
   FİZİK GÜNCELLE
========================= */

function fizikGuncelle(dt){

    if(oyuncuHizY > 0){

        oyuncuHizY -= gravityUp * dt;

    }else{

        oyuncuHizY -= gravityDown * dt;
    }

    if(oyuncuHizY < -maxDusmeHizi){

        oyuncuHizY = -maxDusmeHizi;
    }

    oyuncuY += oyuncuHizY * dt;

    if(oyuncuY <= 0){

        oyuncuY = 0;

        oyuncuHizY = 0;

        if(!yerde){

            yerde = true;

            oyuncu.classList.remove("zipliyor");
            oyuncu.classList.remove("dusuyor");
            oyuncu.classList.add("kosuyor");

            if(ziplamaKuyrugu){

                ziplamaKuyrugu = false;

                oyuncuHizY = jumpPower;

                yerde = false;

                oyuncu.classList.remove("kosuyor");
                oyuncu.classList.add("zipliyor");
            }
        }
    }

    if(!yerde){

        if(oyuncuHizY < 0){

            oyuncu.classList.remove("zipliyor");
            oyuncu.classList.add("dusuyor");

        }else{

            oyuncu.classList.remove("dusuyor");
            oyuncu.classList.add("zipliyor");
        }
    }

    oyuncu.style.bottom =
        (47 + oyuncuY) + "px";
}

/* =========================
   SAĞ SOL
========================= */

function yatayHareket(dt){

    if(!oyunAktif){
        return;
    }

    if(yatayYon === 0){
        return;
    }

    oyuncuX += yatayYon * 5.5 * dt;

    const minX = 25;

    const maxX =
        window.innerWidth * 0.38;

    if(oyuncuX < minX){
        oyuncuX = minX;
    }

    if(oyuncuX > maxX){
        oyuncuX = maxX;
    }

    oyuncu.style.left =
        oyuncuX + "px";
}

/* =========================
   SKOR
========================= */

function skorGuncelle(dt){

    tamSkor += dt * 0.7;

    skor = Math.floor(tamSkor / 10);

    skorYazi.textContent = skor;

    if(skor > rekor){

        rekor = skor;

        rekorYazi.textContent = rekor;

        localStorage.setItem(
            "kacRekor",
            rekor
        );
    }
}

/* =========================
   KAYA OLUŞTUR
========================= */

function engelOlustur(){

    const son =
        engeller[engeller.length - 1];

    if(
        son &&
        son.element &&
        son.right <
        oyunAlani.offsetWidth - 220
    ){
        return;
    }

    const el =
        document.createElement("div");

    el.className = "engel";

    const altFark =
        Math.random() * 4;

    el.style.bottom =
        (47 + altFark) + "px";

    oyunAlani.appendChild(el);

    const kaya = {

        element:el,

        right:
            oyunAlani.offsetWidth + 80,

        width:54
    };

    el.style.right =
        "-80px";

    engeller.push(kaya);
}

/* =========================
   KALKAN OLUŞTUR
========================= */

function kalkanOlustur(){

    if(!oyunAktif){
        return;
    }

    const el =
        document.createElement("div");

    el.className =
        "kalkanGuc";

    oyunAlani.appendChild(el);

    const guc = {

        element:el,

        right:
            oyunAlani.offsetWidth + 70,

        width:40
    };

    el.style.right =
        "-70px";

    kalkanlar.push(guc);
}

/* =========================
   ENGELLERİ HAREKET ETTİR
========================= */

function engellerGuncelle(dt){

    const hiz =
        Math.min(
            8.2 + tamSkor / 750,
            13
        );

    for(
        let i=engeller.length-1;
        i>=0;
        i--
    ){

        const kaya =
            engeller[i];

        kaya.right -=
            hiz * dt;

        kaya.element.style.right =
            (-kaya.right) + "px";

        if(kaya.right < -100){

            kaya.element.remove();

            engeller.splice(i,1);

            continue;
        }

        if(carpismaVar(kaya)){

            if(kalkanAktif){

                kaya.element.classList.add("yok");

                setTimeout(()=>{

                    if(kaya.element){
                        kaya.element.remove();
                    }

                },280);

                engeller.splice(i,1);

            }else{

                oyunuBitir();

                return;
            }
        }
    }
}

/* =========================
   KALKANLARI HAREKET ETTİR
========================= */

function kalkanlarGuncelle(dt){

    const hiz =
        Math.min(
            8.2 + tamSkor / 750,
            13
        );

    for(
        let i=kalkanlar.length-1;
        i>=0;
        i--
    ){

        const guc =
            kalkanlar[i];

        guc.right -=
            hiz * dt;

        guc.element.style.right =
            (-guc.right) + "px";

        if(guc.right < -100){

            guc.element.remove();

            kalkanlar.splice(i,1);

            continue;
        }

        if(gucToplandi(guc)){

            kalkanAktifEt();

            almaEfektiOlustur();

            guc.element.remove();

            kalkanlar.splice(i,1);
        }
    }
}

/* =========================
   ÇARPIŞMA
========================= */

function carpismaVar(kaya){

    const kayaRect =
        kaya.element.getBoundingClientRect();

    const oyuncuRect =
        oyuncu.getBoundingClientRect();

    const kayaHit = {

        left:kayaRect.left + 7,

        right:kayaRect.right - 7,

        top:kayaRect.top + 6,

        bottom:kayaRect.bottom - 3
    };

    const karakterHit = {

        left:oyuncuRect.left + 9,

        right:oyuncuRect.right - 9,

        top:oyuncuRect.top + 7,

        bottom:oyuncuRect.bottom - 4
    };

    return (

        karakterHit.left <
        kayaHit.right &&

        karakterHit.right >
        kayaHit.left &&

        karakterHit.top <
        kayaHit.bottom &&

        karakterHit.bottom >
        kayaHit.top
    );
}

/* =========================
   KALKAN TOPLAMA
========================= */

function gucToplandi(guc){

    const gucRect =
        guc.element.getBoundingClientRect();

    const oyuncuRect =
        oyuncu.getBoundingClientRect();

    const mesafeX =
        Math.abs(
            (gucRect.left + gucRect.width/2) -
            (oyuncuRect.left + oyuncuRect.width/2)
        );

    const mesafeY =
        Math.abs(
            (gucRect.top + gucRect.height/2) -
            (oyuncuRect.top + oyuncuRect.height/2)
        );

    return (
        mesafeX < 42 &&
        mesafeY < 65
    );
}

/* =========================
   KALKAN AKTİF
========================= */

function kalkanAktifEt(){

    kalkanAktif = true;

    oyuncu.classList.add("kalkan");

    clearTimeout(kalkanTimer);

    kalkanTimer =
        setTimeout(()=>{

            kalkanAktif = false;

            oyuncu.classList.remove("kalkan");

        },5000);
}

/* =========================
   KALKAN ALMA EFEKTİ
========================= */

function almaEfektiOlustur(){

    const rect =
        oyuncu.getBoundingClientRect();

    const efekt =
        document.createElement("div");

    efekt.className =
        "almaEfekti";

    efekt.style.left =
        (rect.left + rect.width/2) + "px";

    efekt.style.top =
        (rect.top + rect.height/2) + "px";

    oyunAlani.appendChild(efekt);

    setTimeout(()=>{

        efekt.remove();

    },600);
}

/* =========================
   OYUN DÖNGÜSÜ
========================= */

function oyunDongusu(zaman){

    if(!oyunAktif){
        return;
    }

    let dt =
        (zaman - sonZaman) / 16.67;

    if(dt > 2){
        dt = 2;
    }

    sonZaman = zaman;

    fizikGuncelle(dt);

    yatayHareket(dt);

    skorGuncelle(dt);

    engellerGuncelle(dt);

    if(!oyunAktif){
        return;
    }

    kalkanlarGuncelle(dt);

    if(
        zaman - sonEngel >
        Math.max(
            900,
            1350 - tamSkor * 1.05
        )
    ){

        engelOlustur();

        sonEngel = zaman;
    }

    if(
        zaman - sonKalkan >
        sonrakiKalkanZamani
    ){

        kalkanOlustur();

        sonKalkan = zaman;

        sonrakiKalkanZamani =
            15000 + Math.random()*2500;
    }

    requestAnimationFrame(oyunDongusu);
}

/* =========================
   OYUN BİTİR
========================= */

function oyunuBitir(){

    if(!oyunAktif){
        return;
    }

    oyunAktif = false;

    oyuncu.classList.remove("kosuyor");
    oyuncu.classList.remove("zipliyor");
    oyuncu.classList.remove("dusuyor");

    oyuncu.classList.remove("kalkan");

    kalkanAktif = false;

    clearTimeout(kalkanTimer);

    sonSkor.textContent =
        skor;

    sonRekor.textContent =
        rekor;

    oyunSonu.classList.add("aktif");
}

/* =========================
   YENİDEN BAŞLAT
========================= */

function yenidenBaslat(){

    oyunSonu.classList.remove("aktif");

    oyunuBaslat();
}

/* =========================
   BUTONLAR
========================= */

baslat.addEventListener(
    "click",
    oyunuBaslat
);

tekrar.addEventListener(
    "click",
    yenidenBaslat
);

ziplamaButonu.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        zipla();
    }
);

/* =========================
   SAĞ SOL
========================= */

solButon.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        yatayYon = -1;
    }
);

sagButon.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        yatayYon = 1;
    }
);

window.addEventListener(
    "pointerup",
    function(){

        yatayYon = 0;
    }
);

window.addEventListener(
    "pointercancel",
    function(){

        yatayYon = 0;
    }
);

/* =========================
   KLAVYE
========================= */

window.addEventListener(
    "keydown",
    function(e){

        if(
            e.code === "Space" ||
            e.code === "ArrowUp" ||
            e.code === "KeyW"
        ){

            e.preventDefault();

            zipla();
        }

        if(e.code === "ArrowLeft"){
            yatayYon = -1;
        }

        if(e.code === "ArrowRight"){
            yatayYon = 1;
        }

        if(
            e.code === "Enter" &&
            !oyunAktif
        ){

            if(
                !oyunSonu.classList.contains("aktif")
            ){
                oyunuBaslat();
            }
        }
    }
);

window.addEventListener(
    "keyup",
    function(e){

        if(
            e.code === "ArrowLeft" ||
            e.code === "ArrowRight"
        ){

            yatayYon = 0;
        }
    }
);

/* =========================
   EKRAN DEĞİŞİNCE
========================= */

window.addEventListener(
    "resize",
    function(){

        const maxX =
            window.innerWidth * .38;

        if(oyuncuX > maxX){

            oyuncuX = maxX;

            oyuncu.style.left =
                oyuncuX + "px";
        }
    }
);

</script>
