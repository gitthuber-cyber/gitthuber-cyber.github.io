<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hesap Makinesi</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .arka-plan {
            position: fixed;
            width: 500px;
            height: 500px;
            background: #6c2cff;
            filter: blur(150px);
            opacity: 0.35;
            border-radius: 50%;
        }

        .geri {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-size: 32px;
            z-index: 10;
        }

        /* İlk görünen küçük kutu */
        .menu-kutu {
            position: relative;
            z-index: 2;
            width: 280px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            text-align: center;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .menu-kutu h1 {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .ac {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #7c3cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .ac:hover {
            background: #955fff;
        }

        /* Hesap makinesi */
        .hesap-makinesi {
            display: none;
            position: relative;
            z-index: 2;
            width: 280px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .kapat {
            position: absolute;
            top: 8px;
            right: 12px;
            border: none;
            background: none;
            color: white;
            font-size: 25px;
            cursor: pointer;
        }

        .hesap-makinesi h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 15px;
        }

        #ekran {
            width: 100%;
            height: 50px;
            margin-bottom: 15px;
            padding: 10px;
            background: #0b1020;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 22px;
            text-align: right;
        }

        .tuslar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .tuslar button {
            height: 50px;
            border: none;
            border-radius: 8px;
            background: #7c3cff;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .tuslar button:hover {
            background: #955fff;
        }
    </style>
</head>

<body>

    <div class="arka-plan"></div>

    <!-- İlk sayfaya dön -->
    <a href="index.html" class="geri">←</a>

    <!-- İlk görünen kutu -->
    <div class="menu-kutu" id="menuKutu">

        <h1>Hesap Makinesi</h1>

        <button class="ac" onclick="hesapMakinesiniAc()">
            Aç
        </button>

    </div>

    <!-- Hesap makinesi -->
    <div class="hesap-makinesi" id="hesapMakinesi">

        <button class="kapat" onclick="hesapMakinesiniKapat()">×</button>

        <h1>Hesap Makinesi</h1>

        <input type="text" id="ekran" readonly>

        <div class="tuslar">

            <button onclick="temizle()">C</button>
            <button onclick="sayiYaz('/')">÷</button>
            <button onclick="sayiYaz('*')">×</button>
            <button onclick="sayiYaz('-')">−</button>

            <button onclick="sayiYaz('7')">7</button>
            <button onclick="sayiYaz('8')">8</button>
            <button onclick="sayiYaz('9')">9</button>
            <button onclick="sayiYaz('+')">+</button>

            <button onclick="sayiYaz('4')">4</button>
            <button onclick="sayiYaz('5')">5</button>
            <button onclick="sayiYaz('6')">6</button>
            <button onclick="hesapla()">=</button>

            <button onclick="sayiYaz('1')">1</button>
            <button onclick="sayiYaz('2')">2</button>
            <button onclick="sayiYaz('3')">3</button>
            <button onclick="sayiYaz('0')">0</button>

        </div>

    </div>

    <script>

        function hesapMakinesiniAc() {
            document.getElementById("menuKutu").style.display = "none";
            document.getElementById("hesapMakinesi").style.display = "block";
        }

        function hesapMakinesiniKapat() {
            document.getElementById("hesapMakinesi").style.display = "none";
            document.getElementById("menuKutu").style.display = "block";
        }

        function sayiYaz(sayi) {
            document.getElementById("ekran").value += sayi;
        }

        function temizle() {
            document.getElementById("ekran").value = "";
        }

        function hesapla() {
            let ekran = document.getElementById("ekran");

            if (ekran.value !== "") {
                ekran.value = eval(ekran.value);
            }
        }

    </script>

</body>
</html>
