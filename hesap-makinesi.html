<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hesap Makinesi & Kaç!</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Arial,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at top left,#32105f 0%,transparent 35%),
        radial-gradient(circle at bottom right,#101d65 0%,transparent 40%),
        #05030b;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 20% 30%,rgba(150,70,255,.12),transparent 25%),
        radial-gradient(circle at 80% 70%,rgba(40,100,255,.10),transparent 25%);
}

.panel{
    display:none;
    width:100%;
    max-width:430px;
    position:relative;
    z-index:5;
}

.panel.aktif{
    display:block;
}

.kutu{
    width:100%;
    padding:20px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:28px;
    background:rgba(15,10,28,.78);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        0 0 35px rgba(140,60,255,.12);
}

.panel-ust{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
}

.panel-baslik{
    font-size:20px;
    font-weight:800;
}

.kapat-btn{
    border:0;
    color:#fff;
    background:rgba(255,255,255,.08);
    padding:9px 13px;
    border-radius:12px;
    cursor:pointer;
}

#ekran{
    width:100%;
    height:85px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
    outline:none;
    padding:15px;
    margin-bottom:14px;
    color:#fff;
    background:rgba(0,0,0,.35);
    text-align:right;
    font-size:34px;
    font-weight:bold;
}

.butonlar{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.butonlar button{
    min-height:62px;
    border:0;
    border-radius:17px;
    color:#fff;
    background:rgba(255,255,255,.08);
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
}

.butonlar button:active{
    transform:scale(.94);
}

.butonlar .islem{
    background:rgba(130,55,255,.28);
}

.butonlar .temizle{
    background:rgba(255,70,90,.22);
}

.butonlar .esittir{
    background:linear-gradient(135deg,#793cff,#4b55ff);
}


/* =========================
   OYUN
========================= */

.oyun-kontrol{
    display:flex;
    justify-content:center;
    margin-bottom:12px;
}

#baslatBtn,
#tekrarOyna{
    border:0;
    border-radius:14px;
    padding:11px 18px;
    color:#fff;
    background:linear-gradient(135deg,#7c3cff,#4f5cff);
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.oyun-alani{
    position:relative;
    height:330px;
    overflow:hidden;
    border-radius:22px;
    border:1px solid rgba(255,255,255,.1);
    background:
        radial-gradient(circle at 75% 20%,rgba(125,80,255,.18),transparent 25%),
        linear-gradient(#080713,#0b0920);
    box-shadow:inset 0 0 50px rgba(0,0,0,.5);
    touch-action:none;
    user-select:none;
}

.ay{
    position:absolute;
    width:65px;
    height:65px;
    right:35px;
    top:30px;
    border-radius:50%;
    background:#eee9ff;
    box-shadow:0 0 30px rgba(230,220,255,.35);
}

.ay::after{
    content:"";
    position:absolute;
    width:60px;
    height:60px;
    left:-14px;
    top:-7px;
    border-radius:50%;
    background:#090817;
}

.zemin{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:45px;
    background:linear-gradient(180deg,#20134d,#100c25);
    border-top:2px solid rgba(150,100,255,.5);
}


/* =========================
   YENİ KARAKTER
========================= */

#oyuncu{
    position:absolute;
    left:65px;
    bottom:45px;
    width:48px;
    height:78px;
    z-index:4;

    --bacak-sol:12deg;
    --bacak-sag:-12deg;
    --kol-sol:22deg;
    --kol-sag:-22deg;
    --govdeY:0px;
    --govdeRot:0deg;

    transform:translate3d(0,0,0);
    transform-origin:center bottom;
    will-change:transform;
}

.oyuncu-golge{
    position:absolute;
    left:5px;
    bottom:-5px;
    width:38px;
    height:8px;
    border-radius:50%;
    background:rgba(0,0,0,.45);
    filter:blur(3px);
    transition:.12s;
}

.oyuncu-kafa{
    position:absolute;
    top:0;
    left:10px;
    width:28px;
    height:28px;
    border-radius:50%;
    background:linear-gradient(145deg,#fff,#b9b8c8);
    box-shadow:
        0 0 8px rgba(255,255,255,.2),
        inset -4px -4px 5px rgba(80,60,130,.15);
    z-index:4;
}

.oyuncu-kafa::before{
    content:"";
    position:absolute;
    left:5px;
    top:12px;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#161020;
    box-shadow:12px 0 #161020;
}

.oyuncu-kafa::after{
    content:"";
    position:absolute;
    left:9px;
    bottom:5px;
    width:10px;
    height:3px;
    border-radius:50%;
    background:#6c3de0;
}

.oyuncu-sac{
    position:absolute;
    left:8px;
    top:-2px;
    width:32px;
    height:13px;
    border-radius:14px 14px 4px 4px;
    background:linear-gradient(135deg,#9c55ff,#5423c8);
    z-index:5;
}

.oyuncu-govde{
    position:absolute;
    top:25px;
    left:14px;
    width:20px;
    height:31px;
    border-radius:8px 8px 5px 5px;
    background:linear-gradient(135deg,#a45aff,#5428cf);
    box-shadow:0 4px 8px rgba(50,20,130,.3);
    transform:translateY(var(--govdeY)) rotate(var(--govdeRot));
    transform-origin:center bottom;
    z-index:3;
}

.oyuncu-govde::after{
    content:"";
    position:absolute;
    left:5px;
    top:6px;
    width:10px;
    height:3px;
    border-radius:3px;
    background:rgba(255,255,255,.35);
}

.oyuncu-kol{
    position:absolute;
    top:28px;
    width:25px;
    height:8px;
    border-radius:8px;
    background:linear-gradient(90deg,#7040e8,#9c55ff);
    transform-origin:top center;
    transition:transform .035s linear;
    z-index:2;
}

.oyuncu-kol.sol{
    left:-4px;
    transform:rotate(var(--kol-sol));
}

.oyuncu-kol.sag{
    right:-4px;
    transform:rotate(var(--kol-sag));
}

.oyuncu-el{
    position:absolute;
    width:9px;
    height:9px;
    border-radius:50%;
    background:#c5b7e8;
    top:-1px;
}

.oyuncu-kol.sol .oyuncu-el{
    left:-3px;
}

.oyuncu-kol.sag .oyuncu-el{
    right:-3px;
}

.oyuncu-bacak{
    position:absolute;
    top:52px;
    width:9px;
    height:27px;
    border-radius:6px;
    background:linear-gradient(#6337d7,#4423a0);
    transform-origin:top center;
    transition:transform .035s linear;
    z-index:1;
}

.oyuncu-bacak.sol{
    left:12px;
    transform:rotate(var(--bacak-sol));
}

.oyuncu-bacak.sag{
    right:12px;
    transform:rotate(var(--bacak-sag));
}

.oyuncu-ayak{
    position:absolute;
    bottom:-2px;
    width:15px;
    height:7px;
    border-radius:6px;
    background:#33205f;
}

.oyuncu-bacak.sol .oyuncu-ayak{
    left:-3px;
}

.oyuncu-bacak.sag .oyuncu-ayak{
    right:-3px;
}


/* Zıplama pozu */

#oyuncu.havada .oyuncu-bacak.sol{
    transform:rotate(35deg);
}

#oyuncu.havada .oyuncu-bacak.sag{
    transform:rotate(-35deg);
}

#oyuncu.havada .oyuncu-kol.sol{
    transform:rotate(-38deg);
}

#oyuncu.havada .oyuncu-kol.sag{
    transform:rotate(38deg);
}

#oyuncu.havada .oyuncu-govde{
    --govdeY:-2px;
    --govdeRot:0deg;
}

#oyuncu.inis .oyuncu-govde{
    transform:translateY(4px) scaleY(.88) scaleX(1.08);
}


/* =========================
   SHIELD
========================= */

#oyuncu.kalkan::before{
    content:"";
    position:absolute;
    inset:-13px;
    border-radius:50%;
    border:3px solid #48e8ff;
    background:radial-gradient(
        circle,
        rgba(72,232,255,.13),
        rgba(72,232,255,.03) 60%,
        transparent 70%
    );
    box-shadow:
        0 0 12px #48e8ff,
        0 0 30px rgba(72,232,255,.65),
        inset 0 0 20px rgba(72,232,255,.3);
    animation:shieldDon 1s linear infinite;
    pointer-events:none;
}

@keyframes shieldDon{
    from{
        transform:rotate(0deg) scale(1);
    }
    50%{
        transform:rotate(180deg) scale(1.04);
    }
    to{
        transform:rotate(360deg) scale(1);
    }
}

#guc{
    display:none;
    position:absolute;
    width:29px;
    height:29px;
    right:-35px;
    bottom:110px;
    border-radius:50%;
    z-index:4;
    background:#48e8ff;
    box-shadow:
        0 0 10px #48e8ff,
        0 0 25px rgba(72,232,255,.8);
    text-align:center;
    line-height:29px;
    font-size:16px;
}


/* =========================
   ENGELLER
========================= */

.engel{
    position:absolute;
    bottom:45px;
    right:-65px;
    z-index:3;
    background:linear-gradient(135deg,#ff416c,#8b1e4d);
    box-shadow:0 0 18px rgba(255,50,100,.35);
}

.engel.kucuk{
    width:30px;
    height:42px;
    border-radius:8px 8px 3px 3px;
}

.engel.buyuk{
    width:43px;
    height:68px;
    border-radius:10px 10px 4px 4px;
}

.engel.yuvarlak{
    width:38px;
    height:38px;
    border-radius:50%;
}


/* =========================
   BİLGİ
========================= */

.oyun-bilgi{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:12px 3px 8px;
    font-size:14px;
    color:#cfc7e8;
}

#skor{
    color:#fff;
}

#zorluk{
    color:#b48cff;
}

.ipucu{
    text-align:center;
    font-size:12px;
    color:#8e879f;
    margin-top:8px;
}


/* =========================
   GREAT
========================= */

#greatYazisi{
    position:absolute;
    left:50%;
    top:38%;
    transform:translate(-50%,-50%) scale(.5);
    opacity:0;
    z-index:20;
    color:#fff;
    font-size:40px;
    font-weight:900;
    text-shadow:
        0 0 8px #fff,
        0 0 20px #8c4dff,
        0 0 45px #6735ff;
    pointer-events:none;
}

.great-goster{
    animation:greatAnim .8s ease-out;
}

@keyframes greatAnim{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.5) rotate(-8deg);
    }
    25%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.2) rotate(3deg);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(1.5);
    }
}


/* =========================
   OYUN BİTİŞ
========================= */

#oyunMesaji{
    position:absolute;
    inset:0;
    z-index:30;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    text-align:center;
    background:rgba(3,2,10,.76);
    backdrop-filter:blur(6px);
}

#oyunMesaji h2{
    font-size:30px;
}

#sonSkor{
    color:#bca5ff;
}


/* =========================
   RARE
========================= */

#rareScreen{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    align-items:center;
    justify-content:center;
    background:#000;
}

#rareScreen.aktif{
    display:flex;
}

.rare-karakter{
    position:relative;
    width:150px;
    height:190px;
    opacity:0;
    transform:translateY(80px) scale(.7);
}

.rare-karakter.giris{
    animation:karakterGelir 1s ease forwards;
}

.rare-kafa{
    position:absolute;
    left:35px;
    top:15px;
    width:80px;
    height:80px;
    border:4px solid #fff;
    border-radius:50%;
    background:#080808;
    box-shadow:0 0 30px rgba(255,255,255,.5);
}

.rare-goz{
    position:absolute;
    top:27px;
    width:13px;
    height:20px;
    border-radius:50%;
    background:#fff;
}

.rare-goz.sol{
    left:18px;
}

.rare-goz.sag{
    right:18px;
}

.rare-agiz{
    position:absolute;
    left:17px;
    bottom:14px;
    width:42px;
    height:18px;
    border-bottom:4px solid #fff;
    border-radius:50%;
}

.rare-govde{
    position:absolute;
    left:48px;
    top:92px;
    width:54px;
    height:65px;
    border:4px solid #fff;
    border-radius:20px;
}

.rare-kol{
    position:absolute;
    top:100px;
    width:45px;
    height:8px;
    background:#fff;
    border-radius:8px;
}

.rare-kol.sol{
    left:10px;
    transform:rotate(35deg);
}

.rare-kol.sag{
    right:10px;
    transform:rotate(-35deg);
}

#rareYazi{
    position:absolute;
    left:50%;
    bottom:20%;
    transform:translateX(-50%);
    width:90%;
    text-align:center;
    color:#fff;
    font-size:30px;
    font-weight:900;
}

@keyframes karakterGelir{
    0%{
        opacity:0;
        transform:translateY(80px) scale(.7);
    }
    60%{
        opacity:1;
    }
    100%{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@media(max-width:480px){
    body{
        padding:12px;
    }

    .kutu{
        padding:15px;
        border-radius:22px;
    }

    #ekran{
        height:75px;
        font-size:29px;
    }

    .butonlar{
        gap:8px;
    }

    .butonlar button{
        min-height:58px;
    }

    .oyun-alani{
        height:300px;
    }

    #rareYazi{
        font-size:23px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HESAP
========================= -->

<div id="hesapPanel" class="panel aktif">

<div class="kutu">

<div class="panel-ust">
<div class="panel-baslik">🧮 Hesap Makinesi</div>
<button id="hesapKapat" class="kapat-btn">✕ Kapat</button>
</div>

<input id="ekran" type="text" value="0" readonly>

<div class="butonlar">

<button class="temizle" onclick="temizle()">C</button>
<button onclick="sil()">⌫</button>
<button onclick="islemEkle('%')">%</button>
<button class="islem" onclick="islemEkle('/')">÷</button>

<button onclick="sayiEkle('7')">7</button>
<button onclick="sayiEkle('8')">8</button>
<button onclick="sayiEkle('9')">9</button>
<button class="islem" onclick="islemEkle('*')">×</button>

<button onclick="sayiEkle('4')">4</button>
<button onclick="sayiEkle('5')">5</button>
<button onclick="sayiEkle('6')">6</button>
<button class="islem" onclick="islemEkle('-')">−</button>

<button onclick="sayiEkle('1')">1</button>
<button onclick="sayiEkle('2')">2</button>
<button onclick="sayiEkle('3')">3</button>
<button class="islem" onclick="islemEkle('+')">+</button>

<button onclick="sayiEkle('0')">0</button>
<button onclick="sayiEkle('.')">.</button>
<button class="esittir" style="grid-column:span 2" onclick="hesapla()">=</button>

</div>
</div>
</div>


<!-- =========================
     OYUN
========================= -->

<div id="oyunPanel" class="panel">

<div class="kutu">

<div class="panel-ust">
<div class="panel-baslik">🏃 Kaç!</div>
<button id="oyunKapat" class="kapat-btn">✕ Kapat</button>
</div>

<div class="oyun-kontrol">
<button id="baslatBtn">▶️ Başlat</button>
</div>

<div class="oyun-bilgi">
<span>Skor: <b id="skor">0</b></span>
<span id="zorluk">Kolay</span>
</div>

<div id="oyunAlani" class="oyun-alani">

<div class="ay"></div>

<div id="oyuncu">

<div class="oyuncu-golge"></div>
<div class="oyuncu-sac"></div>
<div class="oyuncu-kafa"></div>

<div class="oyuncu-govde"></div>

<div class="oyuncu-kol sol">
<div class="oyuncu-el"></div>
</div>

<div class="oyuncu-kol sag">
<div class="oyuncu-el"></div>
</div>

<div class="oyuncu-bacak sol">
<div class="oyuncu-ayak"></div>
</div>

<div class="oyuncu-bacak sag">
<div class="oyuncu-ayak"></div>
</div>

</div>

<div id="guc">⚡</div>

<div id="greatYazisi">GREAT!</div>

<div id="oyunMesaji">

<h2>💀 Oyun Bitti</h2>

<div id="sonSkor">Skor: 0</div>

<button id="tekrarOyna">🔄 Tekrar Oyna</button>

</div>

<div class="zemin"></div>

</div>

<div class="ipucu">
Space / Dokun → Zıpla
</div>

</div>
</div>


<!-- =========================
     RARE
========================= -->

<div id="rareScreen">

<div class="rare-karakter">

<div class="rare-kafa">

<div class="rare-goz sol"></div>
<div class="rare-goz sag"></div>
<div class="rare-agiz"></div>

</div>

<div class="rare-govde"></div>
<div class="rare-kol sol"></div>
<div class="rare-kol sag"></div>

</div>

<div id="rareYazi"></div>

</div>


<script>

/* =========================
   ELEMENTLER
========================= */

const hesapPanel=document.getElementById("hesapPanel");
const oyunPanel=document.getElementById("oyunPanel");
const hesapKapat=document.getElementById("hesapKapat");
const oyunKapat=document.getElementById("oyunKapat");
const ekran=document.getElementById("ekran");
const baslatBtn=document.getElementById("baslatBtn");
const tekrarOyna=document.getElementById("tekrarOyna");
const oyunAlani=document.getElementById("oyunAlani");
const oyuncu=document.getElementById("oyuncu");
const skorYazi=document.getElementById("skor");
const sonSkor=document.getElementById("sonSkor");
const zorlukYazi=document.getElementById("zorluk");
const oyunMesaji=document.getElementById("oyunMesaji");
const greatYazisi=document.getElementById("greatYazisi");
const guc=document.getElementById("guc");


/* =========================
   MOD
========================= */

const oyunModu=
new URLSearchParams(location.search).get("oyun")==="1";

if(oyunModu){
    hesapPanel.classList.remove("aktif");
    oyunPanel.classList.add("aktif");
}else{
    oyunPanel.classList.remove("aktif");
    hesapPanel.classList.add("aktif");
}


/* =========================
   HESAP
========================= */

function sayiEkle(sayi){

    if(ekran.value==="0" || ekran.value==="Hata"){
        ekran.value=sayi;
        return;
    }

    ekran.value+=sayi;
}

function islemEkle(islem){

    if(ekran.value==="Hata"){
        ekran.value="0";
    }

    const son=ekran.value.slice(-1);

    if(["+","-","*","/","%"].includes(son)){
        ekran.value=ekran.value.slice(0,-1)+islem;
    }else{
        ekran.value+=islem;
    }
}

function temizle(){
    ekran.value="0";
}

function sil(){

    if(
        ekran.value.length<=1 ||
        ekran.value==="Hata"
    ){
        ekran.value="0";
        return;
    }

    ekran.value=ekran.value.slice(0,-1);
}

function hesapla(){

    try{

        let ifade=ekran.value.replace(/%/g,"/100");

        const sonuc=Function(
            '"use strict";return ('+ifade+')'
        )();

        if(!Number.isFinite(sonuc)){
            throw new Error();
        }

        ekran.value=
            Number.isInteger(sonuc)
            ? String(sonuc)
            : String(parseFloat(sonuc.toFixed(10)));

    }catch{
        ekran.value="Hata";
    }
}


/* =========================
   OYUN DEĞİŞKENLERİ
========================= */

let oyunAktif=false;
let oyunBitti=false;
let oyunFrame=null;

let skor=0;
let hiz=5;

let sonZaman=0;
let engelSayaci=0;
let gucSayaci=0;

let engeller=[];

let oncekiYuzluk=0;


/* =========================
   YENİ FİZİK
========================= */

/*
   Önceki:
   gravity  = 0.78
   jumpPower = 14.2

   Yeni:
   gravity  = 1.05
   jumpPower = 15

   Daha kısa ve daha tok zıplama.
*/

const gravity=1.05;
const jumpPower=15;
const maxDusmeHizi=20;

let oyuncuY=0;
let oyuncuHizY=0;
let yerde=true;

let sonZiplaZamani=0;
let ziplamaKuyrugu=false;

let sonYerTemasi=0;


/* =========================
   SHIELD
========================= */

let kalkanAktif=false;
let gucKalkanTimer=null;

function kalkanBaslat(){

    kalkanAktif=true;

    oyuncu.classList.add("kalkan");

    clearTimeout(gucKalkanTimer);

    gucKalkanTimer=setTimeout(()=>{

        kalkanAktif=false;

        oyuncu.classList.remove("kalkan");

    },5000);
}


/* =========================
   POZİSYON
========================= */

function oyuncuPozisyonunuUygula(){

    oyuncu.style.transform=
        `translate3d(0,${-oyuncuY}px,0)`;
}


/* =========================
   ZIPLAMA
========================= */

function zipla(){

    if(
        !oyunAktif ||
        oyunBitti
    ){
        return;
    }

    const simdi=performance.now();

    if(simdi-sonZiplaZamani<90){
        return;
    }

    if(!yerde){

        ziplamaKuyrugu=true;
        return;
    }

    sonZiplaZamani=simdi;

    yerde=false;

    oyuncuHizY=jumpPower;

    ziplamaKuyrugu=false;

    oyuncu.classList.remove("inis");
    oyuncu.classList.add("havada");
}


/* =========================
   FİZİK
========================= */

function fizikGuncelle(dt){

    oyuncuHizY-=gravity*dt;

    if(oyuncuHizY<-maxDusmeHizi){
        oyuncuHizY=-maxDusmeHizi;
    }

    oyuncuY+=oyuncuHizY*dt;


    if(oyuncuY<=0){

        oyuncuY=0;
        oyuncuHizY=0;

        if(!yerde){

            yerde=true;

            sonYerTemasi=performance.now();

            oyuncu.classList.remove("havada");

            oyuncu.classList.remove("inis");

            void oyuncu.offsetWidth;

            oyuncu.classList.add("inis");

            setTimeout(()=>{
                oyuncu.classList.remove("inis");
            },120);
        }

        if(ziplamaKuyrugu){

            ziplamaKuyrugu=false;

            zipla();
        }
    }

    oyuncuPozisyonunuUygula();
}


/* =========================
   KOŞU ANİMASYONU
========================= */

function karakterAnimasyonu(zaman){

    if(!oyunAktif){
        return;
    }

    if(!yerde){
        return;
    }

    const hizAnimasyonu=
        0.020+
        Math.min(skor/50000,.012);

    const kosu=
        Math.sin(zaman*hizAnimasyonu);

    const ters=
        Math.sin(zaman*hizAnimasyonu+Math.PI);

    oyuncu.style.setProperty(
        "--bacak-sol",
        (kosu*30+8)+"deg"
    );

    oyuncu.style.setProperty(
        "--bacak-sag",
        (ters*30-8)+"deg"
    );

    oyuncu.style.setProperty(
        "--kol-sol",
        (ters*25+18)+"deg"
    );

    oyuncu.style.setProperty(
        "--kol-sag",
        (kosu*25-18)+"deg"
    );

    oyuncu.style.setProperty(
        "--govdeY",
        Math.abs(kosu)*-2+"px"
    );

    oyuncu.style.setProperty(
        "--govdeRot",
        (kosu*2)+"deg"
    );
}


/* =========================
   KONTROLLER
========================= */

document.addEventListener("keydown",e=>{

    if(e.code==="Space"){

        e.preventDefault();

        zipla();
    }
});

oyunAlani.addEventListener(
    "pointerdown",
    e=>{

        if(e.target.closest("#oyunMesaji")){
            return;
        }

        e.preventDefault();

        zipla();

    },
    {passive:false}
);


/* =========================
   ENGEL
========================= */

function engelOlustur(){

    const engel=document.createElement("div");

    const r=Math.random();

    let tip;

    if(r<.30){
        tip="yuvarlak";
    }else if(r<.65){
        tip="buyuk";
    }else{
        tip="kucuk";
    }

    engel.className="engel "+tip;

    engel.style.right="-65px";

    oyunAlani.appendChild(engel);

    engeller.push({
        element:engel,
        right:-65
    });
}


/* =========================
   SHIELD GÜCÜ
========================= */

function gucOlustur(){

    if(guc.style.display==="block"){
        return;
    }

    guc.style.display="block";
    guc.style.right="-35px";
}

function gucuTopla(){

    if(guc.style.display!=="block"){
        return;
    }

    const a=oyuncu.getBoundingClientRect();
    const b=guc.getBoundingClientRect();

    if(
        a.left<b.right &&
        a.right>b.left &&
        a.top<b.bottom &&
        a.bottom>b.top
    ){

        guc.style.display="none";

        kalkanBaslat();
    }
}


/* =========================
   ÇARPIŞMA
========================= */

function carpismalar(){

    const r=oyuncu.getBoundingClientRect();

    const hitbox={
        left:r.left+8,
        right:r.right-8,
        top:r.top+7,
        bottom:r.bottom-3
    };

    for(
        let i=engeller.length-1;
        i>=0;
        i--
    ){

        const veri=engeller[i];

        const er=veri.element.getBoundingClientRect();

        const temas=
            hitbox.left<er.right &&
            hitbox.right>er.left &&
            hitbox.top<er.bottom &&
            hitbox.bottom>er.top;

        if(temas){

            if(kalkanAktif){

                veri.element.remove();

                engeller.splice(i,1);

                /*
                   Shield tek darbede kırılıyor.
                */

                kalkanAktif=false;

                oyuncu.classList.remove("kalkan");

            }else{

                oyunBitir();

                return;
            }
        }
    }

    gucuTopla();
}


/* =========================
   GREAT
========================= */

function greatKontrol(){

    const yuzluk=Math.floor(skor/100);

    if(yuzluk>oncekiYuzluk){

        oncekiYuzluk=yuzluk;

        greatYazisi.classList.remove("great-goster");

        void greatYazisi.offsetWidth;

        greatYazisi.classList.add("great-goster");
    }
}


/* =========================
   ZORLUK
========================= */

function zorlukGuncelle(){

    if(skor>=1000){
        zorlukYazi.textContent="🔥 Aşırı Zor";
    }else if(skor>=700){
        zorlukYazi.textContent="💀 Çok Zor";
    }else if(skor>=400){
        zorlukYazi.textContent="⚡ Zor";
    }else if(skor>=200){
        zorlukYazi.textContent="😈 Orta";
    }else{
        zorlukYazi.textContent="Kolay";
    }

    hiz=5+Math.min(skor/100,8);
}


/* =========================
   TEMİZLE
========================= */

function oyunDurumunuTemizle(){

    cancelAnimationFrame(oyunFrame);

    oyunFrame=null;

    oyunAktif=false;
    oyunBitti=false;

    skor=0;
    hiz=5;

    sonZaman=0;

    engelSayaci=0;
    gucSayaci=0;

    oyuncuY=0;
    oyuncuHizY=0;

    yerde=true;

    ziplamaKuyrugu=false;

    kalkanAktif=false;

    clearTimeout(gucKalkanTimer);

    gucKalkanTimer=null;

    oyuncu.classList.remove("havada");
    oyuncu.classList.remove("inis");
    oyuncu.classList.remove("kalkan");

    oyuncu.style.setProperty("--bacak-sol","12deg");
    oyuncu.style.setProperty("--bacak-sag","-12deg");
    oyuncu.style.setProperty("--kol-sol","22deg");
    oyuncu.style.setProperty("--kol-sag","-22deg");
    oyuncu.style.setProperty("--govdeY","0px");
    oyuncu.style.setProperty("--govdeRot","0deg");

    oyuncuPozisyonunuUygula();

    guc.style.display="none";

    engeller.forEach(x=>x.element.remove());

    engeller=[];

    document.querySelectorAll(".engel")
        .forEach(x=>x.remove());

    oyunMesaji.style.display="none";

    greatYazisi.classList.remove("great-goster");

    skorYazi.textContent="0";

    zorlukYazi.textContent="Kolay";

    baslatBtn.textContent="▶️ Başlat";
}


/* =========================
   OYUN DÖNGÜSÜ
========================= */

function oyunDongusu(zaman){

    if(
        !oyunAktif ||
        oyunBitti
    ){
        return;
    }

    if(!sonZaman){
        sonZaman=zaman;
    }

    const deltaMs=
        Math.min(
            zaman-sonZaman,
            50
        );

    sonZaman=zaman;

    const dt=
        Math.min(
            deltaMs/16.6667,
            2
        );


    /* SKOR */

    skor+=deltaMs*.015;

    const tamSkor=Math.floor(skor);

    skorYazi.textContent=tamSkor;

    greatKontrol();

    zorlukGuncelle();


    /* FİZİK */

    fizikGuncelle(dt);


    /* ANİMASYON */

    karakterAnimasyonu(zaman);


    /* ENGEL ÜRETİMİ */

    engelSayaci+=deltaMs;

    const aralik=
        Math.max(
            650,
            1250-tamSkor*1.4
        );

    if(engelSayaci>=aralik){

        engelSayaci=0;

        engelOlustur();
    }


    /* SHIELD ÜRETİMİ */

    gucSayaci+=deltaMs;

    if(gucSayaci>=7000){

        gucSayaci=0;

        if(Math.random()<.5){
            gucOlustur();
        }
    }


    /* ENGELLER */

    for(
        let i=engeller.length-1;
        i>=0;
        i--
    ){

        const veri=engeller[i];

        veri.right+=hiz*dt;

        veri.element.style.right=
            veri.right+"px";

        if(
            veri.right>
            oyunAlani.offsetWidth+100
        ){

            veri.element.remove();

            engeller.splice(i,1);
        }
    }


    /* SHIELD GÜCÜ */

    if(guc.style.display==="block"){

        let right=
            parseFloat(
                getComputedStyle(guc).right
            );

        if(!Number.isFinite(right)){
            right=-35;
        }

        right+=hiz*dt;

        guc.style.right=
            right+"px";

        if(
            right>
            oyunAlani.offsetWidth+50
        ){
            guc.style.display="none";
        }
    }


    /* ÇARPIŞMA */

    carpismalar();


    oyunFrame=
        requestAnimationFrame(
            oyunDongusu
        );
}


/* =========================
   BAŞLAT
========================= */

function oyunuBaslat(){

    oyunDurumunuTemizle();

    oyunAktif=true;

    oyunBitti=false;

    skor=0;
    hiz=5;

    oncekiYuzluk=0;

    sonZaman=0;

    baslatBtn.textContent=
        "⏸️ Oynuyorsun";

    oyunFrame=
        requestAnimationFrame(
            oyunDongusu
        );
}


/* =========================
   OYUN BİTİR
========================= */

function oyunBitir(){

    if(oyunBitti){
        return;
    }

    oyunBitti=true;
    oyunAktif=false;

    cancelAnimationFrame(oyunFrame);

    oyunFrame=null;

    baslatBtn.textContent="▶️ Başlat";

    sonSkor.textContent=
        "Skor: "+Math.floor(skor);

    /*
       %0.4 RARE
    */

    if(Math.random()<(1/250)){

        oyunMesaji.style.display="none";

        rareScreenBaslat();

    }else{

        oyunMesaji.style.display="flex";
    }
}


/* =========================
   RARE
========================= */

let rareTimerlar=[];

function rareTimerleriniTemizle(){

    rareTimerlar.forEach(clearTimeout);

    rareTimerlar=[];
}

function rareScreenBaslat(){

    const screen=
        document.getElementById("rareScreen");

    const karakter=
        document.querySelector(".rare-karakter");

    const yazi=
        document.getElementById("rareYazi");

    screen.classList.add("aktif");

    karakter.classList.add("giris");

    setTimeout(()=>{
        yazi.textContent="bu";
    },2000);

    setTimeout(()=>{
        yazi.textContent="bu normal";
    },2500);

    setTimeout(()=>{
        yazi.textContent="bu normal bir";
    },3000);

    setTimeout(()=>{
        yazi.textContent="bu normal bir oyun";
    },3500);

    setTimeout(()=>{
        yazi.textContent="bu normal bir oyun değil...";
    },4000);

    setTimeout(()=>{

        screen.classList.remove("aktif");

        yazi.textContent="";

        oyunMesaji.style.display="flex";

    },6500);
}


/* =========================
   BUTONLAR
========================= */

baslatBtn.addEventListener(
    "click",
    ()=>{
        if(!oyunAktif){
            oyunuBaslat();
        }
    }
);

tekrarOyna.addEventListener(
    "click",
    oyunuBaslat
);

hesapKapat.addEventListener(
    "click",
    ()=>{
        oyunDurumunuTemizle();
        location.replace("/index.html");
    }
);

oyunKapat.addEventListener(
    "click",
    ()=>{
        oyunDurumunuTemizle();
        location.replace("/oyunlar.html");
    }
);

</script>
